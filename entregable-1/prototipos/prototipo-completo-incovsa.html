;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <!-- ============ BARRA INTERNA ============ -->\n  <div class=\"barra\">\n    <div class=\"wrap barra-in\">\n      <div style=\"display:flex;align-items:center;gap:44px\">\n        <a href=\"#\" style=\"display:flex;align-items:center;gap:11px\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.6\"><\/rect>\n            <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n            <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <\/svg>\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:17px;color:#fff\">INCOVSA<\/span>\n          <span class=\"mono\" style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);border-left:1px solid rgba(232,206,114,.4);padding-left:11px\">Control logístico de bodega<\/span>\n        <\/a>\n        <div style=\"display:flex;align-items:center;gap:28px\">\n          <a href=\"#\" class=\"act\">Bodega<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"text-align:right\">\n          <p style=\"font-family:Archivo,sans-serif;font-size:14px;font-weight:600;color:#fff;line-height:1.3\">Usuario de ejemplo<\/p>\n          <p class=\"mono\" style=\"font-size:10px;color:var(--oro);letter-spacing:.1em\">BODEGA &#183; QUETZALTENANGO<\/p>\n        <\/div>\n        <div class=\"avatar\">UE<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ============ ENCABEZADO ============ -->\n  <section style=\"background:var(--papel);border-bottom:1px solid var(--linea);padding:38px 0\">\n    <div class=\"wrap\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:48px\">\n      <div>\n        <p class=\"mono\" style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color: {{acento}}\">Módulo de bodega &#183; tablero de preparación<\/p>\n        <h1 style=\"font-size:40px;margin-top:14px\">Pedidos por preparar<\/h1>\n        <p style=\"font-size:17px;color:var(--gris);margin-top:12px;max-width:780px\">Llegan en el orden en que los envía facturación. Arrastre un pedido completo, o una fila dentro de su tabla, para cambiar la prioridad: el nuevo orden y las marcas se ven al instante en todas las pantallas de la sede. Esta misma pantalla es la que se proyecta para el personal de bodega.<\/p>\n      <\/div>\n      <span class=\"pill\">{{enCola}} PEDIDOS EN COLA<\/span>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:34px 0 80px\">\n    <div class=\"wrap\">\n\n      <template data-sc-for=\"pedidos\" data-as=\"p\">\n        <article class=\"pedido {{p.clase}}\" draggable=\"true\" onDragStart=\"{{p.iniciar}}\" onDragOver=\"{{p.encima}}\" onDragLeave=\"{{p.sale}}\" onDrop=\"{{p.soltar}}\" onDragEnd=\"{{p.fin}}\">\n          <div class=\"pedido-top\">\n            <div style=\"display:flex;align-items:flex-start;gap:14px\">\n              <span class=\"grip\" aria-hidden=\"true\" style=\"margin-top:4px\">\n                <svg width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"currentColor\"><circle cx=\"2.5\" cy=\"3\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"3\" r=\"1.4\"><\/circle><circle cx=\"2.5\" cy=\"8\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"8\" r=\"1.4\"><\/circle><circle cx=\"2.5\" cy=\"13\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"13\" r=\"1.4\"><\/circle><\/svg>\n              <\/span>\n              <div>\n                <h2 style=\"font-size:24px\">{{p.titulo}}<\/h2>\n                <p class=\"mono\" style=\"font-size:13px;color:var(--gris);margin-top:8px;letter-spacing:.06em\">{{p.meta}}<\/p>\n              <\/div>\n            <\/div>\n            <span class=\"etiqueta\">{{p.destino}}<\/span>\n          <\/div>\n\n          <table>\n            <thead>\n              <tr>\n                <th style=\"width:54px\"><\/th>\n                <th style=\"width:90px\">SKU<\/th>\n                <th>Producto<\/th>\n                <th style=\"width:140px;text-align:right\">Cantidad (kg)<\/th>\n                <th style=\"width:190px;text-align:right\">Unidades<\/th>\n                <th style=\"width:90px;text-align:right\">Listo<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <template data-sc-for=\"p.lineas\" data-as=\"l\">\n                <tr class=\"{{l.clase}}\" draggable=\"true\" onDragStart=\"{{l.iniciar}}\" onDragOver=\"{{l.encima}}\" onDragLeave=\"{{l.sale}}\" onDrop=\"{{l.soltar}}\" onDragEnd=\"{{l.fin}}\">\n                  <td>\n                    <span class=\"grip\" aria-hidden=\"true\">\n                      <svg width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"currentColor\"><circle cx=\"2.5\" cy=\"3\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"3\" r=\"1.4\"><\/circle><circle cx=\"2.5\" cy=\"8\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"8\" r=\"1.4\"><\/circle><circle cx=\"2.5\" cy=\"13\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"13\" r=\"1.4\"><\/circle><\/svg>\n                    <\/span>\n                  <\/td>\n                  <td class=\"cod\">{{l.sku}}<\/td>\n                  <td class=\"prod nombre\">{{l.producto}}<\/td>\n                  <td class=\"kg\">{{l.cantidad}}<\/td>\n                  <td class=\"uni\">{{l.unidades}}<template data-sc-if=\"l.hayResto\"><span class=\"resto\"> + {{l.resto}} kg<\/span><\/template><\/td>\n                  <td style=\"text-align:right\">\n                    <input class=\"marca\" type=\"checkbox\" checked=\"{{l.listo}}\" onChange=\"{{l.alternar}}\" aria-label=\"Marcar como recogido\">\n                  <\/td>\n                <\/tr>\n              <\/template>\n            <\/tbody>\n          <\/table>\n\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:22px\">\n            <p class=\"mono\" style=\"font-size:14px;color:var(--gris);letter-spacing:.06em\">{{p.avance}}<\/p>\n            <button class=\"btn {{p.claseBoton}}\" disabled=\"{{p.bloqueado}}\">Pedido despachado<\/button>\n          <\/div>\n        <\/article>\n      <\/template>\n\n      <p style=\"font-size:16px;color:var(--gris);margin:26px 0\">El botón se habilita solo cuando todas las líneas están marcadas. Al cerrar un pedido de envío en camión su estado pasa a <strong style=\"color:var(--tinta)\">En Ruta<\/strong>. Al cerrar uno que el cliente recoge pasa a <strong style=\"color:var(--tinta)\">Despachado<\/strong>. La cantidad agrupa el mismo producto entre todos los clientes del pedido. Las unidades salen de dividir esa cantidad entre el Peso2 que quedó guardado en el pedido; lo que no completa una unidad se muestra como resto en kg.<\/p>\n\n      <template data-sc-if=\"marcar\">\n        <div class=\"pend\">\n          <p class=\"pend-t\">Pendiente de INCOVSA<\/p>\n          <p style=\"font-size:16px;color:#54451A\">Falta el tamaño y la ubicación de la pantalla donde se proyectará, y confirmar cómo se muestra una cantidad exacta: solo el número de unidades, como aquí, o con «+ 0 kg». El marcado no registra quién lo hizo.<\/p>\n        <\/div>\n      <\/template>\n\n    <\/div>\n  <\/section>\n<\/div>\n<\/x-dc><script type=\"text/x-dc\" data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#E8CE72\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"},\"$preview\":{\"width\":1440,\"height\":2000}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      pedArrastrado: null,\n      pedSobre: null,\n      linArrastrada: null,\n      linSobre: null,\n      pedidos: [\n        {\n          titulo: 'Pedido 1 · Envío en camión',\n          meta: 'RUTA 1 · CAMIÓN 1 · PILOTO DE EJEMPLO 1 · TOTAL 3,460 KG',\n          destino: 'Pasa a En Ruta',\n          lineas: [\n            { sku: '6960', producto: 'SODA CAUSTICA-MEX-SAC/0025KG-6960', cantidad: '750', unidades: '30', listo: true },\n            { sku: '6241', producto: 'SULFATO DE SODIO-CHI-SAC/0050KG-6241', cantidad: '1,800', unidades: '36', listo: true },\n            { sku: '9238', producto: 'ACIDO FORMICO-CHI-GAR/0035KG-9238', cantidad: '350', unidades: '10', listo: false },\n            { sku: '0163', producto: 'NEGRO SULFUROSO HIGH QUALITY-CHI-SAC/0025KG-0163', cantidad: '60', unidades: '2', resto: '10', listo: false },\n            { sku: '6830', producto: 'HIDROSULFITO DE SODIO-CHI-TON/0050KG-6830', cantidad: '500', unidades: '10', listo: false }\n          ]\n        },\n        {\n          titulo: 'Pedido 2 · Cliente recoge en bodega',\n          meta: 'SIN CAMIÓN · TOTAL 250 KG',\n          destino: 'Pasa a Despachado',\n          lineas: [\n            { sku: '6241', producto: 'SULFATO DE SODIO-CHI-SAC/0050KG-6241', cantidad: '250', unidades: '5', listo: true }\n          ]\n        }\n      ]\n    };\n  }\n  moverPedido(desde, hasta) {\n    if (desde === null || hasta === null || desde === hasta) return;\n    var xs = this.state.pedidos.slice();\n    var m = xs.splice(desde, 1)[0];\n    xs.splice(hasta, 0, m);\n    this.setState({ pedidos: xs, pedArrastrado: null, pedSobre: null });\n  }\n  moverLinea(ip, desde, hasta) {\n    if (desde === null || hasta === null || desde === hasta) return;\n    var xs = this.state.pedidos.slice();\n    var ls = xs[ip].lineas.slice();\n    var m = ls.splice(desde, 1)[0];\n    ls.splice(hasta, 0, m);\n    xs[ip] = Object.assign({}, xs[ip], { lineas: ls });\n    this.setState({ pedidos: xs, linArrastrada: null, linSobre: null });\n  }\n  alternarLinea(ip, il) {\n    var xs = this.state.pedidos.slice();\n    var ls = xs[ip].lineas.slice();\n    ls[il] = Object.assign({}, ls[il], { listo: !ls[il].listo });\n    xs[ip] = Object.assign({}, xs[ip], { lineas: ls });\n    this.setState({ pedidos: xs });\n  }\n  renderVals() {\n    var self = this;\n    var st = this.state;\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      enCola: String(st.pedidos.length),\n      pedidos: st.pedidos.map(function (p, ip) {\n        var listas = p.lineas.filter(function (l) { return l.listo; }).length;\n        var completo = listas === p.lineas.length;\n        return {\n          titulo: p.titulo,\n          meta: p.meta,\n          destino: p.destino,\n          avance: 'PREPARADAS ' + listas + ' DE ' + p.lineas.length + ' LÍNEAS',\n          claseBoton: completo ? 'btn-p' : 'btn-off',\n          bloqueado: !completo,\n          clase: st.pedArrastrado === ip ? 'arrastrando' : (st.pedSobre === ip ? 'encima' : ''),\n          iniciar: function (e) { e.stopPropagation(); if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', 'p' + ip); } catch (err) {} } self.setState({ pedArrastrado: ip }); },\n          encima: function (e) { e.preventDefault(); if (st.pedArrastrado !== null && st.pedSobre !== ip) self.setState({ pedSobre: ip }); },\n          sale: function () { if (st.pedSobre === ip) self.setState({ pedSobre: null }); },\n          soltar: function (e) { e.preventDefault(); e.stopPropagation(); self.moverPedido(st.pedArrastrado, ip); },\n          fin: function () { self.setState({ pedArrastrado: null, pedSobre: null }); },\n          lineas: p.lineas.map(function (l, il) {\n            var aqui = st.linArrastrada && st.linArrastrada.p === ip ? st.linArrastrada.l : null;\n            var marcada = st.linSobre && st.linSobre.p === ip ? st.linSobre.l : null;\n            return {\n              sku: l.sku,\n              producto: l.producto,\n              cantidad: l.cantidad,\n              unidades: l.unidades,\n              hayResto: !!l.resto,\n              resto: l.resto || '',\n              listo: l.listo,\n              clase: (aqui === il ? 'arrastrando' : (marcada === il ? 'encima' : '')) + (l.listo ? ' lista' : ''),\n              alternar: function () { self.alternarLinea(ip, il); },\n              iniciar: function (e) { e.stopPropagation(); if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', ip + '-' + il); } catch (err) {} } self.setState({ linArrastrada: { p: ip, l: il } }); },\n              encima: function (e) { e.preventDefault(); e.stopPropagation(); if (st.linArrastrada && st.linArrastrada.p === ip) self.setState({ linSobre: { p: ip, l: il } }); },\n              sale: function () { if (marcada === il) self.setState({ linSobre: null }); },\n              soltar: function (e) { e.preventDefault(); e.stopPropagation(); if (st.linArrastrada && st.linArrastrada.p === ip) self.moverLinea(ip, st.linArrastrada.l, il); },\n              fin: function (e) { e.stopPropagation(); self.setState({ linArrastrada: null, linSobre: null }); }\n            };\n          })\n        };\n      })\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Ruta.dc.html": {"titulo": "Módulo de Ruta", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.06;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1200px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .barra{background:var(--verde900);height:72px;display:flex;align-items:center}\n    .barra-in{display:flex;align-items:center;justify-content:space-between;width:100%;gap:40px}\n    .barra a{color:#D6D2C7;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .barra a:hover{color:var(--oro)}\n    .barra a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .avatar{width:36px;height:36px;border-radius:50%;background:var(--verde500);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:700;font-size:13px}\n    .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:28px 30px}\n    .rotulo{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);display:block;margin-bottom:7px}\n    .campo{width:100%;font-family:Archivo,sans-serif;font-size:15px;padding:12px 14px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;color:var(--tinta)}\n    .campo:focus{outline:2px solid var(--verde500);outline-offset:-1px}\n    .campo.fijo{background:#F2F0EA;color:var(--gris)}\n    .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}\n    table{width:100%;border-collapse:collapse;background:var(--papel);border:1px solid var(--linea)}\n    th{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);text-align:left;padding:15px 18px;border-bottom:1px solid var(--linea);font-weight:500}\n    td{padding:17px 18px;border-bottom:1px solid var(--linea);vertical-align:middle;font-size:17px}\n    tr:last-child td{border-bottom:0}\n    .num{text-align:right;font-family:\"IBM Plex Mono\",monospace;font-size:16px}\n    .orden{font-family:Archivo,sans-serif;font-weight:800;font-size:22px;color:var(--verde700)}\n    .sector{font-family:\"IBM Plex Mono\",monospace;font-size:14px;color:var(--gris)}\n    tfoot td{background:rgba(47,139,76,.07);font-family:Archivo,sans-serif;font-weight:700;border-top:1px solid var(--verde500)}\n    .mini{font-family:Archivo,sans-serif;font-size:12px;font-weight:600;padding:6px 10px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;cursor:pointer;color:var(--gris)}\n    .mini:hover{border-color:var(--verde500);color:var(--verde700)}\n    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:15px 28px;border-radius:2px;border:0;cursor:pointer}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900)}\n    .btn-l{background:transparent;color:var(--gris);border:1.5px solid var(--linea)}\n    .aviso{display:flex;align-items:flex-start;gap:12px;padding:15px 18px;border-radius:2px;font-size:15px;border-left:3px solid;background:rgba(47,139,76,.09);border-color:var(--verde500);color:#1C5030}\n    .pill{display:inline-flex;align-items:center;gap:8px;font-family:\"IBM Plex Mono\",monospace;font-size:11px;letter-spacing:.12em;padding:7px 12px;border-radius:2px;background:rgba(47,139,76,.14);color:var(--verde700)}\n    .llave{display:inline-flex;align-items:center;gap:7px;font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.14em;padding:6px 11px;border-radius:2px;background:rgba(201,162,39,.16);color:#7A6014}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:24px 26px;border-radius:2px;display:flex;flex-direction:column;gap:9px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12}\n    tbody tr{cursor:grab}\n    tbody tr:active{cursor:grabbing}\n    tbody tr.arrastrando{opacity:.34}\n    tbody tr.encima td{box-shadow:inset 0 3px 0 var(--verde500)}\n    .grip{display:inline-flex;align-items:center;color:var(--gris);opacity:.45;margin-right:10px;vertical-align:middle}\n    tbody tr:hover .grip{opacity:.95;color:var(--verde700)}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <!-- ============ BARRA INTERNA ============ -->\n  <div class=\"barra\">\n    <div class=\"wrap barra-in\">\n      <div style=\"display:flex;align-items:center;gap:44px\">\n        <a href=\"#\" style=\"display:flex;align-items:center;gap:11px\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.6\"><\/rect>\n            <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n            <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <\/svg>\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:17px;color:#fff\">INCOVSA<\/span>\n          <span class=\"mono\" style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);border-left:1px solid rgba(232,206,114,.4);padding-left:11px\">Control logístico de bodega<\/span>\n        <\/a>\n        <div style=\"display:flex;align-items:center;gap:28px\">\n          <a href=\"#\" class=\"act\">Ruta<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"text-align:right\">\n          <p style=\"font-family:Archivo,sans-serif;font-size:14px;font-weight:600;color:#fff;line-height:1.3\">Usuario de ejemplo<\/p>\n          <p class=\"mono\" style=\"font-size:10px;color:var(--oro);letter-spacing:.1em\">PILOTO &#183; QUETZALTENANGO<\/p>\n        <\/div>\n        <div class=\"avatar\">UE<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ============ ENCABEZADO ============ -->\n  <section style=\"background:var(--papel);border-bottom:1px solid var(--linea);padding:38px 0\">\n    <div class=\"wrap\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:48px\">\n      <div>\n        <p class=\"mono\" style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color: {{acento}}\">Módulo de ruta<\/p>\n        <h1 style=\"font-size:40px;margin-top:14px\">Ruta asignada<\/h1>\n        <p style=\"font-size:17px;color:var(--gris);margin-top:12px;max-width:700px\">Cada piloto ve solo las rutas que tiene asignadas. Puede acomodar los clientes durante la ruta; el orden que tengan al pulsar Pedido entregado se guarda como el recorrido.<\/p>\n      <\/div>\n      <span class=\"pill\">ESTADO &#183; EN RUTA<\/span>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:34px 0 80px\">\n    <div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:26px\">\n\n      <!-- ============ DATOS DE LA RUTA ============ -->\n      <div class=\"tarjeta\">\n        <h2 style=\"font-size:21px\">Datos de la ruta<\/h2>\n        <p style=\"font-size:15px;color:var(--gris);margin-top:6px;margin-bottom:20px\">El número es correlativo por sede y, junto con la fecha, se asigna cuando facturación envía el pedido a bodega.<\/p>\n        <div class=\"g4\">\n          <div><span class=\"rotulo\">Número de ruta<\/span><input class=\"campo fijo\" type=\"text\" value=\"1\" readonly><\/div>\n          <div><span class=\"rotulo\">Fecha<\/span><input class=\"campo fijo\" type=\"text\" value=\"21/09/2026\" readonly><\/div>\n          <div><span class=\"rotulo\">Camión<\/span><input class=\"campo fijo\" type=\"text\" value=\"Camión 1\" readonly><\/div>\n          <div><span class=\"rotulo\">Piloto<\/span><input class=\"campo fijo\" type=\"text\" value=\"Piloto de ejemplo 1\" readonly><\/div>\n        <\/div>\n      <\/div>\n\n      <!-- ============ CLIENTES DE LA RUTA ============ -->\n      <div class=\"tarjeta\">\n        <h2 style=\"font-size:21px\">Clientes de la ruta<\/h2>\n        <p style=\"font-size:15px;color:var(--gris);margin-top:6px;margin-bottom:20px\">Arrastre cada cliente para acomodarlo en el orden en que hará las entregas.<\/p>\n\n        <table>\n          <thead>\n            <tr>\n              <th style=\"width:130px\">Orden<\/th>\n              <th>Cliente<\/th>\n              <th>Sector<\/th>\n              <th style=\"width:130px;text-align:right\">Total (kg)<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <template data-sc-for=\"paradas\" data-as=\"p\">\n              <tr class=\"{{p.clase}}\" draggable=\"true\" onDragStart=\"{{p.iniciar}}\" onDragOver=\"{{p.encima}}\" onDragLeave=\"{{p.sale}}\" onDrop=\"{{p.soltar}}\" onDragEnd=\"{{p.fin}}\">\n                <td class=\"orden\"><span class=\"grip\" aria-hidden=\"true\"><svg width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"currentColor\"><circle cx=\"2.5\" cy=\"3\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"3\" r=\"1.4\"><\/circle><circle cx=\"2.5\" cy=\"8\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"8\" r=\"1.4\"><\/circle><circle cx=\"2.5\" cy=\"13\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"13\" r=\"1.4\"><\/circle><\/svg><\/span>{{p.orden}}<\/td>\n                <td>{{p.cliente}}<\/td>\n                <td class=\"sector\">{{p.sector}}<\/td>\n                <td class=\"num\">{{p.total}}<\/td>\n              <\/tr>\n            <\/template>\n          <\/tbody>\n          <tfoot>\n            <tr>\n              <td colspan=\"3\" style=\"text-align:right\">Total de la ruta<\/td>\n              <td class=\"num\" style=\"font-size:17px\">3,460<\/td>\n            <\/tr>\n          <\/tfoot>\n        <\/table>\n\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:24px\">\n          <p style=\"font-size:15px;color:var(--gris)\">Al confirmar, el pedido pasa a estado Entregado y la ruta queda en el registro histórico con su recorrido. Las devoluciones se registran después en el módulo de Inventario.<\/p>\n          <button class=\"btn btn-p\">Pedido entregado<\/button>\n        <\/div>\n      <\/div>\n\n    <\/div>\n  <\/section>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#E8CE72\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      arrastrada: null,\n      sobre: null,\n      paradas: [\n        { cliente: 'Cliente ejemplo 01', sector: 'sector 1 san andres xecul', total: '1,500' },\n        { cliente: 'Cliente ejemplo 02', sector: 'sector 2 san andres xucul', total: '600' },\n        { cliente: 'Cliente ejemplo 03', sector: 'sector 1 salcaja', total: '560' },\n        { cliente: 'Cliente ejemplo 04', sector: 'san felipe xecuyup', total: '800' }\n      ]\n    };\n  }\n  reordenar(desde, hasta) {\n    if (desde === null || hasta === null || desde === hasta) return;\n    var xs = this.state.paradas.slice();\n    var m = xs.splice(desde, 1)[0];\n    xs.splice(hasta, 0, m);\n    this.setState({ paradas: xs, arrastrada: null, sobre: null });\n  }\n  renderVals() {\n    var self = this;\n    var st = this.state;\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      paradas: st.paradas.map(function (p, i) {\n        return {\n          orden: String(i + 1),\n          cliente: p.cliente,\n          sector: p.sector,\n          total: p.total,\n          clase: st.arrastrada === i ? 'arrastrando' : (st.sobre === i ? 'encima' : ''),\n          iniciar: function (e) { if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {} } self.setState({ arrastrada: i }); },\n          encima: function (e) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; if (st.sobre !== i) self.setState({ sobre: i }); },\n          sale: function () { if (st.sobre === i) self.setState({ sobre: null }); },\n          soltar: function (e) { e.preventDefault(); self.reordenar(st.arrastrada, i); },\n          fin: function () { self.setState({ arrastrada: null, sobre: null }); }\n        };\n      })\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Inventario.dc.html": {"titulo": "Módulo de Inventario", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.06;font-weigh uppercase;color:#8A6D12}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html' oducto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <!-- ============ BARRA INTERNA ============ -->\n  <div class=\"barra\">\n    <div class=\"wrap barra-in\">\n      <div style=\"display:flex;align-items:center;gap:44px\">\n        <a href=\"#\" style=\"display:flex;align-items:center;gap:11px\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.6\"><\/rect>\n            <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n            <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <\/svg>\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:17px;color:#fff\">INCOVSA<\/span>\n          <span class=\"mono\" style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);border-left:1px solid rgba(232,206,114,.4);padding-left:11px\">Control logístico de bodega<\/span>\n        <\/a>\n        <div style=\"display:flex;align-items:center;gap:28px\">\n          <a href=\"Facturacion.dc.html\">Facturación<\/a>\n          <a href=\"Bodega.dc.html\">Bodega<\/a>\n          <a href=\"Ruta.dc.html\">Ruta<\/a>\n          <a href=\"#\" class=\"act\">Inventario<\/a>\n          <a href=\"Reportes.dc.html\">Reportes<\/a>\n          <a href=\"Configuracion.dc.html\">Configuración<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"text-align:right\">\n          <p style=\"font-family:Archivo,sans-serif;font-size:14px;font-weight:600;color:#fff;line-height:1.3\">Usuario de ejemplo<\/p>\n          <p class=\"mono\" style=\"font-size:10px;color:var(--oro);letter-spacing:.1em\">SOPORTE IT &#183; TODAS LAS SEDES<\/p>\n        <\/div>\n        <div class=\"avatar\">UE<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ============ ENCABEZADO ============ -->\n  <section style=\"background:var(--papel);border-bottom:1px solid var(--linea);padding:38px 0\">\n    <div class=\"wrap\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:48px\">\n      <div>\n        <p class=\"mono\" style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color: {{acento}}\">Módulo de inventario<\/p>\n        <h1 style=\"font-size:40px;margin-top:14px\">Existencias y movimientos<\/h1>\n        <p style=\"font-size:17px;color:var(--gris);margin-top:12px;max-width:780px\">Existencia actual de cada producto por sede, en kilogramos. Aquí se registran las compras, los ajustes, los traslados entre sedes y las devoluciones. Las ventas se descuentan solas cuando facturación envía un pedido a bodega.<\/p>\n      <\/div>\n      <span class=\"llave\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect><path d=\"M5.5 7V4.8a2.5 2.5 0 015 0V7\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n        GERENCIA Y SOPORTE IT\n      <\/span>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:34px 0 80px\">\n    <div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:26px\">\n\n      <!-- ============ EXISTENCIAS ============ -->\n      <div class=\"tarjeta\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px\">\n          <div>\n            <h2 style=\"font-size:21px\">Existencias<\/h2>\n            <p style=\"font-size:15px;color:var(--gris);margin-top:6px\">Cada sede lleva su propio inventario y las existencias no se suman entre sedes. No se controlan lotes ni ubicaciones.<\/p>\n          <\/div>\n          <div class=\"g2\" style=\"min-width:520px\">\n            <div><span class=\"rotulo\">Sede<\/span>\n              <select class=\"campo\"><option>Quetzaltenango<\/option><option>Guatemala<\/option><option>Escuintla<\/option><\/select>\n            <\/div>\n            <div><span class=\"rotulo\">Buscar producto<\/span>\n              <input class=\"campo\" type=\"text\" placeholder=\"Escriba el nombre del producto\">\n            <\/div>\n          <\/div>\n        <\/div>\n        <table>\n          <thead>\n            <tr>\n              <th style=\"width:90px\">SKU<\/th>\n              <th>Producto<\/th>\n              <th style=\"width:190px;text-align:right\">Existencia (kg)<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <template data-sc-for=\"existencias\" data-as=\"e\">\n              <tr>\n                <td class=\"cod\">{{e.sku}}<\/td>\n                <td class=\"prod\">{{e.producto}}<\/td>\n                <td class=\"num\">{{e.kg}}<\/td>\n              <\/tr>\n            <\/template>\n          <\/tbody>\n        <\/table>\n      <\/div>\n\n      <!-- ============ COMPRA, AJUSTE Y TRASLADO ============ -->\n      <div class=\"g3\">\n        <div class=\"tarjeta pila\">\n          <div>\n            <p class=\"etiqueta verde\">Entrada<\/p>\n            <h2 style=\"font-size:21px;margin-top:12px\">Registrar compra<\/h2>\n          <\/div>\n          <div><span class=\"rotulo\">Producto<\/span><input class=\"campo\" type=\"text\" value=\"SULFATO DE SODIO-CHI-SAC/0050KG-6241\"><\/div>\n          <div><span class=\"rotulo\">Sede que recibe<\/span><select class=\"campo\"><option>Quetzaltenango<\/option><option>Guatemala<\/option><option>Escuintla<\/option><\/select><\/div>\n          <div><span class=\"rotulo\">Cantidad (kg)<\/span><input class=\"campo\" type=\"text\" value=\"1,000\"><\/div>\n          <div><button class=\"btn btn-p\">Registrar compra<\/button><\/div>\n          <p class=\"nota\">Solo se registra la cantidad. Si el producto es nuevo, primero se crea en Configuración con su Peso2.<\/p>\n        <\/div>\n\n        <div class=\"tarjeta pila\">\n          <div>\n            <p class=\"etiqueta oro\">Entrada o salida<\/p>\n            <h2 style=\"font-size:21px;margin-top:12px\">Registrar ajuste<\/h2>\n          <\/div>\n          <div><span class=\"rotulo\">Producto<\/span><input class=\"campo\" type=\"text\" placeholder=\"Escriba el nombre del producto\"><\/div>\n          <div class=\"g2\">\n            <div><span class=\"rotulo\">Sede<\/span><select class=\"campo\"><option>Quetzaltenango<\/option><option>Guatemala<\/option><option>Escuintla<\/option><\/select><\/div>\n            <div><span class=\"rotulo\">Sentido<\/span><select class=\"campo\"><option>Sumar<\/option><option>Restar<\/option><\/select><\/div>\n          <\/div>\n          <div><span class=\"rotulo\">Cantidad (kg)<\/span><input class=\"campo\" type=\"text\" placeholder=\"0\"><\/div>\n          <div><span class=\"rotulo\">Motivo &#183; obligatorio<\/span><textarea class=\"campo\" rows=\"2\" placeholder=\"Sin motivo no se guarda el ajuste\"><\/textarea><\/div>\n          <div><button class=\"btn btn-p\">Registrar ajuste<\/button><\/div>\n          <p class=\"nota\">Un ajuste que resta no puede dejar la existencia por debajo de cero.<\/p>\n        <\/div>\n\n        <div class=\"tarjeta pila\">\n          <div>\n            <p class=\"etiqueta\">Salida y entrada<\/p>\n            <h2 style=\"font-size:21px;margin-top:12px\">Registrar traslado<\/h2>\n          <\/div>\n          <div><span class=\"rotulo\">Producto<\/span><input class=\"campo\" type=\"text\" value=\"ACIDO FORMICO-CHI-GAR/0035KG-9238\"><\/div>\n          <div class=\"g2\">\n            <div><span class=\"rotulo\">De la sede<\/span><select class=\"campo\"><option>Quetzaltenango<\/option><option>Guatemala<\/option><option>Escuintla<\/option><\/select><\/div>\n            <div><span class=\"rotulo\">A la sede<\/span><select class=\"campo\" value=\"gt\"><option value=\"xe\">Quetzaltenango<\/option><option value=\"gt\">Guatemala<\/option><option value=\"es\">Escuintla<\/option><\/select><\/div>\n          <\/div>\n          <div><span class=\"rotulo\">Cantidad (kg)<\/span><input class=\"campo\" type=\"text\" value=\"175\"><\/div>\n          <div><button class=\"btn btn-p\">Registrar traslado<\/button><\/div>\n          <p class=\"nota\">Se descuenta en la sede de origen y se suma en la de destino al mismo tiempo. No se puede trasladar más de lo que hay en el origen.<\/p>\n        <\/div>\n      <\/div>\n\n      <!-- ============ DEVOLUCIÓN ============ -->\n      <div class=\"tarjeta\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px\">\n          <div>\n            <p class=\"etiqueta verde\">Entrada<\/p>\n            <h2 style=\"font-size:21px;margin-top:12px\">Registrar devolución<\/h2>\n            <p style=\"font-size:15px;color:var(--gris);margin-top:6px;max-width:760px\">Se busca el pedido por su correlativo. Solo se aceptan pedidos Despachado o Entregado, de cualquier tipo. Lo devuelto en cada línea no puede superar lo vendido menos lo ya devuelto.<\/p>\n          <\/div>\n          <div style=\"min-width:300px\">\n            <span class=\"rotulo\">Pedido<\/span>\n            <input class=\"campo\" type=\"text\" value=\"Quetzaltenango &#183; pedido 1\">\n            <p class=\"mono\" style=\"font-size:12px;color:var(--gris);margin-top:8px\">ENVÍO EN CAMIÓN &#183; ESTADO ENTREGADO<\/p>\n          <\/div>\n        <\/div>\n        <table>\n          <thead>\n            <tr>\n              <th>Cliente<\/th>\n              <th>Producto<\/th>\n              <th style=\"width:130px;text-align:right\">Vendido (kg)<\/th>\n              <th style=\"width:150px;text-align:right\">Ya devuelto (kg)<\/th>\n              <th style=\"width:170px;text-align:right\">Devuelto ahora (kg)<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <template data-sc-for=\"lineasPedido\" data-as=\"l\">\n              <tr>\n                <td style=\"white-space:nowrap\">{{l.cliente}}<\/td>\n                <td class=\"prod\">{{l.producto}}<\/td>\n                <td class=\"num\">{{l.vendido}}<\/td>\n                <td class=\"num\">{{l.devuelto}}<\/td>\n                <td><input class=\"campo\" type=\"text\" value=\"{{l.ahora}}\" placeholder=\"0\" style=\"text-align:right\"><\/td>\n              <\/tr>\n            <\/template>\n          <\/tbody>\n        <\/table>\n        <div style=\"margin-top:20px\">\n          <span class=\"rotulo\">Motivo &#183; obligatorio<\/span>\n          <textarea class=\"campo\" rows=\"2\">El cliente no recibió uno de los toneles.<\/textarea>\n        <\/div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:20px\">\n          <p style=\"font-size:15px;color:var(--gris);max-width:820px\">Al guardar, lo devuelto vuelve a la existencia del mismo producto en la sede del pedido. El pedido conserva su estado y queda con la marca <strong style=\"color:var(--tinta)\">Con devolución<\/strong>, con el usuario y la fecha a la vista. La ruta no se modifica.<\/p>\n          <button class=\"btn btn-p\">Registrar devolución<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- ============ MOVIMIENTOS ============ -->\n      <div class=\"tarjeta\">\n        <h2 style=\"font-size:21px\">Movimientos recientes<\/h2>\n        <p style=\"font-size:15px;color:var(--gris);margin-top:6px;margin-bottom:20px\">Cada movimiento guarda tipo, producto, sede, cantidad, fecha, usuario y, cuando aplica, motivo o pedido. Al editar uno, la existencia se recalcula y la bitácora guarda los valores anteriores y los nuevos.<\/p>\n        <table>\n          <thead>\n            <tr>\n              <th style=\"width:120px\">Fecha<\/th>\n              <th style=\"width:170px\">Tipo<\/th>\n              <th>Producto<\/th>\n              <th style=\"width:150px\">Sede<\/th>\n              <th style=\"width:120px;text-align:right\">Kg<\/th>\n              <th style=\"width:220px\">Referencia<\/th>\n              <th style=\"width:80px\"><\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <template data-sc-for=\"movimientos\" data-as=\"m\">\n              <tr>\n                <td class=\"cod\">{{m.fecha}}<\/td>\n                <td><span class=\"etiqueta {{m.clase}}\">{{m.tipo}}<\/span><\/td>\n                <td class=\"prod\" style=\"font-size:13px\">{{m.producto}}<\/td>\n                <td style=\"font-size:15px;color:var(--gris)\">{{m.sede}}<\/td>\n                <td class=\"num {{m.signo}}\">{{m.kg}}<\/td>\n                <td style=\"font-size:14px;color:var(--gris)\">{{m.ref}}<\/td>\n                <td><button class=\"mini\">Editar<\/button><\/td>\n              <\/tr>\n            <\/template>\n          <\/tbody>\n        <\/table>\n      <\/div>\n\n      <template data-sc-if=\"marcar\">\n        <div class=\"pend\">\n          <p class=\"pend-t\">Pendiente de INCOVSA<\/p>\n          <p style=\"font-size:16px;color:#54451A\">La edición de movimientos está confirmada. Falta definir qué movimientos se pueden editar, porque las ventas, los traslados y las devoluciones nacen de otras operaciones; qué campos se cambian, si la edición exige motivo y si también se pueden eliminar movimientos.<\/p>\n        <\/div>\n      <\/template>\n\n    <\/div>\n  <\/section>\n<\/div>\n<\/x-dc><script type=\"text/x-dc\" data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#E8CE72\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"},\"$preview\":{\"width\":1440,\"height\":3000}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      existencias: [\n        { sku: '6960', producto: 'SODA CAUSTICA-MEX-SAC/0025KG-6960', kg: '700' },\n        { sku: '6241', producto: 'SULFATO DE SODIO-CHI-SAC/0050KG-6241', kg: '2,450' },\n        { sku: '9238', producto: 'ACIDO FORMICO-CHI-GAR/0035KG-9238', kg: '1,050' },\n        { sku: '0163', producto: 'NEGRO SULFUROSO HIGH QUALITY-CHI-SAC/0025KG-0163', kg: '440' },\n        { sku: '6830', producto: 'HIDROSULFITO DE SODIO-CHI-TON/0050KG-6830', kg: '1,550' }\n      ],\n      lineasPedido: [\n        { cliente: 'Cliente ejemplo 01', producto: 'SODA CAUSTICA-MEX-SAC/0025KG-6960', vendido: '500', devuelto: '0', ahora: '' },\n        { cliente: 'Cliente ejemplo 03', producto: 'NEGRO SULFUROSO HIGH QUALITY-CHI-SAC/0025KG-0163', vendido: '60', devuelto: '0', ahora: '' },\n        { cliente: 'Cliente ejemplo 03', producto: 'HIDROSULFITO DE SODIO-CHI-TON/0050KG-6830', vendido: '500', devuelto: '0', ahora: '50' },\n        { cliente: 'Cliente ejemplo 04', producto: 'SULFATO DE SODIO-CHI-SAC/0050KG-6241', vendido: '800', devuelto: '0', ahora: '' }\n      ],\n      movimientos: [\n        { fecha: '21/09 10:42', tipo: 'Venta', clase: 'rojo', producto: 'SODA CAUSTICA-MEX-SAC/0025KG-6960', sede: 'Quetzaltenango', kg: '−750', signo: 'menos', ref: 'Pedido 1' },\n        { fecha: '21/09 14:05', tipo: 'Compra', clase: 'verde', producto: 'SULFATO DE SODIO-CHI-SAC/0050KG-6241', sede: 'Quetzaltenango', kg: '+1,000', signo: 'mas', ref: '—' },\n        { fecha: '21/09 15:08', tipo: 'Devolución', clase: 'verde', producto: 'HIDROSULFITO DE SODIO-CHI-TON/0050KG-6830', sede: 'Quetzaltenango', kg: '+50', signo: 'mas', ref: 'Pedido 1 · el cliente no recibió uno de los toneles' },\n        { fecha: '21/09 16:20', tipo: 'Traslado enviado', clase: 'rojo', producto: 'ACIDO FORMICO-CHI-GAR/0035KG-9238', sede: 'Quetzaltenango', kg: '−175', signo: 'menos', ref: 'A Guatemala' },\n        { fecha: '21/09 16:20', tipo: 'Traslado recibido', clase: 'verde', producto: 'ACIDO FORMICO-CHI-GAR/0035KG-9238', sede: 'Guatemala', kg: '+175', signo: 'mas', ref: 'De Quetzaltenango' },\n        { fecha: '21/09 17:02', tipo: 'Ajuste', clase: 'oro', producto: 'NEGRO SULFUROSO HIGH QUALITY-CHI-SAC/0025KG-0163', sede: 'Quetzaltenango', kg: '−10', signo: 'menos', ref: 'Saco dañado en bodega' }\n      ]\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Reportes.dc.html": {"titulo": "Módulo de Reportes", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.06;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1320px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .barra{background:var(--verde900);height:72px;display:flex;align-items:center}\n    .barra-in{display:flex;align-items:center;justify-content:space-between;width:100%;gap:40px}\n    .barra a{color:#D6D2C7;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .barra a:hover{color:var(--oro)}\n    .barra a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .avatar{width:36px;height:36px;border-radius:50%;background:var(--verde500);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:700;font-size:13px}\n    .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:28px 30px}\n    .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}\n    .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}\n    .rotulo{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);display:block;margin-bottom:7px}\n    .campo{width:100%;font-family:Archivo,sans-serif;font-size:15px;padding:12px 14px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;color:var(--tinta)}\n    table{width:100%;border-collapse:collapse;background:var(--papel);border:1px solid var(--linea)}\n    th{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);text-align:left;padding:15px 18px;border-bottom:1px solid var(--linea);font-weight:500}\n    td{padding:16px 18px;border-bottom:1px solid var(--linea);vertical-align:middle;font-size:16px}\n    tr:last-child td{border-bottom:0}\n    .num{text-align:right;font-family:\"IBM Plex Mono\",monospace;font-size:16px}\n    .cod{font-family:\"IBM Plex Mono\",monospace;font-size:14px;color:var(--gris)}\n    tfoot td{background:rgba(47,139,76,.07);font-family:Archivo,sans-serif;font-weight:700;border-top:1px solid var(--verde500)}\n    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:Archivo,sans-serif;font-weight:700;font-size:14px;padding:12px 22px;border-radius:2px;border:0;cursor:pointer}\n    .btn-l{background:transparent;color:var(--verde700);border:1.5px solid var(--verde700)}\n    .btn-l:hover{background:var(--verde700);color:#fff}\n    .cifra{font-family:Archivo,sans-serif;font-weight:800;font-size:44px;color:var(--verde700);line-height:1}\n    .llave{display:inline-flex;align-items:center;gap:7px;font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.14em;padding:6px 11px;border-radius:2px;background:rgba(201,162,39,.16);color:#7A6014}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:26px 28px;border-radius:2px;display:flex;flex-direction:column;gap:10px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12}\n    .lin{height:11px;background:rgba(201,162,39,.3);border-radius:2px}\n    .lineas{display:flex;flex-direction:column;gap:9px;width:100%}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur ||
