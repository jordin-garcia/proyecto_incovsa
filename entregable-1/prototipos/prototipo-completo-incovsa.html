<script>
const PANTALLAS = {"Main.dc.html": {"titulo": "Inicio", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3,h4{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.04;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1200px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .eyebrow{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}\n    .nav{background:var(--verde900)}\n    .nav-in{display:flex;align-items:center;justify-content:space-between;height:88px;gap:48px}\n    .marca{display:flex;align-items:center;gap:13px}\n    .marca-n{font-family:Archivo,sans-serif;font-weight:800;font-size:23px;letter-spacing:.01em;color:#fff;line-height:1}\n    .marca-s{font-family:\"IBM Plex Mono\",monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px}\n    .menu{display:flex;align-items:center;gap:34px;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .menu a{color:#D6D2C7}\n    .menu a:hover{color:var(--oro)}\n    .menu a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .acceso{border:1px solid rgba(232,206,114,.45);color:var(--oro) !important;padding:11px 19px;border-radius:2px;display:flex;align-items:center;gap:9px}\n    .acceso:hover{background:rgba(232,206,114,.12)}\n    .btn{display:inline-flex;align-items:center;gap:11px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:17px 30px;border-radius:2px;border:0;cursor:pointer;letter-spacing:.01em}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900);color:#fff}\n    .btn-l{background:transparent;color:var(--verde700);border:1.5px solid var(--verde700)}\n    .btn-l:hover{background:var(--verde700);color:#fff}\n    .sec{padding:104px 0}\n    .cabeza{display:flex;align-items:flex-end;justify-content:space-between;gap:56px;padding-bottom:26px;border-bottom:1px solid var(--linea);margin-bottom:52px}\n    .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}\n    .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}\n    .card{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:30px;display:flex;flex-direction:column;gap:14px;transition:border-color .18s,transform .18s}\n    .card:hover{border-color:var(--verde500);transform:translateY(-3px)}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:26px 28px;border-radius:2px;display:flex;flex-direction:column;gap:9px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12;display:flex;align-items:center;gap:8px}\n    .foto{background:#E7E3D8;border:1.5px dashed #BDB7A8;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8A8474;text-align:center;padding:24px}\n    .foto-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase}\n    .pie{background:var(--verde900);color:#B6B2A7;padding:80px 0 44px;font-size:15px}\n    .pie h4{color:#fff;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-family:\"IBM Plex Mono\",monospace;font-weight:500;margin-bottom:20px}\n    .pie a{color:#B6B2A7}\n    .pie a:hover{color:var(--oro)}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <!-- ============ ENCABEZADO ============ -->\n  <header class=\"nav\">\n    <div class=\"wrap nav-in\">\n      <a href=\"#\" class=\"marca\">\n        <svg width=\"38\" height=\"38\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n          <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.4\"><\/rect>\n          <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n          <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <path d=\"M27 27v-6h1.6v6z\" fill=\"#2F8B4C\"><\/path>\n        <\/svg>\n        <span style=\"display:flex;flex-direction:column\">\n          <span class=\"marca-n\">INCOVSA<\/span>\n          <span class=\"marca-s\">Químicos<\/span>\n        <\/span>\n      <\/a>\n      <nav class=\"menu\">\n        <a href=\"#\" class=\"act\">Inicio<\/a>\n        <a href=\"#\">Quiénes somos<\/a>\n        <a href=\"#\">Industrias<\/a>\n        <a href=\"#\">Productos<\/a>\n        <a href=\"#\">Contacto<\/a>\n        <a href=\"#\" class=\"acceso\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect>\n            <path d=\"M5.5 7V4.8a2.5 2.5 0 015 0V7\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path>\n          <\/svg>\n          Acceso personal\n        <\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <!-- ============ PORTADA ============ -->\n  <section style=\"background:var(--verde900);color:#EDEAE1;padding:104px 0 0;overflow:hidden\">\n    <div class=\"wrap\" style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:72px;align-items:start\">\n      <div style=\"padding-bottom:104px\">\n        <p class=\"eyebrow\" style=\"color: {{acento}}\">Industria del Cuero Covadonga, S. A.<\/p>\n        <h1 style=\"font-size:78px;margin-top:26px;color:#fff\">Química que sostiene<br>a la industria<br>guatemalteca<\/h1>\n        <p style=\"font-size:21px;line-height:1.6;color:#C6C2B6;margin-top:30px;max-width:540px;text-wrap:pretty\">Compra, venta y distribución de productos químicos para nueve industrias del país. Más de treinta años abasteciendo al sector industrial y artesanal desde Quetzaltenango, Guatemala y Escuintla.<\/p>\n        <div style=\"display:flex;gap:16px;margin-top:42px\">\n          <a href=\"#\" class=\"btn btn-p\" style=\"background: {{acento}};color:#1A1A17\">\n            Ver catálogo de productos\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"square\"><\/path><\/svg>\n          <\/a>\n          <a href=\"#\" class=\"btn btn-l\" style=\"color:#EDEAE1;border-color:rgba(237,234,225,.4)\">Hablar con un asesor<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;flex-direction:column;gap:0;border-left:1px solid rgba(232,206,114,.25);margin-top:8px\">\n        <div style=\"padding:26px 0 26px 34px;border-bottom:1px solid rgba(237,234,225,.12)\">\n          <span class=\"mono\" style=\"font-size:44px;color:#fff;font-weight:500\">30+<\/span>\n          <p style=\"color:#A9A598;font-size:15px;margin-top:4px\">años en el mercado guatemalteco<\/p>\n        <\/div>\n        <div style=\"padding:26px 0 26px 34px;border-bottom:1px solid rgba(237,234,225,.12)\">\n          <span class=\"mono\" style=\"font-size:44px;color:#fff;font-weight:500\">09<\/span>\n          <p style=\"color:#A9A598;font-size:15px;margin-top:4px\">industrias atendidas<\/p>\n        <\/div>\n        <div style=\"padding:26px 0 26px 34px;border-bottom:1px solid rgba(237,234,225,.12)\">\n          <span class=\"mono\" style=\"font-size:44px;color:#fff;font-weight:500\">03<\/span>\n          <p style=\"color:#A9A598;font-size:15px;margin-top:4px\">bodegas de distribución<\/p>\n        <\/div>\n        <div style=\"padding:26px 0 26px 34px\">\n          <span class=\"mono\" style=\"font-size:44px;color:#fff;font-weight:500\">22<\/span>\n          <p style=\"color:#A9A598;font-size:15px;margin-top:4px\">departamentos con cobertura<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ INDUSTRIAS ============ -->\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"cabeza\">\n        <div>\n          <p class=\"eyebrow\" style=\"color: {{acento}}\">Industrias atendidas<\/p>\n          <h2 style=\"font-size:46px;margin-top:16px;max-width:620px\">Cada industria tiene su propio conjunto de productos<\/h2>\n        <\/div>\n        <a href=\"#\" class=\"mono\" style=\"font-size:13px;letter-spacing:.06em;white-space:nowrap;padding-bottom:6px;border-bottom:1.5px solid var(--verde700)\">Ver las nueve &#8594;<\/a>\n      <\/div>\n\n      <div class=\"g3\">\n        <a href=\"#\" class=\"card\" style=\"border-top:3px solid var(--verde700)\">\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.14em\">01 / CUERO<\/p>\n          <h3 style=\"font-size:25px\">Industria de cuero<\/h3>\n          <p style=\"font-size:16px;color:var(--gris);text-wrap:pretty\">Procesamiento de piel animal mediante curtido, para zapatos, bolsas, vestimenta, accesorios y tapizados.<\/p>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--verde700);margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">9 productos &#183; fase húmeda y seco<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\" style=\"border-top:3px solid var(--verde700)\">\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.14em\">02 / TEXTIL<\/p>\n          <h3 style=\"font-size:25px\">Industria textil<\/h3>\n          <p style=\"font-size:16px;color:var(--gris);text-wrap:pretty\">Manufactura de hilo, fibras naturales y sintéticas, telas y materiales para ropa y vestimenta.<\/p>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--verde700);margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">7 productos<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\" style=\"border-top:3px solid var(--verde700)\">\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.14em\">03 / CERERÍA<\/p>\n          <h3 style=\"font-size:25px\">Industria cerería<\/h3>\n          <p style=\"font-size:16px;color:var(--gris);text-wrap:pretty\">Elaboración de objetos cuya materia prima principal es la parafina, refinada y semirrefinada.<\/p>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--verde700);margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">5 productos<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\" style=\"border-top:3px solid var(--verde500)\">\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.14em\">04 / HULERA<\/p>\n          <h3 style=\"font-size:25px\">Industria hulera<\/h3>\n          <p style=\"font-size:16px;color:var(--gris);text-wrap:pretty\">Compra, venta, distribución y transformación de productos relacionados con el hule natural o sintético.<\/p>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--verde700);margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">5 productos<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\" style=\"border-top:3px solid var(--verde500)\">\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.14em\">05 / MEDICAMENTOS<\/p>\n          <h3 style=\"font-size:25px\">Industria de medicamentos<\/h3>\n          <p style=\"font-size:16px;color:var(--gris);text-wrap:pretty\">Fabricación, preparación y comercialización de productos químicos y medicamentos.<\/p>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--verde700);margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">7 productos<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\" style=\"border-top:3px solid var(--verde500)\">\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.14em\">06 / LIMPIEZA<\/p>\n          <h3 style=\"font-size:25px\">Industria de limpieza<\/h3>\n          <p style=\"font-size:16px;color:var(--gris);text-wrap:pretty\">Jabón, detergentes, cosméticos y otros productos químicos de aseo e higiene.<\/p>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--verde700);margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">4 productos<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\" style=\"border-top:3px solid var(--dorado)\">\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.14em\">07 / ALIMENTACIÓN ANIMAL<\/p>\n          <h3 style=\"font-size:25px\">Alimentación animal<\/h3>\n          <p style=\"font-size:16px;color:var(--gris);text-wrap:pretty\">Almacenamiento, procesamiento, conservación y servicios de alimentos de consumo animal.<\/p>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--verde700);margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">6 productos<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\" style=\"border-top:3px solid var(--dorado)\">\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.14em\">08 / TRATAMIENTO DE AGUA<\/p>\n          <h3 style=\"font-size:25px\">Tratamiento de agua<\/h3>\n          <p style=\"font-size:16px;color:var(--gris);text-wrap:pretty\">Operaciones físicas, químicas y biológicas para reducir la contaminación en aguas de proceso o residuales.<\/p>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--verde700);margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">6 productos<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\" style=\"border-top:3px solid var(--dorado)\">\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.14em\">09 / LAVANDERÍA<\/p>\n          <h3 style=\"font-size:25px\">Industria de lavandería<\/h3>\n          <p style=\"font-size:16px;color:var(--gris);text-wrap:pretty\">Lavado, secado, planchado y tintorería para empresas, hospitales, hoteles y restaurantes.<\/p>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--verde700);margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">7 productos<\/p>\n        <\/a>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ PRODUCTOS ============ -->\n  <section style=\"background:var(--papel);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);padding:104px 0\">\n    <div class=\"wrap\">\n      <div class=\"cabeza\">\n        <div>\n          <p class=\"eyebrow\" style=\"color: {{acento}}\">Catálogo informativo<\/p>\n          <h2 style=\"font-size:46px;margin-top:16px;max-width:620px\">Presentación, origen y uso de cada producto<\/h2>\n        <\/div>\n        <p style=\"font-size:15px;color:var(--gris);max-width:300px;text-align:right\">El catálogo es informativo. No se publican precios ni número de lote.<\/p>\n      <\/div>\n\n      <div class=\"g4\">\n        <article class=\"card\" style=\"padding:0;overflow:hidden\">\n          <div class=\"foto\" style=\"height:150px;border:0;border-bottom:1px dashed #BDB7A8\">\n            <span class=\"foto-t\">Fotografía<\/span>\n          <\/div>\n          <div style=\"padding:24px 26px 28px;display:flex;flex-direction:column;gap:12px;flex:1\">\n            <h3 style=\"font-size:19px;line-height:1.2\">Ácido Acético Glacial<\/h3>\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">Garrafa &#183; 30 kg<\/p>\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">IBC &#183; 1,000 kg<\/p>\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">IBC &#183; 1,050 kg<\/p>\n            <\/div>\n            <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.1em;margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">ORIGEN &#183; CHINA, USA<\/p>\n          <\/div>\n        <\/article>\n        <article class=\"card\" style=\"padding:0;overflow:hidden\">\n          <div class=\"foto\" style=\"height:150px;border:0;border-bottom:1px dashed #BDB7A8\">\n            <span class=\"foto-t\">Fotografía<\/span>\n          <\/div>\n          <div style=\"padding:24px 26px 28px;display:flex;flex-direction:column;gap:12px;flex:1\">\n            <h3 style=\"font-size:19px;line-height:1.2\">Soda Ash<\/h3>\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">Saco &#183; 25 kg<\/p>\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">Saco &#183; 40 kg<\/p>\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">Saco &#183; 50 kg<\/p>\n            <\/div>\n            <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.1em;margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">ORIGEN &#183; CHINA<\/p>\n          <\/div>\n        <\/article>\n        <article class=\"card\" style=\"padding:0;overflow:hidden\">\n          <div class=\"foto\" style=\"height:150px;border:0;border-bottom:1px dashed #BDB7A8\">\n            <span class=\"foto-t\">Fotografía<\/span>\n          <\/div>\n          <div style=\"padding:24px 26px 28px;display:flex;flex-direction:column;gap:12px;flex:1\">\n            <h3 style=\"font-size:19px;line-height:1.2\">Ácido Sulfúrico<\/h3>\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">Garrafa &#183; 50 kg<\/p>\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">IBC &#183; 1,600 kg<\/p>\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">Pipa &#183; 20,000 kg<\/p>\n            <\/div>\n            <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.1em;margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">ORIGEN &#183; GUATEMALA, SALVADOR<\/p>\n          <\/div>\n        <\/article>\n        <article class=\"card\" style=\"padding:0;overflow:hidden\">\n          <div class=\"foto\" style=\"height:150px;border:0;border-bottom:1px dashed #BDB7A8\">\n            <span class=\"foto-t\">Fotografía<\/span>\n          <\/div>\n          <div style=\"padding:24px 26px 28px;display:flex;flex-direction:column;gap:12px;flex:1\">\n            <h3 style=\"font-size:19px;line-height:1.2\">Sulfato de Cromo<\/h3>\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <p class=\"mono\" style=\"font-size:12px;color:var(--tinta)\">Saco &#183; 25 kg<\/p>\n            <\/div>\n            <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.1em;margin-top:auto;padding-top:14px;border-top:1px solid var(--linea)\">ORIGEN &#183; CHINA<\/p>\n          <\/div>\n        <\/article>\n      <\/div>\n\n      <template data-sc-if=\"marcar\">\n        <div class=\"pend\" style=\"margin-top:34px\">\n          <p class=\"pend-t\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 2l6 11H2z\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\/path><path d=\"M8 6.5v3\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n            Pendiente de INCOVSA\n          <\/p>\n          <p style=\"font-size:16px;color:#54451A\">Confirmar qué productos se publican en el sitio. El Ing. William indicó que no todos los químicos pueden venderse a cualquier persona. También faltan las fotografías propias de producto y los campos de almacenamiento, humedad, tipo de producto y restricciones de uso.<\/p>\n        <\/div>\n      <\/template>\n    <\/div>\n  <\/section>\n\n  <!-- ============ SEDES ============ -->\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"cabeza\">\n        <div>\n          <p class=\"eyebrow\" style=\"color: {{acento}}\">Presencia<\/p>\n          <h2 style=\"font-size:46px;margin-top:16px\">Tres sedes de distribución<\/h2>\n        <\/div>\n      <\/div>\n      <div class=\"g3\">\n        <div class=\"card\">\n          <p class=\"mono\" style=\"font-size:11px;letter-spacing:.16em;color:var(--verde700)\">OFICINA CENTRAL<\/p>\n          <h3 style=\"font-size:27px\">Quetzaltenango<\/h3>\n          <p style=\"font-size:16px;color:var(--gris)\">7a Avenida 1-29 Zona 1, Cantón Llanos de Urbina, Cantel, Quetzaltenango<\/p>\n          <div style=\"margin-top:auto;padding-top:18px;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:6px\">\n            <p class=\"mono\" style=\"font-size:13px\">7926-7951<\/p>\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">facturacion@incovsa.com<\/a>\n          <\/div>\n        <\/div>\n        <div class=\"card\">\n          <p class=\"mono\" style=\"font-size:11px;letter-spacing:.16em;color:var(--verde700)\">OFICINA Y BODEGA<\/p>\n          <h3 style=\"font-size:27px\">Guatemala<\/h3>\n          <p style=\"font-size:16px;color:var(--gris)\">8a Calle &quot;A&quot; 27-70 zona 4, Mixco, Finca El Naranjo, Guatemala<\/p>\n          <div style=\"margin-top:auto;padding-top:18px;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:6px\">\n            <p class=\"mono\" style=\"font-size:13px\">2436-0936 &#183; 2436-0937<\/p>\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">recepciongt@incovsa.com<\/a>\n          <\/div>\n        <\/div>\n        <div class=\"pend\" style=\"justify-content:center\">\n          <p class=\"pend-t\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 2l6 11H2z\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\/path><path d=\"M8 6.5v3\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n            Pendiente de INCOVSA\n          <\/p>\n          <h3 style=\"font-size:27px;color:#54451A\">Escuintla<\/h3>\n          <p style=\"font-size:16px;color:#7A6828\">La bodega está confirmada en la propuesta de la empresa, pero no aparece en la página de Google Sites de la empresa. Faltan dirección, teléfono y correo.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ LLAMADO ============ -->\n  <section style=\"background:var(--papel);border-top:1px solid var(--linea);padding:88px 0\">\n    <div class=\"wrap\" style=\"display:flex;align-items:center;justify-content:space-between;gap:60px\">\n      <div>\n        <h2 style=\"font-size:40px;max-width:640px;text-wrap:pretty\">¿Necesita un producto que no aparece en el catálogo?<\/h2>\n        <p style=\"font-size:18px;color:var(--gris);margin-top:16px\">Escríbanos y un asesor le responde desde la sede que le corresponde.<\/p>\n      <\/div>\n      <a href=\"#\" class=\"btn btn-p\" style=\"white-space:nowrap\">\n        Enviar una solicitud\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"square\"><\/path><\/svg>\n      <\/a>\n    <\/div>\n  <\/section>\n\n  <!-- ============ PIE ============ -->\n  <footer class=\"pie\">\n    <div class=\"wrap\">\n      <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:48px;padding-bottom:52px;border-bottom:1px solid rgba(255,255,255,.12)\">\n        <div>\n          <p style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:21px;color:#fff;letter-spacing:.01em\">INCOVSA<\/p>\n          <p class=\"mono\" style=\"font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px\">Químicos<\/p>\n          <p style=\"margin-top:20px;font-size:15px;max-width:290px\">Industria del Cuero Covadonga, S. A. Compra y venta de productos químicos en Guatemala.<\/p>\n          <p style=\"margin-top:20px;font-size:14px;color:#8E8A80\">Empresa hermana: INQUISERCA, S. A.<\/p>\n        <\/div>\n        <div>\n          <h4>Navegación<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Inicio<\/a>\n            <a href=\"#\">Quiénes somos<\/a>\n            <a href=\"#\">Industrias<\/a>\n            <a href=\"#\">Productos<\/a>\n            <a href=\"#\">Contacto<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Industrias<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Cuero<\/a>\n            <a href=\"#\">Textil<\/a>\n            <a href=\"#\">Cerería<\/a>\n            <a href=\"#\">Hulera<\/a>\n            <a href=\"#\">Ver las nueve<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Contacto<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">facturacion@incovsa.com<\/a>\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">recepciongt@incovsa.com<\/a>\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">WhatsApp Quetzaltenango<\/a>\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">WhatsApp Guatemala<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n      <p style=\"padding-top:28px;font-size:13px;color:#7E7A71\">Prototipo para validación &#183; Universidad Rafael Landívar &#183; Proyecto de Programación Web<\/p>\n    <\/div>\n  <\/footer>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#B45309\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "QuienesSomos.dc.html": {"titulo": "Quiénes somos", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3,h4{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.04;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1200px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .eyebrow{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}\n    .nav{background:var(--verde900)}\n    .nav-in{display:flex;align-items:center;justify-content:space-between;height:88px;gap:48px}\n    .marca{display:flex;align-items:center;gap:13px}\n    .marca-n{font-family:Archivo,sans-serif;font-weight:800;font-size:23px;letter-spacing:.01em;color:#fff;line-height:1}\n    .marca-s{font-family:\"IBM Plex Mono\",monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px}\n    .menu{display:flex;align-items:center;gap:34px;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .menu a{color:#D6D2C7}\n    .menu a:hover{color:var(--oro)}\n    .menu a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .acceso{border:1px solid rgba(232,206,114,.45);color:var(--oro) !important;padding:11px 19px;border-radius:2px;display:flex;align-items:center;gap:9px}\n    .acceso:hover{background:rgba(232,206,114,.12)}\n    .btn{display:inline-flex;align-items:center;gap:11px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:17px 30px;border-radius:2px;border:0;cursor:pointer}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900);color:#fff}\n    .sec{padding:96px 0}\n    .cabeza{padding-bottom:26px;border-bottom:1px solid var(--linea);margin-bottom:48px}\n    .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}\n    .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}\n    .card{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:32px;display:flex;flex-direction:column;gap:14px}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:30px 32px;border-radius:2px;display:flex;flex-direction:column;gap:12px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12;display:flex;align-items:center;gap:8px}\n    .pend h3{color:#54451A}\n    .pend p{color:#6B5A21}\n    .lineas{display:flex;flex-direction:column;gap:11px;margin-top:6px}\n    .lin{height:11px;background:rgba(201,162,39,.22);border-radius:1px}\n    .foto{background:#E7E3D8;border:1.5px dashed #BDB7A8;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8A8474;text-align:center;padding:24px}\n    .foto-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase}\n    .pie{background:var(--verde900);color:#B6B2A7;padding:80px 0 44px;font-size:15px}\n    .pie h4{color:#fff;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-family:\"IBM Plex Mono\",monospace;font-weight:500;margin-bottom:20px}\n    .pie a{color:#B6B2A7}\n    .pie a:hover{color:var(--oro)}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <header class=\"nav\">\n    <div class=\"wrap nav-in\">\n      <a href=\"#\" class=\"marca\">\n        <svg width=\"38\" height=\"38\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n          <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.4\"><\/rect>\n          <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n          <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <path d=\"M27 27v-6h1.6v6z\" fill=\"#2F8B4C\"><\/path>\n        <\/svg>\n        <span style=\"display:flex;flex-direction:column\">\n          <span class=\"marca-n\">INCOVSA<\/span>\n          <span class=\"marca-s\">Químicos<\/span>\n        <\/span>\n      <\/a>\n      <nav class=\"menu\">\n        <a href=\"#\">Inicio<\/a>\n        <a href=\"#\" class=\"act\">Quiénes somos<\/a>\n        <a href=\"#\">Industrias<\/a>\n        <a href=\"#\">Productos<\/a>\n        <a href=\"#\">Contacto<\/a>\n        <a href=\"#\" class=\"acceso\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect>\n            <path d=\"M5.5 7V4.8a2.5 2.5 0 015 0V7\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path>\n          <\/svg>\n          Acceso personal\n        <\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <!-- ============ PORTADA ============ -->\n  <section style=\"background:var(--verde900);color:#EDEAE1;padding:88px 0\">\n    <div class=\"wrap\">\n      <p class=\"eyebrow\" style=\"color: {{acento}}\">Quiénes somos<\/p>\n      <h1 style=\"font-size:64px;margin-top:22px;color:#fff;max-width:900px;text-wrap:pretty\">Más de treinta años abasteciendo de químicos a la industria del país<\/h1>\n      <p style=\"font-size:20px;line-height:1.65;color:#C6C2B6;margin-top:26px;max-width:760px;text-wrap:pretty\">INCOVSA, Industria del Cuero Covadonga, S. A., se dedica a la compra y venta de productos químicos en Guatemala. Atiende nueve industrias, tiene presencia en todos los departamentos del país y opera tres bodegas de distribución.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ============ HISTORIA ============ -->\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"cabeza\">\n        <p class=\"eyebrow\" style=\"color: {{acento}}\">Nuestra historia<\/p>\n        <h2 style=\"font-size:44px;margin-top:16px\">De tenería a distribuidor de químicos<\/h2>\n      <\/div>\n      <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start\">\n        <div class=\"pend\">\n          <p class=\"pend-t\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 2l6 11H2z\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\/path><path d=\"M8 6.5v3\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n            Texto pendiente de INCOVSA &#183; requerimiento RF-SW-02\n          <\/p>\n          <h3 style=\"font-size:24px\">Historia de la empresa<\/h3>\n          <p style=\"font-size:16px\">La empresa se comprometió a redactar y enviar este texto. Lo único registrado hasta ahora en las actas es que la operación inició como tenería y luego se consolidó como distribuidora de productos químicos, y que de ahí nace Inquiserca.<\/p>\n          <div class=\"lineas\">\n            <div class=\"lin\" style=\"width:100%\"><\/div>\n            <div class=\"lin\" style=\"width:97%\"><\/div>\n            <div class=\"lin\" style=\"width:99%\"><\/div>\n            <div class=\"lin\" style=\"width:62%\"><\/div>\n          <\/div>\n          <div class=\"lineas\">\n            <div class=\"lin\" style=\"width:100%\"><\/div>\n            <div class=\"lin\" style=\"width:94%\"><\/div>\n            <div class=\"lin\" style=\"width:45%\"><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"foto\" style=\"height:420px\">\n          <svg width=\"42\" height=\"42\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><circle cx=\"9\" cy=\"10\" r=\"1.8\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/circle><path d=\"M3 16.5l5-4 4.5 3.5L16 13l5 4\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"><\/path><\/svg>\n          <span class=\"foto-t\">Fotografía histórica<br>pendiente de INCOVSA<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ MISIÓN Y VISIÓN ============ -->\n  <section style=\"background:var(--papel);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);padding:96px 0\">\n    <div class=\"wrap\">\n      <div class=\"cabeza\">\n        <p class=\"eyebrow\" style=\"color: {{acento}}\">Propósito<\/p>\n        <h2 style=\"font-size:44px;margin-top:16px\">Misión y visión<\/h2>\n      <\/div>\n      <div class=\"g2\">\n        <div class=\"card\" style=\"border-top:3px solid var(--verde700)\">\n          <p class=\"mono\" style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--verde500)\">Recibido de INCOVSA<\/p>\n          <h3 style=\"font-size:28px\">Misión<\/h3>\n          <p style=\"font-size:17px;color:var(--gris);text-wrap:pretty\">Ser el aliado estratégico para nuestros clientes y proveedores en la distribución de productos químicos, atendiendo la región CA-4, marcando la diferencia en servicio, con una completa gama de productos para brindar soluciones a las necesidades del mercado, apoyando a cumplir los objetivos de nuestros grupos de interés.<\/p>\n        <\/div>\n        <div class=\"card\" style=\"border-top:3px solid var(--verde700)\">\n          <p class=\"mono\" style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--verde500)\">Recibido de INCOVSA<\/p>\n          <h3 style=\"font-size:28px\">Visión<\/h3>\n          <p style=\"font-size:17px;color:var(--gris);text-wrap:pretty\">Ser referentes y acercar soluciones en la distribución de productos químicos satisfaciendo las necesidades de los mercados atendidos, creando valor integral a nuestros grupos de interés a través del crecimiento y mejora continua, con una administración responsable y transparente enfocada en la solidez y el largo plazo.<\/p>\n        <\/div>\n      <\/div>\n\n      <template data-sc-if=\"marcar\">\n        <div class=\"pend\" style=\"margin-top:22px\">\n          <p class=\"pend-t\">Pendiente de INCOVSA<\/p>\n          <p style=\"font-size:16px;color:#54451A\">Los textos de misión y visión llegaron dentro de imágenes y se transcribieron. En el original la visión escribe &laquo;tranparente&raquo;; aquí se corrigió a &laquo;transparente&raquo; y falta que la empresa confirme la versión correcta antes de publicarla.<\/p>\n        <\/div>\n      <\/template>\n\n      <h3 style=\"font-size:28px;margin-top:64px;margin-bottom:24px\">Valores<\/h3>\n      <div class=\"g4\">\n        <div class=\"pend\" style=\"gap:14px\">\n          <p class=\"mono\" style=\"font-size:34px;color:rgba(201,162,39,.55);font-weight:500\">01<\/p>\n          <div class=\"lineas\">\n            <div class=\"lin\" style=\"width:72%;height:16px\"><\/div>\n            <div class=\"lin\" style=\"width:100%\"><\/div>\n            <div class=\"lin\" style=\"width:84%\"><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"pend\" style=\"gap:14px\">\n          <p class=\"mono\" style=\"font-size:34px;color:rgba(201,162,39,.55);font-weight:500\">02<\/p>\n          <div class=\"lineas\">\n            <div class=\"lin\" style=\"width:64%;height:16px\"><\/div>\n            <div class=\"lin\" style=\"width:100%\"><\/div>\n            <div class=\"lin\" style=\"width:79%\"><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"pend\" style=\"gap:14px\">\n          <p class=\"mono\" style=\"font-size:34px;color:rgba(201,162,39,.55);font-weight:500\">03<\/p>\n          <div class=\"lineas\">\n            <div class=\"lin\" style=\"width:80%;height:16px\"><\/div>\n            <div class=\"lin\" style=\"width:100%\"><\/div>\n            <div class=\"lin\" style=\"width:68%\"><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"pend\" style=\"gap:14px\">\n          <p class=\"mono\" style=\"font-size:34px;color:rgba(201,162,39,.55);font-weight:500\">04<\/p>\n          <div class=\"lineas\">\n            <div class=\"lin\" style=\"width:70%;height:16px\"><\/div>\n            <div class=\"lin\" style=\"width:100%\"><\/div>\n            <div class=\"lin\" style=\"width:88%\"><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <p style=\"font-size:15px;color:var(--gris);margin-top:22px\">El número de valores y su redacción los define la empresa. El diseño se ajusta a la cantidad que se envíe.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ============ MERCADOS ============ -->\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"cabeza\">\n        <p class=\"eyebrow\" style=\"color: {{acento}}\">A quién servimos<\/p>\n        <h2 style=\"font-size:44px;margin-top:16px\">Dos mercados, la misma calidad de producto<\/h2>\n      <\/div>\n      <div class=\"g2\">\n        <div class=\"card\" style=\"border-left:3px solid var(--verde700)\">\n          <p class=\"mono\" style=\"font-size:11px;letter-spacing:.16em;color:var(--verde700)\">MERCADO INDUSTRIAL<\/p>\n          <h3 style=\"font-size:30px\">Empresas con maquinaria<\/h3>\n          <p style=\"font-size:17px;color:var(--gris);text-wrap:pretty\">Plantas de producción que transforman materia prima a escala: curtiembres, textileras, fábricas de medicamentos, plantas de tratamiento de agua y de alimentos para consumo animal.<\/p>\n        <\/div>\n        <div class=\"card\" style=\"border-left:3px solid var(--dorado)\">\n          <p class=\"mono\" style=\"font-size:11px;letter-spacing:.16em;color:var(--dorado)\">MERCADO ARTESANAL<\/p>\n          <h3 style=\"font-size:30px\">Talleres de trabajo manual<\/h3>\n          <p style=\"font-size:17px;color:var(--gris);text-wrap:pretty\">Productores que trabajan de forma manual, sin maquinaria industrial. Las mismas presentaciones y el mismo respaldo técnico, en volúmenes adecuados a su operación.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ CIFRAS Y GRUPO ============ -->\n  <section style=\"background:var(--verde700);color:#E6E9E2;padding:80px 0\">\n    <div class=\"wrap\">\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;padding-bottom:52px;border-bottom:1px solid rgba(255,255,255,.18)\">\n        <div>\n          <p class=\"mono\" style=\"font-size:48px;color:#fff;font-weight:500\">30+<\/p>\n          <p style=\"font-size:15px;color:#B9C3B3;margin-top:6px\">años en el mercado<\/p>\n        <\/div>\n        <div>\n          <p class=\"mono\" style=\"font-size:48px;color:#fff;font-weight:500\">09<\/p>\n          <p style=\"font-size:15px;color:#B9C3B3;margin-top:6px\">industrias atendidas<\/p>\n        <\/div>\n        <div>\n          <p class=\"mono\" style=\"font-size:48px;color:#fff;font-weight:500\">03<\/p>\n          <p style=\"font-size:15px;color:#B9C3B3;margin-top:6px\">bodegas de distribución<\/p>\n        <\/div>\n        <div>\n          <p class=\"mono\" style=\"font-size:48px;color:#fff;font-weight:500\">22<\/p>\n          <p style=\"font-size:15px;color:#B9C3B3;margin-top:6px\">departamentos con cobertura<\/p>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:48px;padding-top:44px\">\n        <div>\n          <h3 style=\"font-size:26px;color:#fff\">INCOVSA e INQUISERCA<\/h3>\n          <p style=\"font-size:17px;color:#B9C3B3;margin-top:12px;max-width:620px;text-wrap:pretty\">Dos empresas del mismo grupo que comparten productos según la logística de distribución, presentadas en este sitio con una sola identidad.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <footer class=\"pie\">\n    <div class=\"wrap\">\n      <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:48px;padding-bottom:52px;border-bottom:1px solid rgba(255,255,255,.12)\">\n        <div>\n          <p style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:21px;color:#fff\">INCOVSA<\/p>\n          <p class=\"mono\" style=\"font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px\">Químicos<\/p>\n          <p style=\"margin-top:20px;font-size:15px;max-width:290px\">Industria del Cuero Covadonga, S. A. Compra y venta de productos químicos en Guatemala.<\/p>\n        <\/div>\n        <div>\n          <h4>Navegación<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Inicio<\/a><a href=\"#\">Quiénes somos<\/a><a href=\"#\">Industrias<\/a><a href=\"#\">Productos<\/a><a href=\"#\">Contacto<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Sedes<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Quetzaltenango<\/a><a href=\"#\">Guatemala<\/a><a href=\"#\">Escuintla<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Contacto<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">facturacion@incovsa.com<\/a>\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">recepciongt@incovsa.com<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n      <p style=\"padding-top:28px;font-size:13px;color:#7E7A71\">Prototipo para validación &#183; Universidad Rafael Landívar &#183; Proyecto de Programación Web<\/p>\n    <\/div>\n  <\/footer>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#B45309\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Industrias.dc.html": {"titulo": "Industrias", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3,h4{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.04;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1200px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .eyebrow{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}\n    .nav{background:var(--verde900)}\n    .nav-in{display:flex;align-items:center;justify-content:space-between;height:88px;gap:48px}\n    .marca{display:flex;align-items:center;gap:13px}\n    .marca-n{font-family:Archivo,sans-serif;font-weight:800;font-size:23px;color:#fff;line-height:1}\n    .marca-s{font-family:\"IBM Plex Mono\",monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px}\n    .menu{display:flex;align-items:center;gap:34px;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .menu a{color:#D6D2C7}\n    .menu a:hover{color:var(--oro)}\n    .menu a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .acceso{border:1px solid rgba(232,206,114,.45);color:var(--oro) !important;padding:11px 19px;border-radius:2px;display:flex;align-items:center;gap:9px}\n    .acceso:hover{background:rgba(232,206,114,.12)}\n    .btn{display:inline-flex;align-items:center;gap:11px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:16px 28px;border-radius:2px;border:0;cursor:pointer}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900);color:#fff}\n    .ind{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--linea);padding:19px 18px;cursor:pointer;font-family:Archivo,sans-serif;font-size:17px;font-weight:600;color:var(--tinta);transition:background .15s,padding-left .15s}\n    .ind:hover{background:rgba(20,97,45,.05);padding-left:24px}\n    .ind .num{font-family:\"IBM Plex Mono\",monospace;font-size:12px;color:var(--gris);font-weight:400;min-width:22px}\n    .ind .fle{margin-left:auto;opacity:0;transition:opacity .15s}\n    .ind:hover .fle{opacity:.5}\n    .ind.on{background:var(--verde700);color:#fff;padding-left:24px}\n    .ind.on .num{color:var(--oro)}\n    .ind.on .fle{opacity:1}\n    .panel{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:44px 48px;display:flex;flex-direction:column;gap:26px}\n    .chip{display:inline-flex;align-items:center;gap:9px;background:var(--hueso);border:1px solid var(--linea);border-radius:2px;padding:11px 16px;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .chip .pt{width:6px;height:6px;background:var(--verde500);border-radius:50%}\n    .foto{background:#E7E3D8;border:1.5px dashed #BDB7A8;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8A8474;text-align:center;padding:24px}\n    .foto-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:24px 28px;border-radius:2px;display:flex;flex-direction:column;gap:9px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12;display:flex;align-items:center;gap:8px}\n    .pie{background:var(--verde900);color:#B6B2A7;padding:72px 0 40px;font-size:15px}\n    .pie h4{color:#fff;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-family:\"IBM Plex Mono\",monospace;font-weight:500;margin-bottom:20px}\n    .pie a{color:#B6B2A7}\n    .pie a:hover{color:var(--oro)}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo
