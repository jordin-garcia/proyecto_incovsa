s() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <!-- ============ BARRA INTERNA ============ -->\n  <div class=\"barra\">\n    <div class=\"wrap barra-in\">\n      <div style=\"display:flex;align-items:center;gap:44px\">\n        <a href=\"#\" style=\"display:flex;align-items:center;gap:11px\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.6\"><\/rect>\n            <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n            <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <\/svg>\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:17px;color:#fff\">INCOVSA<\/span>\n          <span class=\"mono\" style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);border-left:1px solid rgba(232,206,114,.4);padding-left:11px\">Administración del sitio<\/span>\n        <\/a>\n        <div style=\"display:flex;align-items:center;gap:28px\">\n          <a href=\"PanelAdmin.dc.html\">Panel del sitio<\/a>\n          <a href=\"#\" class=\"act\">Documentación<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"text-align:right\">\n          <p style=\"font-family:Archivo,sans-serif;font-size:14px;font-weight:600;color:#fff;line-height:1.3\">Usuario de ejemplo<\/p>\n          <p class=\"mono\" style=\"font-size:10px;color:var(--oro);letter-spacing:.1em\">ADMINISTRATIVO<\/p>\n        <\/div>\n        <div class=\"avatar\">UE<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ============ ENCABEZADO ============ -->\n  <section style=\"background:var(--papel);border-bottom:1px solid var(--linea);padding:44px 0\">\n    <div class=\"wrap\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:48px\">\n      <div>\n        <p class=\"mono\" style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color: {{acento}}\">Documentación interna de productos<\/p>\n        <h1 style=\"font-size:40px;margin-top:14px\">Fichas técnicas, hojas de seguridad y certificados<\/h1>\n        <p style=\"font-size:17px;color:var(--gris);margin-top:14px;max-width:660px\"><strong>Gerencia<\/strong> y <strong>Administrativo<\/strong> suben, reemplazan y eliminan los documentos, y también los ven y los descargan. El rol <strong>Operativo<\/strong>, que son el jefe de bodega y los jefes de área, los ve y los descarga. El rol <strong>Vista general<\/strong>, que son ventas y facturación, solo los ve en el navegador. Lo que cada persona puede hacer depende de su rol.<\/p>\n      <\/div>\n      <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:6px;white-space:nowrap\">\n        <p class=\"mono\" style=\"font-size:34px;font-weight:500;color:var(--verde700)\">{{cargados}}<\/p>\n        <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.1em\">DOCUMENTOS CARGADOS<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ LISTADO ============ -->\n  <section style=\"padding:40px 0 72px\">\n    <div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:24px\">\n\n      <div style=\"display:flex;align-items:center;gap:20px\">\n        <div style=\"position:relative;flex:1;max-width:420px\">\n          <span style=\"position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gris);display:flex\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"7\" cy=\"7\" r=\"4.5\" stroke=\"currentColor\" stroke-width=\"1.6\"><\/circle><path d=\"M10.5 10.5L14 14\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"square\"><\/path><\/svg>\n          <\/span>\n          <input class=\"busca\" type=\"text\" placeholder=\"Buscar por producto\" value=\"{{q}}\" onChange=\"{{escribir}}\">\n        <\/div>\n        <div style=\"display:flex;gap:9px;margin-left:auto\">\n          <template data-sc-for=\"tipos\" data-as=\"t\">\n            <button class=\"{{t.clase}}\" onClick=\"{{t.elegir}}\">{{t.nombre}}<\/button>\n          <\/template>\n        <\/div>\n      <\/div>\n\n      <table>\n        <thead>\n          <tr>\n            <th style=\"width:26%\">Producto<\/th>\n            <th style=\"width:22%\">Tipo de documento<\/th>\n            <th style=\"width:16%\">Código o lote<\/th>\n            <th style=\"width:16%\">Estado<\/th>\n            <th style=\"width:20%;text-align:right\">Acción<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody>\n          <template data-sc-for=\"filas\" data-as=\"f\">\n            <tr>\n              <td>\n                <p style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:16px\">{{f.producto}}<\/p>\n              <\/td>\n              <td style=\"font-size:16px\">{{f.tipo}}<\/td>\n              <td class=\"mono\" style=\"font-size:13px;color:var(--gris)\">{{f.lote}}<\/td>\n              <td><span class=\"{{f.claseEstado}}\">{{f.estado}}<\/span><\/td>\n              <td style=\"text-align:right\">\n                <span class=\"mono\" style=\"font-size:12px;color:var(--gris)\">{{f.accion}}<\/span>\n              <\/td>\n            <\/tr>\n          <\/template>\n        <\/tbody>\n      <\/table>\n\n      <template data-sc-if=\"vacio\">\n        <div style=\"background:var(--papel);border:1px solid var(--linea);padding:48px;text-align:center;border-radius:2px\">\n          <p style=\"font-size:18px;font-family:Archivo,sans-serif;font-weight:700\">Sin resultados<\/p>\n          <p style=\"font-size:16px;color:var(--gris);margin-top:8px\">Pruebe con otro producto o cambie el tipo de documento.<\/p>\n        <\/div>\n      <\/template>\n\n      <template data-sc-if=\"marcar\">\n        <div class=\"pend\">\n          <p class=\"pend-t\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 2l6 11H2z\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\/path><path d=\"M8 6.5v3\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n            Pendiente de INCOVSA\n          <\/p>\n          <p style=\"font-size:16px;color:#6B5A21;text-wrap:pretty\">INCOVSA entregó como ejemplo la ficha técnica, la hoja de seguridad y un certificado de análisis de la soda cáustica de México. Todos los documentos son PDF. La ficha y la hoja se asocian a uno o varios productos del catálogo público; el certificado, además, lleva escrito el código o lote al que corresponde. Faltan los datos de los productos que se publican en el sitio.<\/p>\n        <\/div>\n      <\/template>\n    <\/div>\n  <\/section>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#B45309\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { tipo: 'todos', q: '' };\n  }\n  productos() {\n    return [\n      ['PROD-001', 'Ácido Acético Glacial'],\n      ['PROD-004', 'Ácido Fórmico'],\n      ['PROD-006', 'Ácido Sulfúrico'],\n      ['PROD-009', 'Extracto de Quebracho'],\n      ['PROD-013', 'Soda Ash'],\n      ['PROD-014', 'Soda Cáustica'],\n      ['PROD-016', 'Sulfato de Cromo'],\n      ['PROD-018', 'Sulfato de Sodio']\n    ];\n  }\n  sinTildes(s) {\n    return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();\n  }\n  renderVals() {\n    const self = this;\n    const st = this.state;\n    const tipos = [\n      { id: 'todos', nombre: 'Todos' },\n      { id: 'ficha', nombre: 'Ficha técnica' },\n      { id: 'seguridad', nombre: 'Hoja de seguridad' },\n      { id: 'certificado', nombre: 'Certificado de análisis' }\n    ];\n    const etiquetas = { ficha: 'Ficha técnica', seguridad: 'Hoja de seguridad', certificado: 'Certificado de análisis' };\n    const q = this.sinTildes(st.q.trim());\n\n    const filas = [];\n    this.productos().forEach(function (p) {\n      ['ficha', 'seguridad', 'certificado'].forEach(function (t) {\n        if (st.tipo !== 'todos' && st.tipo !== t) return;\n        if (q && self.sinTildes(p[1]).indexOf(q) === -1) return;\n        const cargado = p[1] === 'Soda Cáustica';\n        filas.push({\n          producto: p[1],\n          tipo: etiquetas[t],\n          lote: t === 'certificado' ? (cargado ? 'SKU 4139' : 'Se indica al subir') : '—',\n          estado: cargado ? 'Cargado' : 'Pendiente de carga',\n          claseEstado: cargado ? 'estado e-ok' : 'estado e-pend',\n          accion: cargado ? 'Ver · Descargar · Reemplazar' : 'Subir PDF'\n        });\n      });\n    });\n\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      q: st.q,\n      vacio: filas.length === 0,\n      cargados: '3',\n      escribir: function (e) { self.setState({ q: e.target.value }); },\n      tipos: tipos.map(function (t) {\n        return {\n          nombre: t.nombre,\n          clase: st.tipo === t.id ? 'chip on' : 'chip',\n          elegir: function () { self.setState({ tipo: t.id }); }\n        };\n      }),\n      filas: filas\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "PanelAdmin.dc.html": {"titulo": "Panel del sitio", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.06;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1240px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .barra{background:var(--verde900);height:72px;display:flex;align-items:center}\n    .barra-in{display:flex;align-items:center;justify-content:space-between;width:100%;gap:40px}\n    .barra a{color:#D6D2C7;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .barra a:hover{color:var(--oro)}\n    .barra a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .avatar{width:36px;height:36px;border-radius:50%;background:var(--verde500);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:700;font-size:13px}\n    .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:26px 28px}\n    .lateral{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:16px}\n    .lateral a{display:block;padding:11px 14px;font-family:Archivo,sans-serif;font-size:15px;font-weight:600;color:var(--gris);border-radius:2px}\n    .lateral a:hover{background:rgba(47,139,76,.07);color:var(--verde700)}\n    .lateral a.act{background:var(--verde700);color:#fff}\n    .rotulo{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);display:block;margin-bottom:7px}\n    .campo{width:100%;font-family:\"Source Serif 4\",Georgia,serif;font-size:16px;padding:13px 15px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;color:var(--tinta);line-height:1.6}\n    .campo:focus{outline:2px solid var(--verde500);outline-offset:-1px}\n    .con-lateral{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}\n    .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}\n    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:14px 26px;border-radius:2px;border:0;cursor:pointer}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900)}\n    .btn-l{background:transparent;color:var(--gris);border:1.5px solid var(--linea)}\n    .btn-l:hover{border-color:var(--gris);color:var(--tinta)}\n    .foto{background:#E7E3D8;border:1.5px dashed #BDB7A8;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#8A8474;font-family:\"IBM Plex Mono\",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;height:120px}\n    .modulo{display:flex;flex-direction:column;gap:9px;background:var(--papel);border:1px solid var(--linea);border-left:3px solid var(--verde700);border-radius:2px;padding:22px 24px;transition:.16s}\n    .modulo:hover{border-left-color:var(--dorado);transform:translateY(-2px)}\n    .estado{display:inline-flex;align-items:center;gap:7px;font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.14em;padding:5px 10px;border-radius:2px}\n    .e-ok{background:rgba(47,139,76,.14);color:var(--verde700)}\n    .e-falta{background:rgba(201,162,39,.16);color:#7A6014}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:24px 26px;border-radius:2px;display:flex;flex-direction:column;gap:9px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <!-- ============ BARRA INTERNA ============ -->\n  <div class=\"barra\">\n    <div class=\"wrap barra-in\">\n      <div style=\"display:flex;align-items:center;gap:44px\">\n        <a href=\"#\" style=\"display:flex;align-items:center;gap:11px\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.6\"><\/rect>\n            <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n            <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <\/svg>\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:17px;color:#fff\">INCOVSA<\/span>\n          <span class=\"mono\" style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);border-left:1px solid rgba(232,206,114,.4);padding-left:11px\">Administración del sitio<\/span>\n        <\/a>\n        <div style=\"display:flex;align-items:center;gap:28px\">\n          <a href=\"#\" class=\"act\">Panel del sitio<\/a>\n          <a href=\"Documentacion.dc.html\">Documentación<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"text-align:right\">\n          <p style=\"font-family:Archivo,sans-serif;font-size:14px;font-weight:600;color:#fff;line-height:1.3\">Usuario de ejemplo<\/p>\n          <p class=\"mono\" style=\"font-size:10px;color:var(--oro);letter-spacing:.1em\">ADMINISTRATIVO<\/p>\n        <\/div>\n        <div class=\"avatar\">UE<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ============ ENCABEZADO ============ -->\n  <section style=\"background:var(--papel);border-bottom:1px solid var(--linea);padding:38px 0\">\n    <div class=\"wrap\">\n      <p class=\"mono\" style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color: {{acento}}\">Administración del contenido<\/p>\n      <h1 style=\"font-size:40px;margin-top:14px\">Panel del sitio<\/h1>\n      <p style=\"font-size:17px;color:var(--gris);margin-top:12px;max-width:740px\">Todo lo que se publica en el sitio se edita desde aquí, sin tocar el código. Pueden entrar Gerencia y Administrativo; la administración de usuarios del sitio solo le aparece a Gerencia.<\/p>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:34px 0 80px\">\n    <div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:26px\">\n\n      <!-- ============ SECCIONES ADMINISTRABLES ============ -->\n      <div class=\"g3\">\n        <template data-sc-for=\"modulos\" data-as=\"m\">\n          <a href=\"#\" class=\"modulo\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px\">\n              <h2 style=\"font-size:19px\">{{m.nombre}}<\/h2>\n              <span class=\"estado {{m.clase}}\">{{m.estado}}<\/span>\n            <\/div>\n            <p style=\"font-size:15px;color:var(--gris)\">{{m.detalle}}<\/p>\n          <\/a>\n        <\/template>\n      <\/div>\n\n      <!-- ============ EDITOR ============ -->\n      <div class=\"con-lateral\">\n        <aside class=\"lateral\">\n          <p class=\"rotulo\" style=\"padding:0 14px 8px\">Contenido institucional<\/p>\n          <a href=\"#\">Historia<\/a>\n          <a href=\"#\" class=\"act\">Misión<\/a>\n          <a href=\"#\">Visión<\/a>\n          <a href=\"#\">Valores<\/a>\n          <a href=\"#\">Imágenes del sitio<\/a>\n        <\/aside>\n\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div class=\"tarjeta\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px\">\n              <h2 style=\"font-size:21px\">Editar sección &#183; Misión<\/h2>\n              <span class=\"estado e-ok\">RECIBIDO DE INCOVSA<\/span>\n            <\/div>\n\n            <div style=\"margin-bottom:18px\">\n              <span class=\"rotulo\">Título que se muestra en el sitio<\/span>\n              <input class=\"campo\" type=\"text\" value=\"Nuestra misión\">\n            <\/div>\n\n            <div style=\"margin-bottom:18px\">\n              <span class=\"rotulo\">Texto<\/span>\n              <textarea class=\"campo\" rows=\"6\">Ser el aliado estratégico para nuestros clientes y proveedores en la distribución de productos químicos, atendiendo la región CA-4, marcando la diferencia en servicio, con una completa gama de productos para brindar soluciones a las necesidades del mercado, apoyando a cumplir los objetivos de nuestros grupos de interés.<\/textarea>\n            <\/div>\n\n            <div style=\"margin-bottom:22px\">\n              <span class=\"rotulo\">Imagen de la sección<\/span>\n              <div class=\"foto\">Arrastre una imagen o seleccione un archivo<\/div>\n            <\/div>\n\n            <div style=\"display:flex;gap:12px\">\n              <button class=\"btn btn-p\">Guardar cambios<\/button>\n              <button class=\"btn btn-l\">Ver en el sitio<\/button>\n              <button class=\"btn btn-l\">Cancelar<\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"tarjeta\">\n            <h2 style=\"font-size:21px;margin-bottom:8px\">Solicitudes recibidas<\/h2>\n            <p style=\"font-size:15px;color:var(--gris)\">Lo que llega por el formulario de contacto se guarda aquí y además se envía por correo. Aún no hay registros porque el sitio no está publicado.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <template data-sc-if=\"marcar\">\n        <div class=\"pend\">\n          <p class=\"pend-t\">Pendiente de INCOVSA<\/p>\n          <p style=\"font-size:16px;color:#54451A;max-width:920px\">Para llenar el panel faltan los textos de historia y valores, el logotipo en vectorial con los colores exactos, las imágenes por sección, la descripción de cada industria, los datos de contacto de las tres sedes, el correo que recibirá el formulario y lo que se publicará en noticias. También faltan los datos de los productos que se publican en el sitio.<\/p>\n        <\/div>\n      <\/template>\n\n    <\/div>\n  <\/section>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#E8CE72\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      modulos: [\n        { nombre: 'Contenido institucional', detalle: 'Historia, misión, visión, valores e imágenes', estado: 'PARCIAL', clase: 'e-falta' },\n        { nombre: 'Industrias atendidas', detalle: 'Nombre, descripción e imagen de cada industria', estado: 'FALTA TEXTO', clase: 'e-falta' },\n        { nombre: 'Catálogo de productos', detalle: 'Productos publicados y los datos de cada uno', estado: 'POR DEFINIR', clase: 'e-falta' },\n        { nombre: 'Noticias', detalle: 'Publicación y edición de noticias', estado: 'POR DEFINIR', clase: 'e-falta' },\n        { nombre: 'Información de contacto', detalle: 'Datos de las tres sedes y correo receptor', estado: 'FALTAN DATOS', clase: 'e-falta' },\n        { nombre: 'Documentos internos', detalle: 'Fichas técnicas, hojas de seguridad y certificados', estado: '3 DE EJEMPLO', clase: 'e-falta' }\n      ]\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Facturacion.dc.html": {"titulo": "Módulo de Facturación", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.06;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1320px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .barra{background:var(--verde900);height:72px;display:flex;align-items:center}\n    .barra-in{display:flex;align-items:center;justify-content:space-between;width:100%;gap:40px}\n    .barra a{color:#D6D2C7;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .barra a:hover{color:var(--oro)}\n    .barra a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .avatar{width:36px;height:36px;border-radius:50%;background:var(--verde500);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:700;font-size:13px}\n    .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:28px 30px}\n    .rotulo{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);display:block;margin-bottom:7px}\n    .campo{width:100%;font-family:Archivo,sans-serif;font-size:15px;padding:12px 14px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;color:var(--tinta)}\n    .campo:focus{outline:2px solid var(--verde500);outline-offset:-1px}\n    .campo.fijo{background:#F2F0EA;color:var(--gris)}\n    .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}\n    table{width:100%;border-collapse:collapse;background:var(--papel);border:1px solid var(--linea)}\n    th{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);text-align:left;padding:15px 18px;border-bottom:1px solid var(--linea);font-weight:500}\n    td{padding:15px 18px;border-bottom:1px solid var(--linea);vertical-align:middle;font-size:16px}\n    tr:last-child td{border-bottom:0}\n    .num{text-align:right;font-family:\"IBM Plex Mono\",monospace;font-size:15px}\n    .cod{font-family:\"IBM Plex Mono\",monospace;font-size:14px;color:var(--gris)}\n    .prod{font-family:\"IBM Plex Mono\",monospace;font-size:14px}\n    tfoot td{background:rgba(47,139,76,.07);font-family:Archivo,sans-serif;font-weight:700;border-top:1px solid var(--verde500)}\n    .mini{font-family:Archivo,sans-serif;font-size:12px;font-weight:600;padding:6px 10px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;cursor:pointer;color:var(--gris)}\n    .mini:hover{border-color:var(--verde500);color:var(--verde700)}\n    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:15px 28px;border-radius:2px;border:0;cursor:pointer}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900)}\n    .btn-l{background:transparent;color:var(--gris);border:1.5px solid var(--linea)}\n    .btn-l:hover{border-color:var(--gris);color:var(--tinta)}\n    .btn-mas{width:38px;height:38px;padding:0;background:var(--verde700);color:#fff;font-size:20px;font-family:Archivo,sans-serif;line-height:1}\n    .aviso{display:flex;align-items:flex-start;gap:12px;padding:15px 18px;border-radius:2px;font-size:15px;border-left:3px solid}\n    .a-oro{background:rgba(201,162,39,.12);border-color:var(--dorado);color:#6E5510}\n    .a-rojo{background:#FBEAE4;border-color:#A33A22;color:#7A2C19}\n    .sug{position:relative}\n    .sug-lista{position:absolute;left:0;right:0;top:calc(100% + 3px);background:var(--papel);border:1px solid var(--verde500);border-radius:2px;box-shadow:0 6px 18px rgba(11,58,27,.13);z-index:5}\n    .sug-lista div{padding:10px 13px;font-family:Archivo,sans-serif;font-size:14px;border-bottom:1px solid var(--linea)}\n    .sug-lista div:last-child{border-bottom:0}\n    .sug-lista div.on{background:rgba(47,139,76,.1);color:var(--verde700);font-weight:600}\n    .pill{display:inline-flex;align-items:center;gap:8px;font-family:\"IBM Plex Mono\",monospace;font-size:11px;letter-spacing:.1em;padding:7px 12px;border-radius:2px;background:#EDEAE2;color:var(--gris)}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:24px 26px;border-radius:2px;display:flex;flex-direction:column;gap:9px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12}\n    tbody tr{cursor:grab}\n    tbody tr:active{cursor:grabbing}\n    tbody tr.arrastrando{opacity:.34}\n    tbody tr.encima td{box-shadow:inset 0 3px 0 var(--verde500)}\n    .grip{display:inline-flex;align-items:center;color:var(--gris);opacity:.45;margin-right:10px;vertical-align:middle}\n    tbody tr:hover .grip{opacity:.95;color:var(--verde700)}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <!-- ============ BARRA INTERNA ============ -->\n  <div class=\"barra\">\n    <div class=\"wrap barra-in\">\n      <div style=\"display:flex;align-items:center;gap:44px\">\n        <a href=\"#\" style=\"display:flex;align-items:center;gap:11px\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.6\"><\/rect>\n            <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n            <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <\/svg>\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:17px;color:#fff\">INCOVSA<\/span>\n          <span class=\"mono\" style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);border-left:1px solid rgba(232,206,114,.4);padding-left:11px\">Control logístico de bodega<\/span>\n        <\/a>\n        <div style=\"display:flex;align-items:center;gap:28px\">\n          <a href=\"#\" class=\"act\">Facturación<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"text-align:right\">\n          <p style=\"font-family:Archivo,sans-serif;font-size:14px;font-weight:600;color:#fff;line-height:1.3\">Usuario de ejemplo<\/p>\n          <p class=\"mono\" style=\"font-size:10px;color:var(--oro);letter-spacing:.1em\">FACTURADOR &#183; QUETZALTENANGO<\/p>\n        <\/div>\n        <div class=\"avatar\">UE<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ============ ENCABEZADO ============ -->\n  <section style=\"background:var(--papel);border-bottom:1px solid var(--linea);padding:38px 0\">\n    <div class=\"wrap\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:48px\">\n      <div>\n        <p class=\"mono\" style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color: {{acento}}\">Módulo de facturación<\/p>\n        <h1 style=\"font-size:40px;margin-top:14px\">Registro de pedido<\/h1>\n        <p style=\"font-size:17px;color:var(--gris);margin-top:12px;max-width:700px\">Se capturan los datos de las facturas ya emitidas en Odoo. Al enviar el pedido a bodega se guarda con su correlativo, se descuenta la existencia y, si va en camión, se crea la ruta.<\/p>\n      <\/div>\n      <span class=\"pill\">ESTADO &#183; PENDIENTE<\/span>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:34px 0 80px\">\n    <div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:26px\">\n\n      <!-- ============ DATOS DEL PEDIDO ============ -->\n      <div class=\"tarjeta\">\n        <h2 style=\"font-size:21px;margin-bottom:22px\">Datos del pedido<\/h2>\n        <div class=\"g4\">\n          <div>\n            <span class=\"rotulo\">Tipo de pedido<\/span>\n            <select class=\"campo\" value=\"{{tipo}}\" onChange=\"{{cambiarTipo}}\">\n              <option value=\"camion\">Envío en camión<\/option>\n              <option value=\"bodega\">Cliente recoge en bodega<\/option>\n            <\/select>\n          <\/div>\n          <template data-sc-if=\"esCamion\">\n          <div>\n            <span class=\"rotulo\">Camión<\/span>\n            <select class=\"campo\" value=\"c1\">\n              <option value=\"c1\">Camión 1 &#183; 3,400 kg<\/option>\n              <option value=\"c2\">Camión 2 &#183; 3,400 kg<\/option>\n              <option value=\"c3\">Camión 3 &#183; 6,000 kg<\/option>\n            <\/select>\n          <\/div>\n          <div>\n            <span class=\"rotulo\">Piloto<\/span>\n            <select class=\"campo\" value=\"p1\">\n              <option value=\"p1\">Piloto de ejemplo 1<\/option>\n              <option value=\"p2\">Piloto de ejemplo 2<\/option>\n            <\/select>\n          <\/div>\n          <div>\n            <span class=\"rotulo\">Capacidad máxima<\/span>\n            <input class=\"campo fijo\" type=\"text\" value=\"3,400 kg\" readonly>\n          <\/div>\n          <\/template>\n        <\/div>\n        <p class=\"mono\" style=\"font-size:12px;color:var(--gris);margin-top:16px\">El camión y el piloto solo se asignan cuando el pedido es de tipo envío en camión.<\/p>\n      <\/div>\n\n      <!-- ============ PRODUCTOS ============ -->\n      <div class=\"tarjeta\" style=\"padding-bottom:30px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:20px\">\n          <div>\n            <h2 style=\"font-size:21px\">Productos del pedido<\/h2>\n            <p style=\"font-size:15px;color:var(--gris);margin-top:6px\">Cada fila es una línea de factura: un cliente, un producto y su cantidad. Arrastre una fila para cambiarla de posición.<\/p>\n          <\/div>\n          <button class=\"btn btn-mas\" title=\"Agregar fila\">+<\/button>\n        <\/div>\n\n        <template data-sc-if=\"esCamion\">\n        <div class=\"aviso a-oro\" style=\"margin-bottom:18px\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink:0;margin-top:2px\"><path d=\"M8 2l6 11H2z\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\/path><path d=\"M8 6.5v3\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n          <span>Se alcanzó la capacidad del camión asignado. El total acumulado es 3,460 kg y la capacidad es 3,400 kg. Puede seguir agregando líneas: la alerta no bloquea nada, la decisión es suya.<\/span>\n        <\/div>\n        <\/template>\n\n        <table>\n          <thead>\n            <tr>\n              <th style=\"width:74px\"><\/th>\n              <th>Cliente<\/th>\n              <th style=\"width:86px\">SKU<\/th>\n              <th>Producto<\/th>\n              <th style=\"width:130px;text-align:right\">Cantidad (kg)<\/th>\n              <th style=\"width:150px\">Acciones<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <template data-sc-for=\"filas\" data-as=\"f\">\n              <tr class=\"{{f.clase}}\" draggable=\"true\" onDragStart=\"{{f.iniciar}}\" onDragOver=\"{{f.encima}}\" onDragLeave=\"{{f.sale}}\" onDrop=\"{{f.soltar}}\" onDragEnd=\"{{f.fin}}\">\n                <td class=\"cod\"><span class=\"grip\" aria-hidden=\"true\"><svg width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"currentColor\"><circle cx=\"2.5\" cy=\"3\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"3\" r=\"1.4\"><\/circle><circle cx=\"2.5\" cy=\"8\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"8\" r=\"1.4\"><\/circle><circle cx=\"2.5\" cy=\"13\" r=\"1.4\"><\/circle><circle cx=\"7.5\" cy=\"13\" r=\"1.4\"><\/circle><\/svg><\/span>{{f.n}}<\/td>\n                <td>{{f.cliente}}<\/td>\n                <td class=\"cod\">{{f.sku}}<\/td>\n                <td class=\"prod\">{{f.producto}}<\/td>\n                <td class=\"num\">{{f.cantidad}}<\/td>\n                <td style=\"white-space:nowrap\">\n                  <button class=\"mini\">Editar<\/button>\n                  <button class=\"mini\">Eliminar<\/button>\n                <\/td>\n              <\/tr>\n            <\/template>\n            <tr>\n              <td class=\"cod\" style=\"padding-left:40px\">8<\/td>\n              <td style=\"overflow:visible\">\n                <div class=\"sug\">\n                  <input class=\"campo\" type=\"text\" value=\"Cliente eje\" placeholder=\"Escriba el nombre del cliente\">\n                  <div class=\"sug-lista\">\n                    <div class=\"on\">Cliente ejemplo 01 &#183; sector 1 san andres xecul<\/div>\n                    <div>Cliente ejemplo 02 &#183; sector 2 san andres xucul<\/div>\n                    <div>Cliente ejemplo 03 &#183; sector 1 salcaja<\/div>\n                    <div>Cliente ejemplo 04 &#183; san felipe xecuyup<\/div>\n                  <\/div>\n                <\/div>\n              <\/td>\n              <td class=\"cod\">&#8212;<\/td>\n              <td><input class=\"campo\" type=\"text\" placeholder=\"Escriba el nombre del producto\"><\/td>\n              <td><input class=\"campo\" type=\"text\" placeholder=\"0\" style=\"text-align:right\"><\/td>\n              <td><button class=\"mini\">Eliminar<\/button><\/td>\n            <\/tr>\n          <\/tbody>\n          <tfoot>\n            <tr>\n              <td colspan=\"4\" style=\"text-align:right\">Total del pedido<\/td>\n              <td class=\"num\" style=\"font-size:17px\">3,460<\/td>\n              <td><\/td>\n            <\/tr>\n          <\/tfoot>\n        <\/table>\n\n        <p class=\"mono\" style=\"font-size:12px;color:var(--gris);margin-top:16px;max-width:900px;line-height:1.7\">La búsqueda de clientes y de productos trabaja en tiempo real sobre los catálogos de la empresa. Desde aquí no se crean clientes ni productos. La cantidad se escribe en kilogramos y no tiene que ser múltiplo de la presentación: la venta fraccionada está permitida.<\/p>\n\n        <div style=\"display:flex;gap:12px;margin-top:24px\">\n          <button class=\"btn btn-p\">Enviar pedido a bodega<\/button>\n          <button class=\"btn btn-l\">Cancelar<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- ============ VALIDACIÓN DE EXISTENCIAS ============ -->\n      <div class=\"tarjeta\">\n        <h2 style=\"font-size:21px;margin-bottom:16px\">Validación de existencias<\/h2>\n        <div class=\"aviso a-rojo\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink:0;margin-top:2px\"><circle cx=\"8\" cy=\"8\" r=\"6.5\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle><path d=\"M8 5v3.5M8 10.5v.5\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n          <span>No hay existencia suficiente de <span class=\"mono\">SODA CAUSTICA-MEX-SAC/0025KG-6960<\/span>. Disponible en Quetzaltenango: 700 kg. Solicitado en este pedido, sumando sus filas: 750 kg. Corrija o elimine la línea para poder enviar el pedido a bodega.<\/span>\n        <\/div>\n        <p style=\"font-size:15px;color:var(--gris);margin-top:14px\">La validación corre al agregar o editar cada fila y suma todas las filas del mismo producto. Mientras falte existencia, el pedido no se puede enviar a bodega.<\/p>\n      <\/div>\n\n      <template data-sc-if=\"marcar\">\n        <div class=\"pend\">\n          <p class=\"pend-t\">Pendiente de INCOVSA<\/p>\n          <p style=\"font-size:16px;color:#54451A\">Falta la identificación real de los tres camiones y los nombres de los pilotos. Los nombres de cliente se muestran como ejemplos genéricos para proteger datos personales.<\/p>\n        <\/div>\n      <\/template>\n\n    <\/div>\n  <\/section>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#E8CE72\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      tipo: 'camion',\n      arrastrada: null,\n      sobre: null,\n      filas: [\n        { cliente: 'Cliente ejemplo 01', sku: '6960', producto: 'SODA CAUSTICA-MEX-SAC/0025KG-6960', cantidad: '500' },\n        { cliente: 'Cliente ejemplo 01', sku: '6241', producto: 'SULFATO DE SODIO-CHI-SAC/0050KG-6241', cantidad: '1,000' },\n        { cliente: 'Cliente ejemplo 02', sku: '6960', producto: 'SODA CAUSTICA-MEX-SAC/0025KG-6960', cantidad: '250' },\n        { cliente: 'Cliente ejemplo 02', sku: '9238', producto: 'ACIDO FORMICO-CHI-GAR/0035KG-9238', cantidad: '350' },\n        { cliente: 'Cliente ejemplo 03', sku: '0163', producto: 'NEGRO SULFUROSO HIGH QUALITY-CHI-SAC/0025KG-0163', cantidad: '60' },\n        { cliente: 'Cliente ejemplo 03', sku: '6830', producto: 'HIDROSULFITO DE SODIO-CHI-TON/0050KG-6830', cantidad: '500' },\n        { cliente: 'Cliente ejemplo 04', sku: '6241', producto: 'SULFATO DE SODIO-CHI-SAC/0050KG-6241', cantidad: '800' }\n      ]\n    };\n  }\n  reordenar(desde, hasta) {\n    if (desde === null || hasta === null || desde === hasta) return;\n    var xs = this.state.filas.slice();\n    var m = xs.splice(desde, 1)[0];\n    xs.splice(hasta, 0, m);\n    this.setState({ filas: xs, arrastrada: null, sobre: null });\n  }\n  renderVals() {\n    var self = this;\n    var st = this.state;\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      tipo: st.tipo,\n      esCamion: st.tipo === 'camion',\n      cambiarTipo: function (e) { self.setState({ tipo: e.target.value }); },\n      filas: st.filas.map(function (f, i) {\n        return {\n          n: String(i + 1),\n          cliente: f.cliente,\n          sku: f.sku,\n          producto: f.producto,\n          cantidad: f.cantidad,\n          clase: st.arrastrada === i ? 'arrastrando' : (st.sobre === i ? 'encima' : ''),\n          iniciar: function (e) { if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {} } self.setState({ arrastrada: i }); },\n          encima: function (e) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; if (st.sobre !== i) self.setState({ sobre: i }); },\n          sale: function () { if (st.sobre === i) self.setState({ sobre: null }); },\n          soltar: function (e) { e.preventDefault(); self.reordenar(st.arrastrada, i); },\n          fin: function () { self.setState({ arrastrada: null, sobre: null }); }\n        };\n      })\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Bodega.dc.html": {"titulo": "Módulo de Bodega · tablero", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.06;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1320px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .barra{background:var(--verde900);height:72px;display:flex;align-items:center}\n    .barra-in{display:flex;align-items:center;justify-content:space-between;width:100%;gap:40px}\n    .barra a{color:#D6D2C7;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .barra a:hover{color:var(--oro)}\n    .barra a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .avatar{width:36px;height:36px;border-radius:50%;background:var(--verde500);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:700;font-size:13px}\n    .pedido{background:var(--papel);border:1px solid var(--linea);border-left:3px solid var(--verde700);border-radius:2px;padding:26px 30px;margin-bottom:22px;cursor:grab}\n    .pedido:active{cursor:grabbing}\n    .pedido.arrastrando{opacity:.34}\n    .pedido.encima{border-left-color:var(--dorado);box-shadow:0 -3px 0 var(--verde500)}\n    .pedido-top{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;margin-bottom:20px}\n    table{width:100%;border-collapse:collapse;background:var(--papel);border:1px solid var(--linea)}\n    th{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);text-align:left;padding:14px 16px;border-bottom:1px solid var(--linea);font-weight:500}\n    td{padding:16px;border-bottom:1px solid var(--linea);vertical-align:middle;font-size:17px}\n    tr:last-child td{border-bottom:0}\n    tbody tr{cursor:grab}\n    tbody tr:active{cursor:grabbing}\n    tbody tr.arrastrando{opacity:.34}\n    tbody tr.encima td{box-shadow:inset 0 3px 0 var(--verde500)}\n    tbody tr.lista td{color:var(--gris)}\n    tbody tr.lista .nombre{text-decoration:line-through}\n    .grip{display:inline-flex;align-items:center;color:var(--gris);opacity:.45}\n    tbody tr:hover .grip,.pedido:hover .grip{opacity:.95;color:var(--verde700)}\n    .prod{font-family:\"IBM Plex Mono\",monospace;font-size:15px}\n    .cod{font-family:\"IBM Plex Mono\",monospace;font-size:14px;color:var(--gris)}\n    .kg{text-align:right;font-family:\"IBM Plex Mono\",monospace;font-size:17px}\n    .uni{text-align:right;font-family:Archivo,sans-serif;font-size:30px;font-weight:800;color:var(--verde700);line-height:1}\n    tr.lista .uni{color:var(--gris)}\n    .marca{width:24px;height:24px;accent-color:#14612D;cursor:pointer}\n    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:14px 26px;border-radius:2px;border:0;cursor:pointer}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900)}\n    .btn-off{background:#E7E4DC;color:#A29D92;cursor:not-allowed}\n    .pill{display:inline-flex;align-items:center;gap:8px;font-family:\"IBM Plex Mono\",monospace;font-size:11px;letter-spacing:.12em;padding:7px 12px;border-radius:2px;background:rgba(47,139,76,.14);color:var(--verde700)}\n    .etiqueta{display:inline-flex;align-items:center;font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:2px;background:#EDEAE2;color:var(--gris)}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:24px 26px;border-radius:2px;display:flex;flex-direction:column;gap:9px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12}\n  .resto{font-size:15px;font-weight:600;color:var(--gris);font-family:Archivo,sans-serif;white-space:nowrap}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return
