 !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <!-- ============ BARRA INTERNA ============ -->\n  <div class=\"barra\">\n    <div class=\"wrap barra-in\">\n      <div style=\"display:flex;align-items:center;gap:44px\">\n        <a href=\"#\" style=\"display:flex;align-items:center;gap:11px\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.6\"><\/rect>\n            <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n            <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <\/svg>\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:17px;color:#fff\">INCOVSA<\/span>\n          <span class=\"mono\" style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);border-left:1px solid rgba(232,206,114,.4);padding-left:11px\">Control logístico de bodega<\/span>\n        <\/a>\n        <div style=\"display:flex;align-items:center;gap:28px\">\n          <a href=\"#\">Facturación<\/a>\n          <a href=\"#\">Bodega<\/a>\n          <a href=\"#\">Ruta<\/a>\n          <a href=\"#\">Inventario<\/a>\n          <a href=\"#\" class=\"act\">Reportes<\/a>\n          <a href=\"#\">Configuración<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"text-align:right\">\n          <p style=\"font-family:Archivo,sans-serif;font-size:14px;font-weight:600;color:#fff;line-height:1.3\">Usuario de ejemplo<\/p>\n          <p class=\"mono\" style=\"font-size:10px;color:var(--oro);letter-spacing:.1em\">GERENCIA &#183; TODAS LAS SEDES<\/p>\n        <\/div>\n        <div class=\"avatar\">UE<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ============ ENCABEZADO ============ -->\n  <section style=\"background:var(--papel);border-bottom:1px solid var(--linea);padding:38px 0\">\n    <div class=\"wrap\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:48px\">\n      <div>\n        <p class=\"mono\" style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color: {{acento}}\">Módulo de reportes<\/p>\n        <h1 style=\"font-size:40px;margin-top:14px\">Reportes y bitácora<\/h1>\n        <p style=\"font-size:17px;color:var(--gris);margin-top:12px;max-width:720px\">El módulo está aprobado por la empresa pero su contenido no se ha especificado. Aquí se propone lo que ya se desprende de los requerimientos confirmados, para que INCOVSA lo revise y lo complete.<\/p>\n      <\/div>\n      <span class=\"llave\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect><path d=\"M5.5 7V4.8a2.5 2.5 0 015 0V7\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n        GERENCIA Y SOPORTE IT\n      <\/span>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:34px 0 80px\">\n    <div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:26px\">\n\n      <!-- ============ FILTROS ============ -->\n      <div class=\"tarjeta\">\n        <div class=\"g3\">\n          <div><span class=\"rotulo\">Reporte<\/span>\n            <select class=\"campo\">\n              <option>Despacho diario<\/option>\n              <option>Rutas realizadas<\/option>\n              <option>Movimientos de inventario<\/option>\n              <option>Bitácora de operaciones<\/option>\n            <\/select>\n          <\/div>\n          <div><span class=\"rotulo\">Sede<\/span>\n            <select class=\"campo\"><option>Quetzaltenango<\/option><option>Todas las sedes<\/option><\/select>\n          <\/div>\n          <div><span class=\"rotulo\">Rango de fechas<\/span>\n            <input class=\"campo\" type=\"text\" value=\"21/09/2026 &#8212; 21/09/2026\">\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- ============ REPORTE DIARIO ============ -->\n      <div class=\"tarjeta\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px\">\n          <div>\n            <h2 style=\"font-size:21px\">Despacho diario<\/h2>\n            <p style=\"font-size:15px;color:var(--gris);margin-top:6px\">Es el reporte que la empresa pidió expresamente en su documento de propuesta.<\/p>\n          <\/div>\n          <div style=\"display:flex;gap:9px\">\n            <button class=\"btn btn-l\">Exportar a Excel<\/button>\n            <button class=\"btn btn-l\">Exportar a PDF<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"g3\" style=\"margin-bottom:24px\">\n          <div style=\"border-left:3px solid var(--verde700);padding-left:18px\">\n            <p class=\"cifra\">3,710<\/p>\n            <p class=\"mono\" style=\"font-size:11px;letter-spacing:.14em;color:var(--gris);margin-top:8px\">KILOGRAMOS DESPACHADOS<\/p>\n          <\/div>\n          <div style=\"border-left:3px solid var(--verde500);padding-left:18px\">\n            <p class=\"cifra\">93<\/p>\n            <p class=\"mono\" style=\"font-size:11px;letter-spacing:.14em;color:var(--gris);margin-top:8px\">UNIDADES COMPLETAS, MÁS 10 KG SUELTOS<\/p>\n          <\/div>\n          <div style=\"border-left:3px solid var(--dorado);padding-left:18px\">\n            <p class=\"cifra\">2<\/p>\n            <p class=\"mono\" style=\"font-size:11px;letter-spacing:.14em;color:var(--gris);margin-top:8px\">PEDIDOS CERRADOS<\/p>\n          <\/div>\n        <\/div>\n\n        <table>\n          <thead>\n            <tr>\n              <th style=\"width:90px\">SKU<\/th>\n              <th>Producto<\/th>\n              <th style=\"width:140px;text-align:right\">Cantidad (kg)<\/th>\n              <th style=\"width:160px;text-align:right\">Unidades<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <template data-sc-for=\"lineas\" data-as=\"l\">\n              <tr>\n                <td class=\"cod\">{{l.sku}}<\/td>\n                <td class=\"cod\" style=\"color:var(--tinta)\">{{l.producto}}<\/td>\n                <td class=\"num\">{{l.cantidad}}<\/td>\n                <td class=\"num\">{{l.unidades}}<\/td>\n              <\/tr>\n            <\/template>\n          <\/tbody>\n          <tfoot>\n            <tr>\n              <td colspan=\"2\" style=\"text-align:right\">Total del día<\/td>\n              <td class=\"num\">3,710<\/td>\n              <td class=\"num\">93 + 10 kg<\/td>\n            <\/tr>\n          <\/tfoot>\n        <\/table>\n      <\/div>\n\n      <!-- ============ RUTAS Y BITÁCORA ============ -->\n      <div class=\"g2\">\n        <div class=\"tarjeta\">\n          <h2 style=\"font-size:21px;margin-bottom:8px\">Rutas realizadas<\/h2>\n          <p style=\"font-size:15px;color:var(--gris);margin-bottom:18px\">Registro histórico de cada ruta, desde que se captura el pedido hasta que se cierra la entrega.<\/p>\n          <table>\n            <thead><tr><th style=\"width:70px\">Ruta<\/th><th>Fecha<\/th><th>Camión<\/th><th style=\"text-align:right\">Total (kg)<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td class=\"cod\">1<\/td><td>21/09/2026<\/td><td>Camión 1<\/td><td class=\"num\">3,460<\/td><\/tr>\n              <tr><td colspan=\"4\" style=\"color:var(--gris);font-size:15px\">Las demás rutas aparecen conforme se cierren.<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n\n        <div class=\"tarjeta\">\n          <h2 style=\"font-size:21px;margin-bottom:8px\">Bitácora de operaciones<\/h2>\n          <p style=\"font-size:15px;color:var(--gris);margin-bottom:18px\">Queda registrada toda operación de todos los usuarios, incluidos los movimientos de inventario y las devoluciones.<\/p>\n          <table>\n            <thead><tr><th>Fecha<\/th><th>Usuario<\/th><th>Operación<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td class=\"cod\">21/09 10:42<\/td><td>Facturador<\/td><td>Envió el pedido 1 a bodega<\/td><\/tr>\n              <tr><td class=\"cod\">21/09 11:15<\/td><td>Bodega<\/td><td>Cerró la preparación del pedido 2<\/td><\/tr>\n              <tr><td class=\"cod\">21/09 15:08<\/td><td>Gerencia<\/td><td>Registró una devolución del pedido 1<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/div>\n\n      <!-- ============ PENDIENTE ============ -->\n      <template data-sc-if=\"marcar\">\n        <div class=\"pend\">\n          <p class=\"pend-t\">Pendiente de INCOVSA &#183; módulo sin especificar<\/p>\n          <p style=\"font-size:16px;color:#54451A;max-width:900px\">Este es el único módulo cuyo contenido no se ha definido. Falta acordar qué reportes se necesitan además del despacho diario, qué columnas y filtros lleva cada uno, quién puede verlos, si se necesitan reportes de movimientos de inventario y en qué formato se exportan. La empresa también dijo que el reporte diario es de &laquo;kilogramos y sacos&raquo;: falta definir cómo se cuentan los productos que no vienen en saco.<\/p>\n          <div class=\"g3\" style=\"margin-top:12px\">\n            <div class=\"lineas\"><div class=\"lin\" style=\"width:76%\"><\/div><div class=\"lin\" style=\"width:100%\"><\/div><div class=\"lin\" style=\"width:62%\"><\/div><\/div>\n            <div class=\"lineas\"><div class=\"lin\" style=\"width:68%\"><\/div><div class=\"lin\" style=\"width:100%\"><\/div><div class=\"lin\" style=\"width:81%\"><\/div><\/div>\n            <div class=\"lineas\"><div class=\"lin\" style=\"width:84%\"><\/div><div class=\"lin\" style=\"width:100%\"><\/div><div class=\"lin\" style=\"width:55%\"><\/div><\/div>\n          <\/div>\n        <\/div>\n      <\/template>\n\n    <\/div>\n  <\/section>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#E8CE72\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      lineas: [\n        { sku: '6960', producto: 'SODA CAUSTICA-MEX-SAC/0025KG-6960', cantidad: '750', unidades: '30' },\n        { sku: '6241', producto: 'SULFATO DE SODIO-CHI-SAC/0050KG-6241', cantidad: '2,050', unidades: '41' },\n        { sku: '9238', producto: 'ACIDO FORMICO-CHI-GAR/0035KG-9238', cantidad: '350', unidades: '10' },\n        { sku: '0163', producto: 'NEGRO SULFUROSO HIGH QUALITY-CHI-SAC/0025KG-0163', cantidad: '60', unidades: '2 + 10 kg' },\n        { sku: '6830', producto: 'HIDROSULFITO DE SODIO-CHI-TON/0050KG-6830', cantidad: '500', unidades: '10' }\n      ]\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Configuracion.dc.html": {"titulo": "Módulo de Configuración", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.06;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1320px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .barra{background:var(--verde900);height:72px;display:flex;align-items:center}\n    .barra-in{display:flex;align-items:center;justify-content:space-between;width:100%;gap:40px}\n    .barra a{color:#D6D2C7;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .barra a:hover{color:var(--oro)}\n    .barra a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .avatar{width:36px;height:36px;border-radius:50%;background:var(--verde500);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:700;font-size:13px}\n    .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:28px 30px}\n    .rotulo{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);display:block;margin-bottom:7px}\n    .campo{width:100%;font-family:Archivo,sans-serif;font-size:15px;padding:12px 14px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;color:var(--tinta)}\n    .campo:focus{outline:2px solid var(--verde500);outline-offset:-1px}\n    .con-lateral{display:grid;grid-template-columns:266px 1fr;gap:26px;align-items:start}\n    .lateral{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:14px}\n    .lateral button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 14px;font-family:Archivo,sans-serif;font-size:15px;font-weight:600;color:var(--gris);background:transparent;border:0;border-radius:2px;cursor:pointer}\n    .lateral button:hover{background:rgba(47,139,76,.07);color:var(--verde700)}\n    .lateral button.act{background:var(--verde700);color:#fff}\n    .lateral button.act .cuenta{color:var(--oro)}\n    .cuenta{font-family:\"IBM Plex Mono\",monospace;font-size:12px;color:var(--gris)}\n    .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}\n    table{width:100%;border-collapse:collapse;background:var(--papel);border:1px solid var(--linea)}\n    th{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);text-align:left;padding:15px 18px;border-bottom:1px solid var(--linea);font-weight:500}\n    td{padding:16px 18px;border-bottom:1px solid var(--linea);vertical-align:middle;font-size:16px}\n    tr:last-child td{border-bottom:0}\n    .cod{font-family:\"IBM Plex Mono\",monospace;font-size:14px;color:var(--gris)}\n    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:14px 26px;border-radius:2px;border:0;cursor:pointer}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900)}\n    .btn-l{background:transparent;color:var(--gris);border:1.5px solid var(--linea)}\n    .btn-l:hover{border-color:var(--gris);color:var(--tinta)}\n    .mini{font-family:Archivo,sans-serif;font-size:12px;font-weight:600;padding:6px 10px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;cursor:pointer;color:var(--gris)}\n    .mini:hover{border-color:var(--verde500);color:var(--verde700)}\n    .etiqueta{display:inline-flex;align-items:center;font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:2px;background:#EDEAE2;color:var(--gris)}\n    .etiqueta.verde{background:rgba(47,139,76,.14);color:var(--verde700)}\n    .etiqueta.oro{background:rgba(201,162,39,.18);color:#7A6014}\n    .llave{display:inline-flex;align-items:center;gap:7px;font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.14em;padding:6px 11px;border-radius:2px;background:rgba(201,162,39,.16);color:#7A6014}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:24px 26px;border-radius:2px;display:flex;flex-direction:column;gap:9px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <!-- ============ BARRA INTERNA ============ -->\n  <div class=\"barra\">\n    <div class=\"wrap barra-in\">\n      <div style=\"display:flex;align-items:center;gap:44px\">\n        <a href=\"#\" style=\"display:flex;align-items:center;gap:11px\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.6\"><\/rect>\n            <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n            <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <\/svg>\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:17px;color:#fff\">INCOVSA<\/span>\n          <span class=\"mono\" style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);border-left:1px solid rgba(232,206,114,.4);padding-left:11px\">Control logístico de bodega<\/span>\n        <\/a>\n        <div style=\"display:flex;align-items:center;gap:28px\">\n          <a href=\"Facturacion.dc.html\">Facturación<\/a>\n          <a href=\"Bodega.dc.html\">Bodega<\/a>\n          <a href=\"Ruta.dc.html\">Ruta<\/a>\n          <a href=\"Inventario.dc.html\">Inventario<\/a>\n          <a href=\"Reportes.dc.html\">Reportes<\/a>\n          <a href=\"#\" class=\"act\">Configuración<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"text-align:right\">\n          <p style=\"font-family:Archivo,sans-serif;font-size:14px;font-weight:600;color:#fff;line-height:1.3\">Usuario de ejemplo<\/p>\n          <p class=\"mono\" style=\"font-size:10px;color:var(--oro);letter-spacing:.1em\">SOPORTE IT &#183; TODAS LAS SEDES<\/p>\n        <\/div>\n        <div class=\"avatar\">UE<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ============ ENCABEZADO ============ -->\n  <section style=\"background:var(--papel);border-bottom:1px solid var(--linea);padding:38px 0\">\n    <div class=\"wrap\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:48px\">\n      <div>\n        <p class=\"mono\" style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color: {{acento}}\">Módulo de configuración<\/p>\n        <h1 style=\"font-size:40px;margin-top:14px\">Catálogos y usuarios<\/h1>\n        <p style=\"font-size:17px;color:var(--gris);margin-top:12px;max-width:760px\">Aquí se administran los productos, clientes, sectores, camiones y usuarios del sistema de picking, en todas las sedes. Gerencia y Soporte IT pueden crear, editar y eliminar cada registro. Desde los módulos de operación no se crean clientes ni productos.<\/p>\n      <\/div>\n      <span class=\"llave\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect><path d=\"M5.5 7V4.8a2.5 2.5 0 015 0V7\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n        GERENCIA Y SOPORTE IT\n      <\/span>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:34px 0 80px\">\n    <div class=\"con-lateral wrap\">\n\n      <!-- ============ CATÁLOGOS ============ -->\n      <aside class=\"lateral\">\n        <p class=\"rotulo\" style=\"padding:4px 14px 10px\">Catálogos del sistema<\/p>\n        <template data-sc-for=\"catalogos\" data-as=\"c\">\n          <button class=\"{{c.clase}}\" onClick=\"{{c.elegir}}\">\n            <span>{{c.nombre}}<\/span>\n            <span class=\"cuenta\">{{c.cuenta}}<\/span>\n          <\/button>\n        <\/template>\n      <\/aside>\n\n      <div style=\"display:flex;flex-direction:column;gap:24px\">\n\n        <!-- ============ USUARIOS ============ -->\n        <div class=\"tarjeta\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px\">\n            <div>\n              <h2 style=\"font-size:21px\">Usuarios<\/h2>\n              <p style=\"font-size:15px;color:var(--gris);margin-top:6px\">Gerencia y Soporte IT crean cuentas de cualquier rol del picking y les asignan la sede. Cada cuenta tiene un solo rol; solo una cuenta de Gerencia sirve también en el sitio web.<\/p>\n            <\/div>\n            <button class=\"btn btn-p\">Nuevo usuario<\/button>\n          <\/div>\n\n          <table>\n            <thead>\n              <tr>\n                <th>Nombre<\/th>\n                <th style=\"width:130px\">Usuario<\/th>\n                <th style=\"width:190px\">Rol<\/th>\n                <th style=\"width:150px\">Sede<\/th>\n                <th style=\"width:110px\">Estado<\/th>\n                <th style=\"width:185px\"><\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <template data-sc-for=\"usuarios\" data-as=\"u\">\n                <tr>\n                  <td style=\"white-space:nowrap\">{{u.nombre}}<\/td>\n                  <td class=\"cod\">{{u.usuario}}<\/td>\n                  <td><span class=\"etiqueta {{u.claseRol}}\">{{u.rol}}<\/span><\/td>\n                  <td style=\"font-size:15px;color:var(--gris)\">{{u.sede}}<\/td>\n                  <td><span class=\"etiqueta verde\">Activo<\/span><\/td>\n                  <td style=\"white-space:nowrap\"><button class=\"mini\">Editar<\/button> <button class=\"mini\" title=\"Restablecer contraseña\">Contraseña<\/button><\/td>\n                <\/tr>\n              <\/template>\n            <\/tbody>\n          <\/table>\n\n          <p class=\"mono\" style=\"font-size:12px;color:var(--gris);margin-top:16px;line-height:1.7\">Cantidades confirmadas por INCOVSA: gerencia 4, soporte IT 1, facturador 4 (2 en Quetzaltenango, 1 en Guatemala, 1 en Escuintla) y bodega 4 con el mismo reparto. La cantidad de pilotos está pendiente.<\/p>\n        <\/div>\n\n        <!-- ============ ALTA DE USUARIO ============ -->\n        <div class=\"tarjeta\">\n          <h2 style=\"font-size:21px;margin-bottom:20px\">Alta de usuario<\/h2>\n          <div class=\"g4\" style=\"margin-bottom:20px\">\n            <div>\n              <label class=\"rotulo\" for=\"c-nombre\">Nombre completo<\/label>\n              <input class=\"campo\" id=\"c-nombre\" type=\"text\" placeholder=\"Nombre y apellido\">\n            <\/div>\n            <div>\n              <label class=\"rotulo\" for=\"c-usuario\">Usuario<\/label>\n              <input class=\"campo\" id=\"c-usuario\" type=\"text\" placeholder=\"nombre.apellido\">\n            <\/div>\n            <div>\n              <label class=\"rotulo\" for=\"c-rol\">Rol<\/label>\n              <select class=\"campo\" id=\"c-rol\">\n                <option>Gerencia<\/option>\n                <option>Soporte IT<\/option>\n                <option>Operativo Facturador<\/option>\n                <option>Operativo Bodega<\/option>\n                <option>Operativo Piloto<\/option>\n              <\/select>\n            <\/div>\n            <div>\n              <label class=\"rotulo\" for=\"c-sede\">Sede<\/label>\n              <select class=\"campo\" id=\"c-sede\">\n                <option>Quetzaltenango<\/option>\n                <option>Guatemala<\/option>\n                <option>Escuintla<\/option>\n                <option>Todas las sedes<\/option>\n              <\/select>\n            <\/div>\n          <\/div>\n          <div style=\"display:flex;gap:12px\">\n            <button class=\"btn btn-p\">Crear usuario<\/button>\n            <button class=\"btn btn-l\">Cancelar<\/button>\n          <\/div>\n          <p style=\"font-size:15px;color:var(--gris);margin-top:16px\">La opción de todas las sedes solo aplica a Gerencia y Soporte IT. Los roles operativos quedan limitados a una sola sede. El correo es opcional: los operarios sin correo piden a Soporte IT que restablezca su contraseña.<\/p>\n        <\/div>\n\n        <!-- ============ CAMIONES ============ -->\n        <div class=\"tarjeta\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px\">\n            <div>\n              <h2 style=\"font-size:21px\">Camiones de Quetzaltenango<\/h2>\n              <p style=\"font-size:15px;color:var(--gris);margin-top:6px\">La capacidad máxima, en kilogramos, es la que alimenta la alerta del módulo de facturación.<\/p>\n            <\/div>\n            <button class=\"btn btn-p\">Nuevo camión<\/button>\n          <\/div>\n          <table>\n            <thead>\n              <tr>\n                <th style=\"width:220px\">Identificación<\/th>\n                <th style=\"width:200px\">Capacidad máxima<\/th>\n                <th>Sede<\/th>\n                <th style=\"width:170px\"><\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <tr><td>Camión 1<\/td><td class=\"cod\">3,400 kg<\/td><td style=\"color:var(--gris);font-size:15px\">Quetzaltenango<\/td><td style=\"white-space:nowrap\"><button class=\"mini\">Editar<\/button> <button class=\"mini\">Eliminar<\/button><\/td><\/tr>\n              <tr><td>Camión 2<\/td><td class=\"cod\">3,400 kg<\/td><td style=\"color:var(--gris);font-size:15px\">Quetzaltenango<\/td><td style=\"white-space:nowrap\"><button class=\"mini\">Editar<\/button> <button class=\"mini\">Eliminar<\/button><\/td><\/tr>\n              <tr><td>Camión 3<\/td><td class=\"cod\">6,000 kg<\/td><td style=\"color:var(--gris);font-size:15px\">Quetzaltenango<\/td><td style=\"white-space:nowrap\"><button class=\"mini\">Editar<\/button> <button class=\"mini\">Eliminar<\/button><\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n\n        <!-- ============ PRODUCTOS ============ -->\n        <div class=\"tarjeta\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px\">\n            <div>\n              <h2 style=\"font-size:21px\">Productos<\/h2>\n              <p style=\"font-size:15px;color:var(--gris);margin-top:6px\">El Peso2 es el peso en kilogramos de una unidad física y es el divisor de la conversión. Se captura al crear el producto y se cambia al editarlo. Los pedidos ya enviados conservan el Peso2 con el que se vendieron.<\/p>\n            <\/div>\n            <button class=\"btn btn-p\">Nuevo producto<\/button>\n          <\/div>\n          <table>\n            <thead>\n              <tr>\n                <th style=\"width:90px\">SKU<\/th>\n                <th>Código completo<\/th>\n                <th style=\"width:130px;text-align:right\">Peso2 (kg)<\/th>\n                <th style=\"width:170px\"><\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <tr><td class=\"cod\">6960<\/td><td class=\"cod\" style=\"color:var(--tinta)\">SODA CAUSTICA-MEX-SAC/0025KG-6960<\/td><td class=\"cod\" style=\"text-align:right\">25<\/td><td style=\"white-space:nowrap\"><button class=\"mini\">Editar<\/button> <button class=\"mini\">Eliminar<\/button><\/td><\/tr>\n              <tr><td class=\"cod\">6241<\/td><td class=\"cod\" style=\"color:var(--tinta)\">SULFATO DE SODIO-CHI-SAC/0050KG-6241<\/td><td class=\"cod\" style=\"text-align:right\">50<\/td><td style=\"white-space:nowrap\"><button class=\"mini\">Editar<\/button> <button class=\"mini\">Eliminar<\/button><\/td><\/tr>\n              <tr><td class=\"cod\">0163<\/td><td class=\"cod\" style=\"color:var(--tinta)\">NEGRO SULFUROSO HIGH QUALITY-CHI-SAC/0025KG-0163<\/td><td class=\"cod\" style=\"text-align:right\">25<\/td><td style=\"white-space:nowrap\"><button class=\"mini\">Editar<\/button> <button class=\"mini\">Eliminar<\/button><\/td><\/tr>\n            <\/tbody>\n          <\/table>\n          <p class=\"mono\" style=\"font-size:12px;color:var(--gris);margin-top:16px;line-height:1.7\">El SKU es el último segmento del código y solo es informativo. La clave de cada producto es su código completo.<\/p>\n        <\/div>\n\n        <template data-sc-if=\"marcar\">\n          <div class=\"pend\">\n            <p class=\"pend-t\">Pendiente de INCOVSA<\/p>\n            <p style=\"font-size:16px;color:#54451A\">Falta la identificación real de los tres camiones, que aquí aparecen numerados, los nombres de los pilotos para crear sus cuentas y el usuario administrador inicial con el que se crean los demás. También falta confirmar que no existe un catálogo aparte de unidades de venta: la unidad de venta de cada producto es su Peso2.<\/p>\n          <\/div>\n        <\/template>\n\n      <\/div>\n    <\/div>\n  <\/section>\n<\/div>\n<\/x-dc><script type=\"text/x-dc\" data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#E8CE72\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"},\"$preview\":{\"width\":1440,\"height\":2600}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { activo: 'usuarios' };\n  }\n  renderVals() {\n    var self = this;\n    var act = this.state.activo;\n    var cats = [\n      { id: 'productos', nombre: 'Productos', cuenta: '856' },\n      { id: 'clientes', nombre: 'Clientes', cuenta: '318' },\n      { id: 'sectores', nombre: 'Sectores', cuenta: '43' },\n      { id: 'camiones', nombre: 'Camiones', cuenta: '3' },\n      { id: 'usuarios', nombre: 'Usuarios', cuenta: '13' }\n    ];\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      catalogos: cats.map(function (c) {\n        return {\n          nombre: c.nombre,\n          cuenta: c.cuenta,\n          clase: act === c.id ? 'act' : '',\n          elegir: function () { self.setState({ activo: c.id }); }\n        };\n      }),\n      usuarios: [\n        { nombre: 'Usuario de ejemplo 01', usuario: 'ejemplo.01', rol: 'Gerencia', claseRol: 'oro', sede: 'Todas las sedes' },\n        { nombre: 'Usuario de ejemplo 02', usuario: 'ejemplo.02', rol: 'Soporte IT', claseRol: 'oro', sede: 'Todas las sedes' },\n        { nombre: 'Usuario de ejemplo 03', usuario: 'ejemplo.03', rol: 'Operativo Facturador', claseRol: '', sede: 'Quetzaltenango' },\n        { nombre: 'Usuario de ejemplo 04', usuario: 'ejemplo.04', rol: 'Operativo Facturador', claseRol: '', sede: 'Quetzaltenango' },\n        { nombre: 'Usuario de ejemplo 05', usuario: 'ejemplo.05', rol: 'Operativo Bodega', claseRol: '', sede: 'Quetzaltenango' },\n        { nombre: 'Usuario de ejemplo 06', usuario: 'ejemplo.06', rol: 'Operativo Piloto', claseRol: '', sede: 'Quetzaltenango' }\n      ]\n    };\n  }\n}\n<\/script><\/body><\/html>"}};
const INICIAL = "Main.dc.html";
const app = document.getElementById('app');

const claveDe = (archivo) => archivo.replace('.dc.html', '').toLowerCase();
const archivoDe = (clave) => Object.keys(PANTALLAS).find(a => claveDe(a) === clave);

function ir(archivo, empujar) {
  const pantalla = PANTALLAS[archivo];
  if (!pantalla) return;
  document.title = pantalla.titulo + ' · INCOVSA';
  app.srcdoc = pantalla.html;
  if (empujar !== false) history.pushState({ archivo }, '', '#' + claveDe(archivo));
}

window.addEventListener('message', e => {
  if (e.data && e.data.dc === 'ir') ir(e.data.archivo, true);
});

window.addEventListener('popstate', e => {
  const archivo = (e.state && e.state.archivo) || archivoDe((location.hash || '').replace('#', '')) || INICIAL;
  ir(archivo, false);
});

const inicial = archivoDe((location.hash || '').replace('#', '')) || INICIAL;
history.replaceState({ archivo: inicial }, '', '#' + claveDe(inicial));
ir(inicial, false);
</script>
