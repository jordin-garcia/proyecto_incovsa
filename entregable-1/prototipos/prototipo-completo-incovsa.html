[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <header class=\"nav\">\n    <div class=\"wrap nav-in\">\n      <a href=\"#\" class=\"marca\">\n        <svg width=\"38\" height=\"38\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n          <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.4\"><\/rect>\n          <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n          <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <path d=\"M27 27v-6h1.6v6z\" fill=\"#2F8B4C\"><\/path>\n        <\/svg>\n        <span style=\"display:flex;flex-direction:column\">\n          <span class=\"marca-n\">INCOVSA<\/span>\n          <span class=\"marca-s\">Químicos<\/span>\n        <\/span>\n      <\/a>\n      <nav class=\"menu\">\n        <a href=\"#\">Inicio<\/a>\n        <a href=\"#\">Quiénes somos<\/a>\n        <a href=\"#\" class=\"act\">Industrias<\/a>\n        <a href=\"#\">Productos<\/a>\n        <a href=\"#\">Contacto<\/a>\n        <a href=\"#\" class=\"acceso\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1\"           <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:36px\">\n            <div>\n              <p class=\"mono\" style=\"font-size:11px;letter-spacing:.18em;color:var(--verde700)\">INDUSTRIA {{sel.numero}}<\/p>\n              <h2 style=\"font-size:42px;margin-top:12px\">{{sel.nombre}}<\/h2>\n            <\/div>\n            <a href=\"#\" class=\"btn btn-p\" style=\"white-space:nowrap\">\n              Ver catálogo\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"square\"><\/path><\/svg>\n            <\/a>\n          <\/div>\n\n          <p style=\"font-size:18px;line-height:1.66;color:#3A3A34;max-width:760px;text-wrap:pretty\">{{sel.descripcion}}<\/p>\n\n          <div style=\"border-top:1px solid var(--linea);padding-top:26px\">\n            <p class=\"mono\" style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-bottom:18px\">Productos para esta industria &#183; {{sel.total}}<\/p>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <template data-sc-for=\"sel.productos\" data-as=\"prod\">\n                <a href=\"#\" class=\"chip\"><span class=\"pt\"><\/span>{{prod}}<\/a>\n              <\/template>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n          <div class=\"foto\" style=\"height:230px\">\n            <svg width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><circle cx=\"9\" cy=\"10\" r=\"1.8\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/circle><path d=\"M3 16.5l5-4 4.5 3.5L16 13l5 4\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"><\/path><\/svg>\n            <span class=\"foto-t\">Fotografía de la industria<\/span>\n          <\/div>\n          <template data-sc-if=\"marcar\">\n            <div class=\"pend\">\n              <p class=\"pend-t\">\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 2l6 11H2z\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\/path><path d=\"M8 6.5v3\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n                Revisar con INCOVSA\n              <\/p>\n              <p style=\"font-size:15px;color:#6B5A21\">Las descripciones vienen literales de la página de Google Sites de la empresa y necesitan revisión de redacción y ortografía. Las imágenes de esa página están a 275 &#215; 183 px, insuficientes para este diseño; se requieren fotografías propias en alta resolución.<\/p>\n            <\/div>\n          <\/template>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <footer class=\"pie\">\n    <div class=\"wrap\">\n      <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:48px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.12)\">\n        <div>\n          <p style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:21px;color:#fff\">INCOVSA<\/p>\n          <p class=\"mono\" style=\"font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px\">Químicos<\/p>\n          <p style=\"margin-top:20px;font-size:15px;max-width:290px\">Industria del Cuero Covadonga, S. A. Compra y venta de productos químicos en Guatemala.<\/p>\n        <\/div>\n        <div>\n          <h4>Navegación<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Inicio<\/a><a href=\"#\">Quiénes somos<\/a><a href=\"#\">Industrias<\/a><a href=\"#\">Productos<\/a><a href=\"#\">Contacto<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Sedes<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Quetzaltenango<\/a><a href=\"#\">Guatemala<\/a><a href=\"#\">Escuintla<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Contacto<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">facturacion@incovsa.com<\/a>\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">recepciongt@incovsa.com<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n      <p style=\"padding-top:26px;font-size:13px;color:#7E7A71\">Prototipo para validación &#183; Universidad Rafael Landívar &#183; Proyecto de Programación Web<\/p>\n    <\/div>\n  <\/footer>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#B45309\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { activa: 'cuero' };\n  }\n  datos() {\n    return [\n      { id: 'cuero', numero: '01', nombre: 'Cuero',\n        descripcion: 'Actividad manufacturera que se encarga de procesar la piel de los animales mediante un proceso de curtido, las cuales posteriormente se encargan de usar las pieles como materia prima para la fabricación de zapatos, bolsas, vestimenta, accesorios, tapizados y otros.',\n        productos: ['Ácido Fórmico', 'Ácido Sulfúrico', 'Extracto de Quebracho', 'Extracto de Mimosa', 'Soda Ash (Carbonato de Sodio)', 'Sulfato de Cromo', 'Sulfuro de Sodio', 'Productos SILVATEAM', 'Colorante Cuero'] },\n      { id: 'textil', numero: '02', nombre: 'Textil',\n        descripcion: 'Industria dedicada a la actividad y manufacturas de hilo, fibras naturales y sintéticas, telas y otros materiales para obtener productos derivados de ropa y vestimenta.',\n        productos: ['Ácido Acético', 'Negro Sulfuroso', 'Soda Cáustica', 'Soda Ash (Carbonato de Sodio)', 'Sulfato de Sodio', 'Sulfuro de Sodio', 'Colorantes Reactivos'] },\n      { id: 'cereria', numero: '03', nombre: 'Cerería',\n        descripcion: 'Establecimiento comercial o persona individual donde se procesa y elabora objetos cuya materia prima principal es la parafina.',\n        productos: ['Parafina Full Refinada 56/58', 'Parafina Full Refinada 58/60', 'Parafina Semi-Refinada 56/58', 'Parafina Semi-Refinada 58/60'] },\n      { id: 'hulera', numero: '04', nombre: 'Hulera',\n        descripcion: 'Establecimiento comercial o persona individual dedicada a la compra, venta, distribución y transformación de toda clase de productos relacionados con el hule, natural o sintético.',\n        productos: ['Ácido Acético', 'Ácido Fórmico', 'Ácido Sulfúrico', 'Soda Cáustica'] },\n      { id: 'medicamentos', numero: '05', nombre: 'Medicamentos',\n        descripcion: 'Sector que se dedica a la fabricación, preparación y comercialización de productos químicos o medicamentos para el tratamiento o prevención de enfermedades.',\n        productos: ['Ácido Oxálico', 'Bicarbonato de Amonio', 'Bicarbonato de Sodio', 'Soda Cáustica', 'Sulfato de Magnesio', 'Parafina', 'Hipoclorito de Calcio'] },\n      { id: 'limpieza', numero: '06', nombre: 'Limpieza',\n        descripcion: 'Sector que se dedica a la fabricación, preparación y comercialización de productos químicos como jabón, detergentes, cosméticos y otros.',\n        productos: ['Ácido Acético', 'Hipoclorito de Calcio', 'Soda Cáustica', 'Soda Ash (Carbonato de Sodio)'] },\n      { id: 'alimentacion', numero: '07', nombre: 'Alimentación animal',\n        descripcion: 'Industria que se encarga de todos los procesos relacionados con la cadena alimentaria, desde almacenamiento, procesamiento, conservación y servicios de alimentos de consumo animal.',\n        productos: ['Ácido Acético', 'Bicarbonato', 'Hipoclorito de Calcio', 'Soda Ash (Carbonato de Sodio)', 'Soda Cáustica', 'Productos SILVAFEED'] },\n      { id: 'agua', numero: '08', nombre: 'Tratamiento de agua',\n        descripcion: 'Establecimiento comercial o persona individual que se dedica a la distribución y comercialización de tratamiento de agua, que comprende el conjunto de operaciones físicas, químicas, fisicoquímicas o biológicas cuya finalidad es la eliminación o reducción de la contaminación no deseable en aguas naturales, de abastecimiento, de proceso o residuales.',\n        productos: ['Ácido Sulfúrico', 'Hipoclorito de Calcio', 'Soda Ash (Carbonato de Sodio)', 'Soda Cáustica', 'Sulfato de Aluminio', 'Tricloro'] },\n      { id: 'lavanderia', numero: '09', nombre: 'Lavandería',\n        descripcion: 'Establecimiento comercial que se dedica a la limpieza y cuidado de área textil y prendas de vestir a través de procesos de lavado, secado, planchado y servicio de tintorería, atendiendo las necesidades de individuos, empresas, hospitales, hoteles y restaurantes, entre otros.',\n        productos: ['Ácido Acético Glacial', 'Hidrosulfito de Sodio', 'Hipoclorito de Calcio (Cloro)', 'Metabisulfito de Sodio', 'Soda Ash (Carbonato de Sodio)', 'Soda Cáustica', 'Colorantes Directos'] }\n    ];\n  }\n  renderVals() {\n    const activa = this.state.activa;\n    const todas = this.datos();\n    const sel = todas.find(function (x) { return x.id === activa; }) || todas[0];\n    const self = this;\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      industrias: todas.map(function (x) {\n        return {\n          numero: x.numero,\n          nombre: x.nombre,\n          clase: x.id === activa ? 'ind on' : 'ind',\n          elegir: function () { self.setState({ activa: x.id }); }\n        };\n      }),\n      sel: {\n        numero: sel.numero,\n        nombre: sel.nombre,\n        descripcion: sel.descripcion,\n        productos: sel.productos,\n        total: sel.productos.length\n      }\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Catalogo.dc.html": {"titulo": "Catálogo de productos", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3,h4{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.04;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1200px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .eyebrow{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}\n    .nav{background:var(--verde900)}\n    .nav-in{display:flex;align-items:center;justify-content:space-between;height:88px;gap:48px}\n    .marca{display:flex;align-items:center;gap:13px}\n    .marca-n{font-family:Archivo,sans-serif;font-weight:800;font-size:23px;color:#fff;line-height:1}\n    .marca-s{font-family:\"IBM Plex Mono\",monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px}\n    .menu{display:flex;align-items:center;gap:34px;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .menu a{color:#D6D2C7}\n    .menu a:hover{color:var(--oro)}\n    .menu a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .acceso{border:1px solid rgba(232,206,114,.45);color:var(--oro) !important;padding:11px 19px;border-radius:2px;display:flex;align-items:center;gap:9px}\n    .acceso:hover{background:rgba(232,206,114,.12)}\n    .lado{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;padding:12px 16px;cursor:pointer;font-family:Archivo,sans-serif;font-size:15px;font-weight:600;color:var(--tinta);border-radius:2px;transition:background .14s}\n    .lado:hover{background:rgba(20,97,45,.06)}\n    .lado .c{margin-left:auto;font-family:\"IBM Plex Mono\",monospace;font-size:12px;font-weight:400;color:var(--gris)}\n    .lado.on{background:var(--verde700);color:#fff}\n    .lado.on .c{color:var(--oro)}\n    .env{font-family:Archivo,sans-serif;font-size:13px;font-weight:600;padding:9px 15px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;cursor:pointer;color:var(--tinta);transition:.14s}\n    .env:hover{border-color:var(--verde500)}\n    .env.on{background:var(--verde700);border-color:var(--verde700);color:#fff}\n    .busca{width:100%;font-family:Archivo,sans-serif;font-size:15px;padding:14px 16px 14px 44px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;color:var(--tinta)}\n    .busca:focus{outline:2px solid var(--verde500);outline-offset:-1px}\n    .card{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:26px;display:flex;flex-direction:column;gap:13px;transition:border-color .18s,transform .18s}\n    .card:hover{border-color:var(--verde500);transform:translateY(-3px)}\n    .tag{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--verde700);background:rgba(47,139,76,.1);padding:4px 8px;border-radius:2px}\n    .pres{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-family:\"IBM Plex Mono\",monospace;font-size:13px;padding:5px 0;border-bottom:1px dotted var(--linea)}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:28px 30px;border-radius:2px;display:flex;flex-direction:column;gap:11px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12;display:flex;align-items:center;gap:8px}\n    .pie{background:var(--verde900);color:#B6B2A7;padding:72px 0 40px;font-size:15px}\n    .pie h4{color:#fff;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-family:\"IBM Plex Mono\",monospace;font-weight:500;margin-bottom:20px}\n    .pie a{color:#B6B2A7}\n    .pie a:hover{color:var(--oro)}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'con cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props n        <\/div>\n      <\/div>\n      <p style=\"padding-top:26px;font-size:13px;color:#7E7A71\">Prototipo para validación &#183; Universidad Rafael Landívar &#183; Proyecto de Programación Web<\/p>\n    <\/div>\n  <\/footer>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#B45309\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { industria: 'todas', envase: 'todos', q: '' };\n  }\n  catalogo() {\n    return [\n      { c: 'PROD-001', n: 'Ácido Acético Glacial', i: ['textil', 'hulera', 'limpieza', 'alimentacion', 'lavanderia'], p: [['Garrafa', 30], ['IBC', 1000], ['IBC', 1050]], o: ['China', 'USA'] },\n      { c: 'PROD-002', n: 'Ácido Acético Textil', i: ['textil', 'hulera', 'limpieza', 'alimentacion'], p: [['Garrafa', 30], ['IBC', 1050]], o: ['China', 'USA'] },\n      { c: 'PROD-003', n: 'Ácido Acético Industrial', i: ['textil', 'hulera', 'limpieza', 'alimentacion'], p: [['Garrafa', 35], ['IBC', 1050]], o: ['China', 'USA'] },\n      { c: 'PROD-004', n: 'Ácido Fórmico', i: ['cuero', 'hulera'], p: [['Garrafa', 35], ['IBC', 1200]], o: ['China', 'Alemania'] },\n      { c: 'PROD-005', n: 'Ácido Oxálico', i: ['medicamentos'], p: [['Saco', 25]], o: ['China'] },\n      { c: 'PROD-006', n: 'Ácido Sulfúrico', i: ['cuero', 'hulera', 'agua'], p: [['Garrafa', 50], ['IBC', 1600], ['Pipa', 20000]], o: ['Guatemala', 'Salvador'] },\n      { c: 'PROD-007', n: 'Bicarbonato de Sodio', i: ['medicamentos', 'alimentacion'], p: [['Saco', 25]], o: ['China'] },\n      { c: 'PROD-008', n: 'Extracto de Mimosa', i: ['cuero'], p: [['Saco', 25]], o: ['Brasil'] },\n      { c: 'PROD-009', n: 'Extracto de Quebracho', i: ['cuero'], p: [['Saco', 25]], o: ['Argentina'] },\n      { c: 'PROD-010', n: 'Formiato de Sodio', i: [], p: [['Saco', 25]], o: ['China'] },\n      { c: 'PROD-011', n: 'Hidrosulfito de Sodio', i: ['lavanderia'], p: [['Tonel', 50]], o: ['China', 'India'] },\n      { c: 'PROD-012', n: 'Metabisulfito de Sodio', i: ['lavanderia'], p: [['Saco', 25]], o: ['China', 'Turquía'] },\n      { c: 'PROD-013', n: 'Soda Ash', i: ['cuero', 'textil', 'limpieza', 'alimentacion', 'agua', 'lavanderia'], p: [['Saco', 25], ['Saco', 40], ['Saco', 50]], o: ['China'] },\n      { c: 'PROD-014', n: 'Soda Cáustica', i: ['textil', 'hulera', 'medicamentos', 'limpieza', 'alimentacion', 'agua', 'lavanderia'], p: [['Saco', 25]], o: ['China', 'México', 'Polonia'] },\n      { c: 'PROD-015', n: 'Sulfato de Aluminio', i: ['agua'], p: [['Saco', 25]], o: ['México', 'Turquía'] },\n      { c: 'PROD-016', n: 'Sulfato de Cromo', i: ['cuero'], p: [['Saco', 25]], o: ['China'] },\n      { c: 'PROD-017', n: 'Sulfato de Magnesio', i: ['medicamentos'], p: [['Saco', 25]], o: ['Guatemala', 'China'] },\n      { c: 'PROD-018', n: 'Sulfato de Sodio', i: ['textil'], p: [['Saco', 50]], o: ['China', 'México', 'USA'] }\n    ];\n  }\n  nombresIndustria() {\n    return {\n      cuero: 'Cuero', textil: 'Textil', cereria: 'Cerería', hulera: 'Hulera',\n      medicamentos: 'Medicamentos', limpieza: 'Limpieza', alimentacion: 'Alimentación animal',\n      agua: 'Tratamiento de agua', lavanderia: 'Lavandería'\n    };\n  }\n  miles(n) {\n    return String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n  }\n  sinTildes(s) {\n    return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();\n  }\n  renderVals() {\n    const self = this;\n    const st = this.state;\n    const todos = this.catalogo();\n    const nombres = this.nombresIndustria();\n    const claves = ['cuero', 'textil', 'cereria', 'hulera', 'medicamentos', 'limpieza', 'alimentacion', 'agua', 'lavanderia'];\n    const q = this.sinTildes(st.q.trim());\n\n    const coincide = function (x) {\n      if (st.industria !== 'todas' && x.i.indexOf(st.industria) === -1) return false;\n      if (st.envase !== 'todos') {\n        const tiene = x.p.some(function (pr) { return pr[0] === st.envase; });\n        if (!tiene) return false;\n      }\n      if (q) {\n        const texto = self.sinTildes(x.n + ' ' + x.o.join(' ') + ' ' + x.p.map(function (pr) { return pr[0] + ' ' + pr[1]; }).join(' '));\n        if (texto.indexOf(q) === -1) return false;\n      }\n      return true;\n    };\n\n    const visibles = todos.filter(coincide);\n\n    const industrias = [{ id: 'todas', nombre: 'Todas las industrias', cuenta: todos.length }].concat(\n      claves.map(function (k) {\n        return { id: k, nombre: nombres[k], cuenta: todos.filter(function (x) { return x.i.indexOf(k) !== -1; }).length };\n      })\n    ).map(function (it) {\n      return {\n        nombre: it.nombre,\n        cuenta: it.cuenta,\n        clase: st.industria === it.id ? 'lado on' : 'lado',\n        elegir: function () { self.setState({ industria: it.id }); }\n      };\n    });\n\n    const envases = ['todos', 'Saco', 'Garrafa', 'IBC', 'Tonel', 'Pipa'].map(function (e) {\n      return {\n        nombre: e === 'todos' ? 'Todos' : e,\n        clase: st.envase === e ? 'env on' : 'env',\n        elegir: function () { self.setState({ envase: e }); }\n      };\n    });\n\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      q: st.q,\n      total: visibles.length,\n      vacio: visibles.length === 0,\n      escribir: function (e) { self.setState({ q: e.target.value }); },\n      industrias: industrias,\n      envases: envases,\n      productos: visibles.map(function (x) {\n        return {\n          codigo: x.c,\n          nombre: x.n,\n          origen: x.o.join(', ').toUpperCase(),\n          presentaciones: x.p.map(function (pr) { return { tipo: pr[0], kg: self.miles(pr[1]) + ' kg' }; }),\n          tags: x.i.length ? x.i.map(function (k) { return nombres[k]; }) : ['Sin industria asignada']\n        };\n      })\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Producto.dc.html": {"titulo": "Detalle de producto", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3,h4{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.04;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1200px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .eyebrow{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}\n    .nav{background:var(--verde900)}\n    .nav-in{display:flex;align-items:center;justify-content:space-between;height:88px;gap:48px}\n    .marca{display:flex;align-items:center;gap:13px}\n    .marca-n{font-family:Archivo,sans-serif;font-weight:800;font-size:23px;color:#fff;line-height:1}\n    .marca-s{font-family:\"IBM Plex Mono\",monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px}\n    .menu{display:flex;align-items:center;gap:34px;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .menu a{color:#D6D2C7}\n    .menu a:hover{color:var(--oro)}\n    .menu a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .acceso{border:1px solid rgba(232,206,114,.45);color:var(--oro) !important;padding:11px 19px;border-radius:2px;display:flex;align-items:center;gap:9px}\n    .acceso:hover{background:rgba(232,206,114,.12)}\n    .btn{display:inline-flex;align-items:center;gap:11px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:16px 28px;border-radius:2px;border:0;cursor:pointer}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900);color:#fff}\n    .btn-l{background:transparent;color:var(--verde700);border:1.5px solid var(--verde700)}\n    .btn-l:hover{background:var(--verde700);color:#fff}\n    .miga{display:flex;align-items:center;gap:10px;font-family:\"IBM Plex Mono\",monospace;font-size:12px;color:var(--gris);letter-spacing:.06em}\n    .pr{display:flex;align-items:center;gap:18px;width:100%;text-align:left;background:var(--papel);border:1px solid var(--linea);border-left:3px solid var(--linea);padding:17px 20px;cursor:pointer;border-radius:2px;transition:.15s;font-family:\"IBM Plex Mono\",monospace;font-size:14px;color:var(--tinta)}\n    .pr:hover{border-color:var(--verde500);border-left-color:var(--verde500)}\n    .pr .t{font-family:Archivo,sans-serif;font-weight:700;font-size:16px;min-width:88px}\n    .pr .k{margin-left:auto;font-weight:500;font-size:16px}\n    .pr.on{border-color:var(--verde700);border-left-color:var(--verde700);background:rgba(47,139,76,.07)}\n    .tab{font-family:Archivo,sans-serif;font-size:15px;font-weight:700;background:transparent;border:0;border-bottom:2px solid transparent;padding:14px 4px;cursor:pointer;color:var(--gris)}\n    .tab:hover{color:var(--tinta)}\n    .tab.on{color:var(--tinta);border-bottom-color:var(--verde700)}\n    .foto{background:#E7E3D8;border:1.5px dashed #BDB7A8;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8A8474;text-align:center;padding:24px}\n    .foto-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:26px 28px;border-radius:2px;display:flex;flex-direction:column;gap:10px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12;display:flex;align-items:center;gap:8px}\n    .doc{display:flex;align-items:center;gap:16px;background:var(--papel);border:1px solid var(--linea);padding:20px 24px;border-radius:2px}\n    .card{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:24px;display:flex;flex-direction:column;gap:11px;transition:.18s}\n    .card:hover{border-color:var(--verde500);transform:translateY(-3px)}\n    .pie{background:var(--verde900);color:#B6B2A7;padding:72px 0 40px;font-size:15px}\n    .pie h4{color:#fff;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-family:\"IBM Plex Mono\",monospace;font-weight:500;margin-bottom:20px}\n    .pie a{color:#B6B2A7}\n    .pie a:hover{color:var(--oro)}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div>\n  <header class=\"nav\">\n    <div class=\"wrap nav-in\">\n      <a href=\"#\" class=\"marca\">\n        <svg width=\"38\" height=\"38\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n          <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.4\"><\/rect>\n          <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n          <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n          <path d=\"M27 27v-6h1.6v6z\" fill=\"# roke-width=\"1.5\" stroke-linejoin=\"round\"><\/path><path d=\"M8 6.5v3\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n                  Cuatro campos pendientes de INCOVSA &#183; requerimiento RF-SW-05\n                <\/p>\n                <p style=\"font-size:16px;color:#6B5A21\">El Ing. William pidió mostrar estos datos por producto. No existen en la página de Google Sites de la empresa ni en la documentación recibida:<\/p>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px\">\n                  <div style=\"background:rgba(255,255,255,.55);padding:16px 18px;border-radius:2px\">\n                    <p class=\"mono\" style=\"font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8A6D12\">Cómo se maneja<\/p>\n                    <p style=\"font-size:15px;color:#7A6828;margin-top:6px\">Pendiente<\/p>\n                  <\/div>\n                  <div style=\"background:rgba(255,255,255,.55);padding:16px 18px;border-radius:2px\">\n                    <p class=\"mono\" style=\"font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8A6D12\">Almacenamiento<\/p>\n                    <p style=\"font-size:15px;color:#7A6828;margin-top:6px\">Pendiente<\/p>\n                  <\/div>\n                  <div style=\"background:rgba(255,255,255,.55);padding:16px 18px;border-radius:2px\">\n                    <p class=\"mono\" style=\"font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8A6D12\">Área de humedad<\/p>\n                    <p style=\"font-size:15px;color:#7A6828;margin-top:6px\">Pendiente<\/p>\n                  <\/div>\n                  <div style=\"background:rgba(255,255,255,.55);padding:16px 18px;border-radius:2px\">\n                    <p class=\"mono\" style=\"font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8A6D12\">Restricciones de uso<\/p>\n                    <p style=\"font-size:15px;color:#7A6828;margin-top:6px\">Pendiente<\/p>\n                  <\/div>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/template>\n\n          <template data-sc-if=\"esDocs\">\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <h2 style=\"font-size:28px\">Documentación técnica<\/h2>\n              <p style=\"font-size:17px;color:var(--gris)\">Disponible únicamente para personal de INCOVSA con sesión iniciada y según el rol asignado.<\/p>\n              <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:6px\">\n                <div class=\"doc\">\n                  <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\" stroke=\"var(--gris)\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\/path><path d=\"M14 3v4h4\" stroke=\"var(--gris)\" stroke-width=\"1.5\"><\/path><\/svg>\n                  <div style=\"flex:1\">\n                    <p style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:16px\">Ficha técnica<\/p>\n                    <p class=\"mono\" style=\"font-size:12px;color:var(--gris)\">PDF &#183; acceso restringido<\/p>\n                  <\/div>\n                  <span class=\"mono\" style=\"font-size:11px;color:var(--gris);display:flex;align-items:center;gap:7px;letter-spacing:.1em\">\n                    <svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect><path d=\"M5.5 7V4.8a2.5 2.5 0 015 0V7\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n                    REQUIERE INGRESO\n                  <\/span>\n                <\/div>\n                <div class=\"doc\">\n                  <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\" stroke=\"var(--gris)\" stroke-width=\"1.5\" str
