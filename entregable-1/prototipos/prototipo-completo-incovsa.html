7\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n                    REQUIERE INGRESO\n                  <\/span>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/template>\n        <\/div>\n      <\/div>\n\n      <aside style=\"background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:32px;display:flex;flex-direction:column;gap:22px\">\n        <h3 style=\"font-size:21px\">Datos de la presentación seleccionada<\/h3>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px dotted var(--linea)\">\n            <span class=\"mono\" style=\"font-size:12px;color:var(--gris);letter-spacing:.1em\">ENVASE<\/span>\n            <span class=\"mono\" style=\"font-size:14px;font-weight:500\">{{sel.tipo}}<\/span>\n          <\/div>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px dotted var(--linea)\">\n            <span class=\"mono\" style=\"font-size:12px;color:var(--gris);letter-spacing:.1em\">CONTENIDO<\/span>\n            <span class=\"mono\" style=\"font-size:14px;font-weight:500\">{{sel.kg}}<\/span>\n          <\/div>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px dotted var(--linea)\">\n            <span class=\"mono\" style=\"font-size:12px;color:var(--gris);letter-spacing:.1em\">UNIDAD DE VENTA<\/span>\n            <span class=\"mono\" style=\"font-size:14px;font-weight:500\">Kilogramo<\/span>\n          <\/div>\n          <div style=\"display:flex;justify-content:space-between;gap:16px\">\n            <span class=\"mono\" style=\"font-size:12px;color:var(--gris);letter-spacing:.1em\">LOTE<\/span>\n            <span class=\"mono\" style=\"font-size:14px;color:var(--gris)\">No se publica<\/span>\n          <\/div>\n        <\/div>\n        <p style=\"font-size:15px;color:var(--gris);padding-top:16px;border-top:1px solid var(--linea);text-wrap:pretty\">El precio y el número de lote no se muestran en el sitio público. Para cotizaciones, comuníquese con la sede que le corresponde.<\/p>\n        <a href=\"#\" class=\"btn btn-p\" style=\"justify-content:center\">Contactar a un asesor<\/a>\n      <\/aside>\n    <\/div>\n  <\/section>\n\n  <!-- ============ RELACIONADOS ============ -->\n  <section style=\"background:var(--papel);border-top:1px solid var(--linea);padding:72px 0\">\n    <div class=\"wrap\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid var(--linea);margin-bottom:34px\">\n        <h2 style=\"font-size:34px\">Otros productos para lavandería<\/h2>\n        <a href=\"#\" class=\"mono\" style=\"font-size:13px\">Ver el catálogo completo &#8594;<\/a>\n      <\/div>\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px\">\n        <a href=\"#\" class=\"card\">\n          <h3 style=\"font-size:18px;line-height:1.2\">Hidrosulfito de Sodio<\/h3>\n          <p class=\"mono\" style=\"font-size:12px\">Tonel &#183; 50 kg<\/p>\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.08em;margin-top:auto;padding-top:12px;border-top:1px solid var(--linea)\">CHINA, INDIA<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\">\n          <h3 style=\"font-size:18px;line-height:1.2\">Metabisulfito de Sodio<\/h3>\n          <p class=\"mono\" style=\"font-size:12px\">Saco &#183; 25 kg<\/p>\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.08em;margin-top:auto;padding-top:12px;border-top:1px solid var(--linea)\">CHINA, TURQUÍA<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\">\n          <h3 style=\"font-size:18px;line-height:1.2\">Soda Ash<\/h3>\n          <p class=\"mono\" style=\"font-size:12px\">Saco &#183; 25, 40 y 50 kg<\/p>\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.08em;margin-top:auto;padding-top:12px;border-top:1px solid var(--linea)\">CHINA<\/p>\n        <\/a>\n        <a href=\"#\" class=\"card\">\n          <h3 style=\"font-size:18px;line-height:1.2\">Soda Cáustica<\/h3>\n          <p class=\"mono\" style=\"font-size:12px\">Saco &#183; 25 kg<\/p>\n          <p class=\"mono\" style=\"font-size:11px;color:var(--gris);letter-spacing:.08em;margin-top:auto;padding-top:12px;border-top:1px solid var(--linea)\">CHINA, MÉXICO, POLONIA<\/p>\n        <\/a>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <footer class=\"pie\">\n    <div class=\"wrap\">\n      <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:48px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.12)\">\n        <div>\n          <p style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:21px;color:#fff\">INCOVSA<\/p>\n          <p class=\"mono\" style=\"font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px\">Químicos<\/p>\n          <p style=\"margin-top:20px;font-size:15px;max-width:290px\">Industria del Cuero Covadonga, S. A. Compra y venta de productos químicos en Guatemala.<\/p>\n        <\/div>\n        <div>\n          <h4>Navegación<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Inicio<\/a><a href=\"#\">Quiénes somos<\/a><a href=\"#\">Industrias<\/a><a href=\"#\">Productos<\/a><a href=\"#\">Contacto<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Sedes<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Quetzaltenango<\/a><a href=\"#\">Guatemala<\/a><a href=\"#\">Escuintla<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Contacto<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">facturacion@incovsa.com<\/a>\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">recepciongt@incovsa.com<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n      <p style=\"padding-top:26px;font-size:13px;color:#7E7A71\">Prototipo para validación &#183; Universidad Rafael Landívar &#183; Proyecto de Programación Web<\/p>\n    <\/div>\n  <\/footer>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#B45309\",\"#8A8474\"],\"section\":\"Marca\"}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { pres: 0, tab: 'uso' };\n  }\n  renderVals() {\n    const self = this;\n    const st = this.state;\n    const lista = [\n      { tipo: 'Garrafa', kg: '30 kg', nota: 'envase individual' },\n      { tipo: 'IBC', kg: '1,000 kg', nota: 'contenedor intermedio' },\n      { tipo: 'IBC', kg: '1,050 kg', nota: 'contenedor intermedio' }\n    ];\n    const tabs = [\n      { id: 'uso', nombre: 'Aplicación y uso' },\n      { id: 'manejo', nombre: 'Manejo y almacenamiento' },\n      { id: 'docs', nombre: 'Documentación técnica' }\n    ];\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      presentaciones: lista.map(function (p, i) {\n        return {\n          tipo: p.tipo, kg: p.kg, nota: p.nota,\n          clase: st.pres === i ? 'pr on' : 'pr',\n          elegir: function () { self.setState({ pres: i }); }\n        };\n      }),\n      sel: lista[st.pres] || lista[0],\n      pestanas: tabs.map(function (t) {\n        return {\n          nombre: t.nombre,\n          clase: st.tab === t.id ? 'tab on' : 'tab',\n          elegir: function () { self.setState({ tab: t.id }); }\n        };\n      }),\n      esUso: st.tab === 'uso',\n      esManejo: st.tab === 'manejo',\n      esDocs: st.tab === 'docs'\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Contacto.dc.html": {"titulo": "Contacto", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3,h4{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.04;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1200px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .eyebrow{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}\n    .nav{background:var(--verde900)}\n    .nav-in{display:flex;align-items:center;justify-content:space-between;height:88px;gap:48px}\n    .marca{display:flex;align-items:center;gap:13px}\n    .marca-n{font-family:Archivo,sans-serif;font-weight:800;font-size:23px;color:#fff;line-height:1}\n    .marca-s{font-family:\"IBM Plex Mono\",monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px}\n    .menu{display:flex;align-items:center;gap:34px;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .menu a{color:#D6D2C7}\n    .menu a:hover{color:var(--oro)}\n    .menu a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .acceso{border:1px solid rgba(232,206,114,.45);color:var(--oro) !important;padding:11px 19px;border-radius:2px;display:flex;align-items:center;gap:9px}\n    .acceso:hover{background:rgba(232,206,114,.12)}\n    .btn{display:inline-flex;align-items:center;justify-content:center;gap:11px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;padding:17px 30px;border-radius:2px;border:0;cursor:pointer}\n    .btn-p{background:var(--verde700);color:#fff}\n    .btn-p:hover{background:var(--verde900);color:#fff}\n    .card{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:32px;display:flex;flex-direction:column;gap:14px}\n    label{font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;display:block;margin-bottom:8px}\n    .campo{width:100%;font-family:\"Source Serif 4\",Georgia,serif;font-size:16px;padding:14px 16px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;color:var(--tinta)}\n    .campo:focus{outline:2px solid var(--verde500);outline-offset:-1px}\n    textarea.campo{min-height:132px;resize:vertical;font-family:\"Source Serif 4\",Georgia,serif}\n    .tipo{font-family:Archivo,sans-serif;font-size:14px;font-weight:600;padding:12px 20px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;cursor:pointer;color:var(--tinta);transition:.14s}\n    .tipo:hover{border-color:var(--verde500)}\n    .tipo.on{background:var(--verde700);border-color:var(--verde700);color:#fff}\n    .err{font-family:\"IBM Plex Mono\",monospace;font-size:12px;color:#A33A22;margin-top:7px;display:flex;align-items:center;gap:7px}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:26px 28px;border-radius:2px;display:flex;flex-direction:column;gap:10px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12;display:flex;align-items:center;gap:8px}\n    .pie{background:var(--verde900);color:#B6B2A7;padding:72px 0 40px;font-size:15px}\n    .pie h4{color:#fff;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-family:\"IBM Plex Mono\",monospace;font-weight:500;margin-bottom:20px}\n    .pie a{color:#B6B2A7}\n    .pie a:hover{color:var(--oro)}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.c je\n                <\/p>\n              <\/template>\n            <\/div>\n\n            <button class=\"btn btn-p\" style=\"align-self:flex-start\" onClick=\"{{enviar}}\">\n              Enviar mensaje\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"square\"><\/path><\/svg>\n            <\/button>\n          <\/div>\n        <\/template>\n      <\/div>\n\n      <aside style=\"display:flex;flex-direction:column;gap:24px;position:sticky;top:24px\">\n        <div class=\"card\">\n          <h3 style=\"font-size:21px\">Atención directa<\/h3>\n          <p style=\"font-size:16px;color:var(--gris)\">Si prefiere, comuníquese por WhatsApp o por teléfono con la sede que le queda más cerca.<\/p>\n          <div style=\"display:flex;flex-direction:column;gap:11px;padding-top:16px;border-top:1px solid var(--linea)\">\n            <a href=\"#\" class=\"mono\" style=\"font-size:14px;display:flex;align-items:center;gap:9px\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 13.5l.9-3A5.5 5.5 0 118 13.5a5.4 5.4 0 01-2.6-.7z\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"><\/path><\/svg>\n              WhatsApp Quetzaltenango\n            <\/a>\n            <a href=\"#\" class=\"mono\" style=\"font-size:14px;display:flex;align-items:center;gap:9px\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 13.5l.9-3A5.5 5.5 0 118 13.5a5.4 5.4 0 01-2.6-.7z\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"><\/path><\/svg>\n              WhatsApp Guatemala\n            <\/a>\n          <\/div>\n        <\/div>\n\n        <template data-sc-if=\"marcar\">\n          <div class=\"pend\">\n            <p class=\"pend-t\">Decisión pendiente<\/p>\n            <p style=\"font-size:15px;color:#6B5A21\">Definir a qué correo llegan las solicitudes del formulario y confirmar la cuenta SMTP corporativa que enviará los mensajes y la recuperación de contraseña.<\/p>\n          <\/div>\n        <\/template>\n\n        <div style=\"background:#E9EDE6;border-left:3px solid var(--verde700);padding:24px 26px;border-radius:2px\">\n          <p class=\"mono\" style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--verde700)\">Aviso<\/p>\n          <p style=\"font-size:15px;color:#3A3A34;margin-top:10px\">Los productos químicos que distribuye INCOVSA tienen restricciones de venta. Un asesor verificará el uso previsto antes de cotizar.<\/p>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/section>\n\n  <footer class=\"pie\">\n    <div class=\"wrap\">\n      <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:48px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.12)\">\n        <div>\n          <p style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:21px;color:#fff\">INCOVSA<\/p>\n          <p class=\"mono\" style=\"font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px\">Químicos<\/p>\n          <p style=\"margin-top:20px;font-size:15px;max-width:290px\">Industria del Cuero Covadonga, S. A. Compra y venta de productos químicos en Guatemala.<\/p>\n        <\/div>\n        <div>\n          <h4>Navegación<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Inicio<\/a><a href=\"#\">Quiénes somos<\/a><a href=\"#\">Industrias<\/a><a href=\"#\">Productos<\/a><a href=\"#\">Contacto<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Sedes<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\">Quetzaltenango<\/a><a href=\"#\">Guatemala<\/a><a href=\"#\">Escuintla<\/a>\n          <\/div>\n        <\/div>\n        <div>\n          <h4>Contacto<\/h4>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">facturacion@incovsa.com<\/a>\n            <a href=\"#\" class=\"mono\" style=\"font-size:13px\">recepciongt@incovsa.com<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n      <p style=\"padding-top:26px;font-size:13px;color:#7E7A71\">Prototipo para validación &#183; Universidad Rafael Landívar &#183; Proyecto de Programación Web<\/p>\n    <\/div>\n  <\/footer>\n<\/div>\n<\/x-dc><script data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#B45309\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      tipo: 'solicitud', nombre: '', correo: '', mensaje: '', sede: 'xela',\n      tocado: false, enviado: false\n    };\n  }\n  renderVals() {\n    const self = this;\n    const st = this.state;\n    const tipos = [\n      { id: 'solicitud', nombre: 'Solicitud' },\n      { id: 'queja', nombre: 'Queja' },\n      { id: 'reclamo', nombre: 'Reclamo' }\n    ];\n    const sedes = { xela: 'Quetzaltenango', guate: 'Guatemala', escuintla: 'Escuintla' };\n    const correoOk = /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(st.correo.trim());\n    const nombreOk = st.nombre.trim().length > 1;\n    const mensajeOk = st.mensaje.trim().length > 4;\n\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      formulario: !st.enviado,\n      enviado: st.enviado,\n      nombre: st.nombre,\n      correo: st.correo,\n      mensaje: st.mensaje,\n      sede: st.sede,\n      sedeTexto: sedes[st.sede],\n      tipoTexto: st.tipo,\n      folio: 'SOL-2026-0148',\n      errNombre: st.tocado && !nombreOk,\n      errCorreo: st.tocado && !correoOk,\n      errMensaje: st.tocado && !mensajeOk,\n      tipos: tipos.map(function (t) {\n        return {\n          nombre: t.nombre,\n          clase: st.tipo === t.id ? 'tipo on' : 'tipo',\n          elegir: function () { self.setState({ tipo: t.id }); }\n        };\n      }),\n      escribirNombre: function (e) { self.setState({ nombre: e.target.value }); },\n      escribirCorreo: function (e) { self.setState({ correo: e.target.value }); },\n      escribirMensaje: function (e) { self.setState({ mensaje: e.target.value }); },\n      escribirSede: function (e) { self.setState({ sede: e.target.value }); },\n      enviar: function () {\n        if (nombreOk && correoOk && mensajeOk) {\n          self.setState({ enviado: true, tocado: false });\n        } else {\n          self.setState({ tocado: true });\n        }\n      },\n      reiniciar: function () {\n        self.setState({ enviado: false, nombre: '', correo: '', mensaje: '', tocado: false });\n      }\n    };\n  }\n}\n<\/script><\/body><\/html>"}, "Noticias.dc.html": {"titulo": "Noticias", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.06;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1200px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .eyebrow{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}\n    .nav{background:var(--verde900)}\n    .nav-in{display:flex;align-items:center;justify-content:space-between;height:88px;gap:48px}\n    .marca-n{font-family:Archivo,sans-serif;font-weight:800;font-size:23px;color:#fff;line-height:1}\n    .marca-s{font-family:\"IBM Plex Mono\",monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px}\n    .menu{display:flex;align-items:center;gap:34px;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .menu a{color:#D6D2C7}\n    .menu a:hover{color:var(--oro)}\n    .menu a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .acceso{border:1px solid rgba(232,206,114,.45);color:var(--oro) !important;padding:11px 19px;border-radius:2px;display:flex;align-items:center;gap:9px}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:28px 30px;border-radius:2px;display:flex;flex-direction:column;gap:12px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12;display:flex;align-items:center;gap:8px}\n    .lin{height:11px;background:rgba(201,162,39,.22);border-radius:1px}\n    .foto{background:#E7E3D8;border:1.5px dashed #BDB7A8;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#8A8474;padding:20px}\n    .foto-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase}\n    .pie{background:var(--verde900);color:#B6B2A7;padding:64px 0 36px;font-size:15px}\n    .pie a{color:#B6B2A7}\n    .pie a:hover{color:var(--oro)}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = di ction procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> mue ductos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVals() : {};\n    const scope = Object.assign(Object.create(null), props, vals);\n    const copia = plantilla.cloneNode(true);\n    raiz.replaceChildren(...procesarLista(Array.from(copia.childNodes), scope));\n    restaurarFoco(raiz, foco);\n    if (enApp) { completarMenu(); montarCierreSesion(); }\n  }\n\n  function arrancar() {\n    raiz = document.querySelector('x-dc');\n    const sc = document.querySelector('script[data-dc-script]');\n    if (!raiz || !sc) return;\n\n    props = {};\n    try {\n      const def = JSON.parse(sc.dataset.props || '{}');\n      for (const [k, v] of Object.entries(def)) {\n        if (k === '$preview') continue;\n        props[k] = v && typeof v === 'object' ? v.default : v;\n      }\n    } catch (e) { console.warn('propiedades no legibles', e); }\n\n    try {\n      const Componente = new Function(sc.textContent + '\\nreturn Component;')();\n      comp = new Componente(props);\n    } catch (e) {\n      console.error('no se pudo evaluar el componente', e);\n      return;\n    }\n\n    if (enApp && typeof window.__dcAjuste === 'function') {\n      try { window.__dcAjuste(comp, irA); } catch (e) { console.warn('ajuste no aplicado', e); }\n    }\n\n    plantilla = raiz.cloneNode(true);\n    window.__dcDibujar = dibujar;\n    dibujar();\n    if (enApp) conectarEnlaces();\n    document.documentElement.setAttribute('data-dc-listo', '1');\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);\n  else arrancar();\n})();\n<\/script><\/head><body><x-dc>\n\n\n<div style=\"display:grid;grid-template-columns:1.05fr .95fr;min-height:900px\">\n\n  <!-- ============ PANEL INSTITUCIONAL ============ -->\n  <div style=\"background:var(--verde900);color:#EDEAE1;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between\">\n    <a href=\"Main.dc.html\" style=\"display:flex;align-items:center;gap:13px\">\n      <svg width=\"38\" height=\"38\" viewBox=\"0 0 38 38\" fill=\"none\" aria-hidden=\"true\">\n        <rect x=\"1.2\" y=\"1.2\" width=\"35.6\" height=\"35.6\" rx=\"2\" stroke=\"#E8CE72\" stroke-width=\"1.4\"><\/rect>\n        <path d=\"M10 27V11h5.4v16z\" fill=\"#E8CE72\"><\/path>\n        <path d=\"M18.6 27V16H24v11z\" fill=\"#FFFFFF\" fill-opacity=\".9\"><\/path>\n        <path d=\"M27 27v-6h1.6v6z\" fill=\"#2F8B4C\"><\/path>\n      <\/svg>\n      <span style=\"display:flex;flex-direction:column\">\n        <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:23px;color:#fff;line-height:1\">INCOVSA<\/span>\n        <span class=\"mono\" style=\"font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--oro);margin-top:5px\">Químicos<\/span>\n      <\/span>\n    <\/a>\n\n    <div>\n      <p class=\"mono\" style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color: {{acento}}\">Acceso para personal<\/p>\n      <h1 style=\"font-size:42px;margin-top:18px;color:#fff;max-width:440px;text-wrap:pretty\">Tres accesos, tres inicios de sesión<\/h1>\n      <p style=\"font-size:17px;color:#B9C3B3;margin-top:18px;max-width:440px\">Cada sistema tiene su propio inicio de sesión. Elija a la derecha a dónde desea entrar. Lo que ve y hace cada persona depende de su rol, y la sede viene de su propia cuenta.<\/p>\n\n      <div style=\"margin-top:30px;max-width:440px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-left:3px solid var(--verde500);padding:20px 22px;border-radius:2px\">\n        <p style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:16px;color:#fff\">Gerencia usa la misma cuenta en los dos sistemas<\/p>\n        <p style=\"font-size:15px;color:#B9C3B3;margin-top:9px\">Es la única cuenta que sirve en la administración del sitio y en el sistema de picking. Las demás personas tienen una cuenta para cada sistema, con un solo rol en cada uno.<\/p>\n      <\/div>\n    <\/div>\n\n    <p class=\"mono\" style=\"font-size:11px;color:#7E8F7A;letter-spacing:.06em\">PROTOTIPO PARA VALIDACIÓN &#183; UNIVERSIDAD RAFAEL LANDÍVAR<\/p>\n  <\/div>\n\n  <!-- ============ PANEL DE ACCESO ============ -->\n  <div style=\"display:flex;align-items:center;justify-content:center;padding:56px 64px\">\n    <div style=\"width:100%;max-width:440px\">\n\n      <!-- ---- menú de los tres accesos ---- -->\n      <template data-sc-if=\"esMenu\">\n        <div>\n          <h2 style=\"font-size:32px\">¿A dónde desea ingresar?<\/h2>\n          <p style=\"font-size:16px;color:var(--gris);margin-top:12px\">Seleccione el sistema. Cada uno pide sus propias credenciales.<\/p>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:30px\">\n            <button class=\"opcion\" onClick=\"{{irOdoo}}\">\n              <span class=\"n\">01<\/span>\n              <span>\n                <span class=\"t\">Odoo<\/span>\n                <span class=\"d\">El ERP con el que la empresa ya trabaja. Lo lleva al inicio de sesión de Odoo, fuera de este sitio.<\/span>\n              <\/span>\n            <\/button>\n\n            <button class=\"opcion\" onClick=\"{{irSitio}}\">\n              <span class=\"n\">02<\/span>\n              <span>\n                <span class=\"t\">Administración del sitio<\/span>\n                <span class=\"d\">Contenido publicado y documentación interna de productos.<\/span>\n              <\/span>\n            <\/button>\n\n            <button class=\"opcion\" onClick=\"{{irPicking}}\">\n              <span class=\"n\">03<\/span>\n              <span>\n                <span class=\"t\">Sistema de picking<\/span>\n                <span class=\"d\">Control logístico de bodega: facturación, bodega, ruta, inventario, reportes y configuración.<\/span>\n              <\/span>\n            <\/button>\n          <\/div>\n\n          <div style=\"margin-top:34px;padding-top:26px;border-top:1px solid var(--linea)\">\n            <a href=\"Main.dc.html\" class=\"mono\" style=\"font-size:13px;display:inline-flex;align-items:center;gap:8px\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M13 8H3M6.5 4.5L3 8l3.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"square\"><\/path><\/svg>\n              VOLVER AL SITIO\n            <\/a>\n          <\/div>\n        <\/div>\n      <\/template>\n\n      <!-- ---- salida hacia Odoo ---- -->\n      <template data-sc-if=\"esOdoo\">\n        <div>\n          <button class=\"volver\" onClick=\"{{alMenu}}\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M13 8H3M6.5 4.5L3 8l3.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"square\"><\/path><\/svg>\n            ELEGIR OTRO ACCESO\n          <\/button>\n\n          <h2 style=\"font-size:32px;margin-top:22px\">Odoo<\/h2>\n          <p style=\"font-size:16px;color:var(--gris);margin-top:12px\">Este acceso sale del sitio de INCOVSA y abre el inicio de sesión del ERP. El sistema no intercambia datos con Odoo: es solo un enlace.<\/p>\n\n          <template data-sc-if=\"marcar\">\n            <div class=\"pend\" style=\"margin-top:26px\">\n              <p class=\"pend-t\">Pendiente de INCOVSA<\/p>\n              <p style=\"font-size:15px;color:#54451A\">Falta la dirección exacta del inicio de sesión de Odoo para conectar este botón.<\/p>\n            <\/div>\n          <\/template>\n\n          <a href=\"#\" class=\"btn btn-p\" style=\"margin-top:26px\">\n            Ir a Odoo\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 3h7v7M13 3L4 12\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"square\"><\/path><\/svg>\n          <\/a>\n        <\/div>\n      <\/template>\n\n      <!-- ---- inicio de sesión del sistema elegido ---- -->\n      <template data-sc-if=\"esLogin\">\n        <div>\n          <button class=\"volver\" onClick=\"{{alMenu}}\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M13 8H3M6.5 4.5L3 8l3.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"square\"><\/path><\/svg>\n            ELEGIR OTRO ACCESO\n          <\/button>\n\n          <h2 style=\"font-size:32px;margin-top:22px\">{{titulo}}<\/h2>\n          <p style=\"font-size:16px;color:var(--gris);margin-top:12px\">Use el usuario que le asignó el administrador del sistema.<\/p>\n\n          <template data-sc-if=\"error\">\n            <div class=\"alerta\" style=\"margin-top:24px\">\n              <svg width=\"18\" height=\"18\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink:0;margin-top:2px\"><circle cx=\"8\" cy=\"8\" r=\"6.5\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle><path d=\"M8 5v3.5M8 10.5v.5\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path><\/svg>\n              <span>Usuario o contraseña incorrectos.<\/span>\n            <\/div>\n          <\/template>\n\n          <div style=\"margin-top:26px;display:flex;flex-direction:column;gap:20px\">\n            <div>\n              <label for=\"l-user\">Usuario<\/label>\n              <input id=\"l-user\" class=\"campo\" type=\"text\" placeholder=\"nombre.apellido\" value=\"{{usuario}}\" onChange=\"{{escribirUsuario}}\">\n            <\/div>\n\n            <div>\n              <label for=\"l-pass\">Contraseña<\/label>\n              <div style=\"position:relative\">\n                <input id=\"l-pass\" class=\"campo\" type=\"{{tipoPass}}\" placeholder=\"Su contraseña\" style=\"padding-right:48px\" value=\"{{clave}}\" onChange=\"{{escribirClave}}\">\n                <button class=\"ojo\" onClick=\"{{alternarOjo}}\" aria-label=\"Mostrar u ocultar la contraseña\">\n                  <svg width=\"19\" height=\"19\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M1.8 10S4.9 4.8 10 4.8 18.2 10 18.2 10 15.1 15.2 10 15.2 1.8 10 1.8 10z\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/path><circle cx=\"10\" cy=\"10\" r=\"2.6\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/circle><\/svg>\n                <\/button>\n              <\/div>\n            <\/div>\n\n            <p style=\"font-size:15px;color:var(--gris);line-height:1.5\"><strong style=\"color:var(--tinta)\">¿Olvidó su contraseña?<\/strong> {{ayudaClave}}<\/p>\n\n            <button class=\"btn btn-p\" onClick=\"{{entrar}}\">\n              Ingresar\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"square\"><\/path><\/svg>\n            <\/button>\n          <\/div>\n\n          <div style=\"margin-top:30px;padding-top:24px;border-top:1px solid var(--linea)\">\n            <p class=\"mono\" style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);margin-bottom:12px\">Roles de este sistema<\/p>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <template data-sc-for=\"roles\" data-as=\"r\">\n                <div class=\"rol\">\n                  <span class=\"p\"><\/span>\n                  <span style=\"font-size:15px;color:var(--gris)\"><strong style=\"color:var(--tinta)\">{{r.nombre}}<\/strong> &#183; {{r.detalle}}<\/span>\n                <\/div>\n              <\/template>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/template>\n\n    <\/div>\n  <\/div>\n<\/div>\n<\/x-dc><script type=\"text/x-dc\" data-dc-script data-props='{\"acento\":{\"editor\":\"color\",\"default\":\"#C9A227\",\"options\":[\"#C9A227\",\"#2F8B4C\",\"#E8CE72\",\"#8A8474\"],\"section\":\"Marca\"},\"marcarPendientes\":{\"editor\":\"boolean\",\"default\":true,\"section\":\"Revisión\"},\"$preview\":{\"width\":1440,\"height\":1200}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { destino: null, usuario: '', clave: '', ver: false, error: false };\n  }\n  ir(d) {\n    this.setState({ destino: d, usuario: '', clave: '', ver: false, error: false });\n  }\n  renderVals() {\n    var self = this;\n    var st = this.state;\n    var d = st.destino;\n    var rolesSitio = [\n      { nombre: 'Gerencia', detalle: 'todos los accesos' },\n      { nombre: 'Administrativo', detalle: 'sube y cambia documentos, administra el contenido' },\n      { nombre: 'Operativo', detalle: 'jefe de bodega y jefes de área, visualiza y descarga' },\n      { nombre: 'Vista general', detalle: 'ventas y facturación, visualiza los PDF' }\n    ];\n    var rolesPicking = [\n      { nombre: 'Gerencia', detalle: 'acceso a todo, en las tres sedes' },\n      { nombre: 'Soporte IT', detalle: 'configuración, inventario y todos los módulos, en las tres sedes' },\n      { nombre: 'Facturador', detalle: 'registra los pedidos de su sede' },\n      { nombre: 'Bodega', detalle: 'prepara y cierra los pedidos de su sede' },\n      { nombre: 'Piloto', detalle: 'ejecuta las rutas que tiene asignadas' }\n    ];\n    return {\n      acento: this.props.acento ?? '#C9A227',\n      marcar: this.props.marcarPendientes ?? true,\n      esMenu: d === null,\n      esOdoo: d === 'odoo',\n      esLogin: d === 'sitio' || d === 'picking',\n      titulo: d === 'picking' ? 'Sistema de picking' : 'Administración del sitio',\n      roles: d === 'picking' ? rolesPicking : rolesSitio,\n      ayudaClave: d === 'picking' ? 'Pídale a Soporte IT que la restablezca.' : 'Si tiene un correo registrado, puede restablecerla por correo; si no, la restablece Gerencia.',\n      usuario: st.usuario,\n      clave: st.clave,\n      tipoPass: st.ver ? 'text' : 'password',\n      error: st.error,\n      irOdoo: function () { self.ir('odoo'); },\n      irSitio: function () { self.ir('sitio'); },\n      irPicking: function () { self.ir('picking'); },\n      alMenu: function () { self.ir(null); },\n      escribirUsuario: function (e) { self.setState({ usuario: e.target.value, error: false }); },\n      escribirClave: function (e) { self.setState({ clave: e.target.value, error: false }); },\n      alternarOjo: function () { self.setState({ ver: !st.ver }); },\n      entrar: function () { self.setState({ error: true }); }\n    };\n  }\n}\n<\/script><script>\n    window.__dcAjuste = function (comp, irA) {\n      // Odoo todavía no tiene enlace: esa opción no hace nada\n      var ir = comp.ir.bind(comp);\n      comp.ir = function (destino) { if (destino !== 'odoo') ir(destino); };\n\n      // Ingresar entra al sistema que se eligió. El picking abre en Inventario,\n      // la vista de Soporte IT, que tiene los seis módulos en su menú\n      var original = comp.renderVals.bind(comp);\n      comp.renderVals = function () {\n        var vals = original();\n        var destino = comp.state.destino;\n        vals.entrar = function () {\n          irA(destino === 'picking' ? 'Inventario.dc.html' : 'PanelAdmin.dc.html');\n        };\n        return vals;\n      };\n    };\n    <\/script><\/body><\/html>"}, "Documentacion.dc.html": {"titulo": "Documentación interna", "html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap\">\n  <style>\n    :root{--verde900:#0B3A1B;--verde700:#14612D;--verde500:#2F8B4C;--dorado:#C9A227;--oro:#E8CE72;--hueso:#F6F4EF;--papel:#FFFFFF;--tinta:#1A1A17;--gris:#6E6E64;--linea:#DFDACE}\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--hueso);color:var(--tinta);font:400 17px/1.62 \"Source Serif 4\",Georgia,serif;-webkit-font-smoothing:antialiased}\n    h1,h2,h3{margin:0;font-family:Archivo,\"Helvetica Neue\",sans-serif;letter-spacing:-.025em;line-height:1.06;font-weight:800}\n    p{margin:0}\n    a{color:var(--verde700);text-decoration:none}\n    a:hover{color:var(--dorado)}\n    .wrap{max-width:1200px;margin:0 auto;padding:0 60px}\n    .mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace}\n    .barra{background:var(--verde900);height:72px;display:flex;align-items:center}\n    .barra-in{display:flex;align-items:center;justify-content:space-between;width:100%;gap:40px}\n    .barra a{color:#D6D2C7;font-family:Archivo,sans-serif;font-size:14px;font-weight:600}\n    .barra a:hover{color:var(--oro)}\n    .barra a.act{color:#fff;box-shadow:inset 0 -2px 0 var(--oro);padding-bottom:5px}\n    .avatar{width:36px;height:36px;border-radius:50%;background:var(--verde500);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:700;font-size:14px}\n    .chip{font-family:Archivo,sans-serif;font-size:13px;font-weight:600;padding:9px 16px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;cursor:pointer;color:var(--tinta);transition:.14s}\n    .chip:hover{border-color:var(--verde500)}\n    .chip.on{background:var(--verde700);border-color:var(--verde700);color:#fff}\n    .busca{width:100%;font-family:Archivo,sans-serif;font-size:15px;padding:13px 16px 13px 44px;border:1px solid var(--linea);background:var(--papel);border-radius:2px;color:var(--tinta)}\n    .busca:focus{outline:2px solid var(--verde500);outline-offset:-1px}\n    table{width:100%;border-collapse:collapse;background:var(--papel);border:1px solid var(--linea)}\n    th{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);text-align:left;padding:16px 20px;border-bottom:1px solid var(--linea);font-weight:500}\n    td{padding:18px 20px;border-bottom:1px solid var(--linea);vertical-align:middle}\n    tr:last-child td{border-bottom:0}\n    tr:hover td{background:rgba(47,139,76,.04)}\n    .estado{display:inline-flex;align-items:center;gap:8px;font-family:\"IBM Plex Mono\",monospace;font-size:11px;letter-spacing:.08em;padding:6px 10px;border-radius:2px}\n    .e-pend{background:rgba(201,162,39,.16);color:#7A6014}\n    .e-restr{background:#EDEAE2;color:var(--gris)}\n    .e-ok{background:rgba(47,139,76,.14);color:#14612D}\n    .pend{border:1.5px dashed var(--dorado);background:repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 9px,transparent 9px 18px);padding:26px 28px;border-radius:2px;display:flex;flex-direction:column;gap:10px}\n    .pend-t{font-family:\"IBM Plex Mono\",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6D12;display:flex;align-items:center;gap:8px}\n  <\/style>\n<script>/* Runtime de los prototipos .dc.html del proyecto INCOVSA.\n   Sustituye al support.js original, que no vino con los archivos.\n\n   Siempre: resuelve las propiedades, los condicionales, los ciclos y las\n   expresiones {{...}}, enlaza los manejadores de eventos y vuelve a dibujar\n   la pantalla cuando el componente cambia su estado.\n\n   Solo cuando la pantalla corre dentro del prototipo navegable (es decir,\n   dentro de un marco): además conecta los enlaces con las demás pantallas,\n   agrega Noticias al menú del sitio y el cierre de sesión en las pantallas\n   internas. Abriendo el .dc.html por su cuenta, nada de eso se activa y la\n   pantalla se ve tal como fue diseñada. */\n(function () {\n  const enApp = window.parent !== window;\n\n  class DCLogic {\n    constructor(props) { this.props = props || {}; this.state = {}; }\n    setState(s) {\n      Object.assign(this.state, s);\n      if (typeof window.__dcDibujar === 'function') window.__dcDibujar();\n    }\n  }\n  window.DCLogic = DCLogic;\n\n  // ---------------------------------------------------------------- plantillas\n  function resolver(expr, scope) {\n    const t = String(expr).trim();\n    if (t === 'true') return true;\n    if (t === 'false') return false;\n    if (t === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(t)) return Number(t);\n    if (/^'[^']*'$/.test(t) || /^\"[^\"]*\"$/.test(t)) return t.slice(1, -1);\n    let cur = scope;\n    for (const parte of t.split('.')) {\n      if (cur === null || cur === undefined) return undefined;\n      cur = cur[parte];\n    }\n    return cur;\n  }\n\n  function aTexto(v) {\n    if (v === undefined || v === null || typeof v === 'function') return '';\n    if (typeof v === 'boolean') return v ? 'true' : '';\n    return String(v);\n  }\n\n  const interpolar = (texto, scope) =>\n    texto.replace(/\\{\\{([^}]*)\\}\\}/g, (_, e) => aTexto(resolver(e, scope)));\n\n  function procesarLista(nodos, scope) {\n    const salida = [];\n    for (const n of nodos) salida.push(...procesar(n, scope));\n    return salida;\n  }\n\n  function procesar(n, scope) {\n    if (n.nodeType === Node.TEXT_NODE) {\n      if (n.nodeValue.includes('{{')) n.nodeValue = interpolar(n.nodeValue, scope);\n      return [n];\n    }\n    if (n.nodeType !== Node.ELEMENT_NODE) return [n];\n\n    const tag = n.tagName.toLowerCase();\n\n    if (tag === 'template' && n.hasAttribute('data-sc-if')) {\n      if (!resolver(n.getAttribute('data-sc-if'), scope)) return [];\n      return procesarLista(Array.from(document.importNode(n.content, true).childNodes), scope);\n    }\n\n    if (tag === 'template' && n.hasAttribute('data-sc-for')) {\n      const lista = resolver(n.getAttribute('data-sc-for'), scope);\n      const alias = n.getAttribute('data-as') || 'item';\n      if (!Array.isArray(lista)) return [];\n      const salida = [];\n      lista.forEach((item, idx) => {\n        const s2 = Object.create(scope);\n        s2[alias] = item;\n        s2[alias + 'Index'] = idx;\n        salida.push(...procesarLista(Array.from(document.importNode(n.content, true).childNodes), s2));\n      });\n      return salida;\n    }\n\n    for (const at of Array.from(n.attributes)) {\n      if (!at.value.includes('{{')) continue;\n      const solo = at.value.trim().match(/^\\{\\{([^}]*)\\}\\}$/);\n      if (!solo) { n.setAttribute(at.name, interpolar(at.value, scope)); continue; }\n      const v = resolver(solo[1], scope);\n      if (typeof v === 'function') {\n        n.removeAttribute(at.name);\n        if (/^on/i.test(at.name)) n.addEventListener(at.name.slice(2).toLowerCase(), v);\n        continue;\n      }\n      if (v === undefined || v === null) { n.removeAttribute(at.name); continue; }\n      if (typeof v === 'boolean') { v ? n.setAttribute(at.name, '') : n.removeAttribute(at.name); continue; }\n      n.setAttribute(at.name, String(v));\n      if (at.name === 'value' && (tag === 'input' || tag === 'textarea')) n.value = String(v);\n    }\n\n    n.replaceChildren(...procesarLista(Array.from(n.childNodes), scope));\n    // un <select> muestra la opción de su value=\"{{...}}\"; si no lo tiene, la\n    // marcada con selected o la primera, como en la aplicación real\n    if (tag === 'select') {\n      if (n.hasAttribute('value')) n.value = n.getAttribute('value');\n      else {\n        const i = Array.from(n.options).findIndex(o => o.hasAttribute('selected'));\n        n.selectedIndex = i >= 0 ? i : 0;\n      }\n    }\n    return [n];\n  }\n\n  // ------------------------------------------------------------------ el foco\n  function rutaDelFoco(raiz) {\n    const el = document.activeElement;\n    if (!el || el === document.body || !raiz.contains(el)) return null;\n    const ruta = [];\n    let cur = el;\n    while (cur && cur !== raiz) {\n      ruta.unshift(Array.prototype.indexOf.call(cur.parentNode.childNodes, cur));\n      cur = cur.parentNode;\n    }\n    const datos = { ruta };\n    if ('selectionStart' in el) {\n      try { datos.ini = el.selectionStart; datos.fin = el.selectionEnd; } catch (e) {}\n    }\n    return datos;\n  }\n\n  function restaurarFoco(raiz, datos) {\n    if (!datos) return;\n    let cur = raiz;\n    for (const i of datos.ruta) {\n      if (!cur || !cur.childNodes[i]) return;\n      cur = cur.childNodes[i];\n    }\n    if (cur && cur.focus) {\n      cur.focus();\n      if (datos.ini !== undefined && 'setSelectionRange' in cur) {\n        try { cur.setSelectionRange(datos.ini, datos.fin); } catch (e) {}\n      }\n    }\n  }\n\n  // ------------------------------------------------- navegación entre pantallas\n  const DESTINOS = {\n    'inicio': 'Main.dc.html',\n    'incovsa quimicos': 'Main.dc.html',\n    'volver al sitio': 'Main.dc.html',\n    'quienes somos': 'QuienesSomos.dc.html',\n    'industrias': 'Industrias.dc.html',\n    'ver las nueve': 'Industrias.dc.html',\n    'ver las nueve industrias': 'Industrias.dc.html',\n    'cuero': 'Industrias.dc.html',\n    'textil': 'Industrias.dc.html',\n    'cereria': 'Industrias.dc.html',\n    'hulera': 'Industrias.dc.html',\n    'productos': 'Catalogo.dc.html',\n    'ver catalogo': 'Catalogo.dc.html',\n    'ver catalogo de productos': 'Catalogo.dc.html',\n    'ver catalogo completo': 'Catalogo.dc.html',\n    'ver productos relacionados': 'Catalogo.dc.html',\n    'noticias': 'Noticias.dc.html',\n    'contacto': 'Contacto.dc.html',\n    'hablar con un asesor': 'Contacto.dc.html',\n    'contactar a un asesor': 'Contacto.dc.html',\n    'solicitar informacion': 'Contacto.dc.html',\n    'enviar una solicitud': 'Contacto.dc.html',\n    'quetzaltenango': 'Contacto.dc.html',\n    'guatemala': 'Contacto.dc.html',\n    'escuintla': 'Contacto.dc.html',\n    'acceso personal': 'Ingreso.dc.html',\n    'incovsa administracion del sitio': 'PanelAdmin.dc.html',\n    'panel del sitio': 'PanelAdmin.dc.html',\n    'documentacion': 'Documentacion.dc.html',\n    'incovsa control logistico de bodega': 'Facturacion.dc.html',\n    'facturacion': 'Facturacion.dc.html',\n    'bodega': 'Bodega.dc.html',\n    'ruta': 'Ruta.dc.html',\n    'inventario': 'Inventario.dc.html',\n    'reportes': 'Reportes.dc.html',\n    'configuracion': 'Configuracion.dc.html'\n  };\n\n  const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toLowerCase().replace(/\\s+/g, ' ').trim();\n\n  const irA = (archivo) => parent.postMessage({ dc: 'ir', archivo: archivo }, '*');\n\n  function conectarEnlaces() {\n    document.addEventListener('click', function (e) {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n\n      if (/\\.dc\\.html$/i.test(href)) {\n        e.preventDefault();\n        irA(href.split('/').pop());\n        return;\n      }\n      if (href !== '#' && href !== '') return;\n      e.preventDefault();\n\n      if (a.classList.contains('card')) {      // tarjeta del catálogo\n        irA('Producto.dc.html');\n        return;\n      }\n      const texto = normalizar(a.textContent || '');\n      if (texto.length <= 40 && DESTINOS[texto]) irA(DESTINOS[texto]);\n    }, true);\n  }\n\n  // Noticias forma parte del sitio, pero solo su propia pantalla la trae en el menú\n  function completarMenu() {\n    const menu = document.querySelector('nav.menu');\n    if (!menu) return;\n    const enlaces = Array.from(menu.querySelectorAll('a'));\n    if (enlaces.some(a => normalizar(a.textContent) === 'noticias')) return;\n    const contacto = enlaces.find(a => normalizar(a.textContent) === 'contacto');\n    if (!contacto) return;\n    const nuevo = document.createElement('a');\n    nuevo.href = '#';\n    nuevo.textContent = 'Noticias';\n    menu.insertBefore(nuevo, contacto);\n  }\n\n  // Las pantallas internas no traen forma de salir: se agrega en el bloque del usuario\n  function montarCierreSesion() {\n    const avatar = document.querySelector('.avatar');\n    if (!avatar || !avatar.parentElement) return;\n    const bloque = avatar.parentElement;\n    if (bloque.dataset.dcSalida) return;\n    bloque.dataset.dcSalida = '1';\n    bloque.style.position = 'relative';\n    bloque.style.cursor = 'pointer';\n    bloque.setAttribute('title', 'Cerrar sesión');\n\n    const menu = document.createElement('div');\n    menu.style.cssText = 'position:absolute;top:calc(100% + 10px);right:0;display:none;' +\n      'background:#fff;border:1px solid #DFDACE;border-radius:8px;padding:6px;' +\n      'box-shadow:0 14px 30px -18px rgba(0,0,0,.5);z-index:50;min-width:170px';\n    const salir = document.createElement('button');\n    salir.textContent = 'Cerrar sesión';\n    salir.style.cssText = 'width:100%;text-align:left;background:none;border:0;cursor:pointer;' +\n      'font:500 14px/1 Archivo,Helvetica,sans-serif;color:#1A1A17;padding:9px 10px;border-radius:6px';\n    salir.addEventListener('mouseenter', () => { salir.style.background = '#F6F4EF'; });\n    salir.addEventListener('mouseleave', () => { salir.style.background = 'none'; });\n    salir.addEventListener('click', (e) => { e.stopPropagation(); irA('Ingreso.dc.html'); });\n    menu.appendChild(salir);\n    bloque.appendChild(menu);\n\n    bloque.addEventListener('click', (e) => {\n      e.stopPropagation();\n      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';\n    });\n    document.addEventListener('click', () => { menu.style.display = 'none'; });\n  }\n\n  // ------------------------------------------------------------------ arranque\n  let raiz, plantilla, comp, props;\n\n  function dibujar() {\n    const foco = rutaDelFoco(raiz);\n    const vals = typeof comp.renderVals === 'function' ? comp.renderVal
