# Actualizaciones automáticas de dependencias (JG-08). Las propuestas llegan como PR a develop, una vez por semana.
# Esos PR los revisa y los integra el coordinador: tocan archivos protegidos (package.json, package-lock.json y
# .github/), y toda dependencia nueva o actualizada es una decisión suya (specs/16, decisión 66).
# Esos PR fallan siempre en `titulo` (sin [ID]), `archivos-protegidos` (el autor es dependabot[bot]) y
# `revision-claude` (los flujos de Dependabot no reciben CLAUDE_CODE_OAUTH_TOKEN): el coordinador los revisa y los
# integra con `gh pr merge <n> --admin --squash`.
# (24/10) Las versiones menores y los parches llegan juntos en un solo PR por ecosistema; cada versión mayor, en su
# propio PR. Se ignoran las mayores de `typescript` (TypeScript 7 quitó la API de JavaScript que usa
# scripts/integridad-pruebas.mjs) y de `@types/node` (specs/16 fija Node.js 24, y sus tipos deben ser los de la 24).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      timezone: "America/Guatemala"
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      timezone: "America/Guatemala"
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]
