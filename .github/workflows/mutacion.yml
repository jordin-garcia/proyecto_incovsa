name: Mutación

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *" # 02:00 de Guatemala. GitHub programa sobre la rama predeterminada develop.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutacion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutacion:
    name: mutacion
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: incovsa
          POSTGRES_PASSWORD: incovsa
          POSTGRES_DB: incovsa_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incovsa -d incovsa_pruebas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://incovsa:incovsa@localhost:5432/incovsa_pruebas
      DATABASE_URL_PRUEBAS: postgresql://incovsa:incovsa@localhost:5432/incovsa_pruebas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:aplicar
      - name: Mutar archivos cambiados del PR o todos cada noche
        env:
          BASE_MUTACION: ${{ github.event.pull_request.base.sha }}
        run: npm run test:mutacion
      - name: Conservar informe de mutación
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-mutacion
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14
