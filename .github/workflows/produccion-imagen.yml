# CE-05. Construye la imagen y la levanta con Caddy y el Caddyfile de producción.
# No despliega. Solo corre cuando el PR toca estos archivos.

name: Imagen de producción

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - Caddyfile
      - .env.produccion.example
      - .github/workflows/produccion-imagen.yml
      - package.json
      - package-lock.json
      - prisma/**
      # Cabeceras de seguridad (JG-11), tiempo real (JG-10) y crear-admin: este flujo los comprueba a través de Caddy.
      - next.config.ts
      - src/lib/cabeceras.ts
      - src/proxy.ts
      - src/app/api/tiempo-real/**
      - src/modulos/tiempo-real/**
      - scripts/administrador.ts
      - scripts/crear-admin.ts

permissions:
  contents: read

jobs:
  imagen:
    name: produccion-imagen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir la imagen
        run: docker build -t incovsa-app:ci .

      - name: Confirmar que la imagen no lleva secretos
        run: docker run --rm --entrypoint sh incovsa-app:ci -c 'test ! -e .env && test ! -e .env.produccion.example'

      - name: El código de la imagen es de solo lectura para el proceso
        # H-51: el proceso corre como nextjs y no puede reescribir su propio código. Solo escribe en la caché de
        # Next.js, en su carpeta personal y en /tmp.
        run: |
          docker run --rm --entrypoint sh incovsa-app:ci -c '
            set -eu
            test "$(id -un)" = nextjs
            for ruta in /app /app/server.js /app/entrada.sh /app/package.json /app/node_modules /app/node_modules/next/package.json /app/src /app/scripts /app/prisma /app/.next/static; do
              if [ -w "$ruta" ]; then echo "El proceso puede escribir en $ruta"; exit 1; fi
            done
            if touch /app/server.js 2>/dev/null || mkdir /app/nueva 2>/dev/null; then echo "El proceso modificó /app"; exit 1; fi
            ajeno="$(find /app -user nextjs -not -path "/app/.next/cache*" -print -quit)"
            if [ -n "$ajeno" ]; then echo "Archivo de nextjs fuera de la caché: $ajeno"; exit 1; fi
            test -w /app/.next/cache
            test -w "$HOME"
          '

      - name: Validar el Caddyfile de producción
        run: |
          grep -q 'header_up X-Real-IP {remote_host}' Caddyfile
          grep -q 'flush_interval -1' Caddyfile
          grep -q 'max_size 27MB' Caddyfile
          docker run --rm \
            -e DOMINIO=localhost \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile

      - name: Preparar las variables de prueba
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=incovsa
          POSTGRES_PASSWORD=incovsa_ci_local
          POSTGRES_DB=incovsa
          DATABASE_URL=postgresql://incovsa:incovsa_ci_local@postgres:5432/incovsa
          BETTER_AUTH_SECRET_SITIO=ci-sitio-clave-de-prueba-32-caracteres
          BETTER_AUTH_SECRET_PICKING=ci-picking-clave-de-prueba-32-caracteres
          BETTER_AUTH_URL=https://localhost
          SESION_DIAS=7
          ALMACENAMIENTO=disco
          DOMINIO=localhost
          EOF

      - name: Levantar Compose con el Caddyfile real
        run: IMAGEN_APP=incovsa-app:ci docker compose up -d

      - name: La aplicación responde por HTTPS a través de Caddy
        run: |
          listo=0
          for _ in $(seq 1 36); do
            if curl -kfsS --resolve localhost:443:127.0.0.1 https://localhost/ -o /dev/null; then listo=1; break; fi
            sleep 5
          done
          test "$listo" = 1
          docker compose exec -T caddy grep -q 'header_up X-Real-IP {remote_host}' /etc/caddy/Caddyfile
          docker compose exec -T caddy grep -q 'flush_interval -1' /etc/caddy/Caddyfile
          docker compose exec -T caddy grep -q 'max_size 27MB' /etc/caddy/Caddyfile

      - name: "RNF-16: las cabeceras de seguridad llegan a través de Caddy, con una sola HSTS"
        # H-46 y H-48: las mismas rutas que la prueba de JG-11 (páginas, error, redirección, API y recursos).
        run: |
          set -euo pipefail
          for ruta in / /acceso /panel /no-existe-jg25 /api/tiempo-real /marca/incovsa-oscuro.svg; do
            curl -ksS -o /dev/null -D /tmp/cabeceras-crudas.txt --resolve localhost:443:127.0.0.1 "https://localhost${ruta}"
            tr -d '\r' </tmp/cabeceras-crudas.txt | tr '[:upper:]' '[:lower:]' >/tmp/cabeceras.txt
            contar() { grep -c "$1" /tmp/cabeceras.txt || true; }
            fallo() { echo "RNF-16 en ${ruta}: $1"; cat /tmp/cabeceras.txt; exit 1; }
            if [ "$(contar '^strict-transport-security:')" -ne 1 ]; then fallo "debe haber exactamente una HSTS"; fi
            grep -q '^strict-transport-security: max-age=31536000; includesubdomains$' /tmp/cabeceras.txt || fallo "HSTS"
            if [ "$(contar '^content-security-policy:')" -ne 1 ]; then fallo "debe haber exactamente una CSP"; fi
            grep -q "^content-security-policy: .*default-src 'self'" /tmp/cabeceras.txt || fallo "CSP sin default-src"
            grep -q "^content-security-policy: .*frame-ancestors 'none'" /tmp/cabeceras.txt || fallo "CSP sin frame-ancestors"
            if grep -q "^content-security-policy: .*'unsafe-eval'" /tmp/cabeceras.txt; then fallo "CSP con unsafe-eval"; fi
            grep -q '^x-content-type-options: nosniff$' /tmp/cabeceras.txt || fallo "sin nosniff"
            grep -q '^referrer-policy: strict-origin-when-cross-origin$' /tmp/cabeceras.txt || fallo "sin Referrer-Policy"
            echo "RNF-16 en ${ruta}: cabeceras completas."
          done

      - name: Un cuerpo de galería no recibe 413 de Caddy
        run: |
          # 7 MB supera el antiguo tope de 6 MB y cabe en el de 27 MB (galería de 5×5 MB).
          # Sin sesión la ruta responde 403 sin leer el cuerpo; por eso no se exige 413 en un exceso:
          # Caddy solo aplica max_size al leer, y reverse_proxy puede devolver el 403 antes.
          python3 - <<'PY'
          import subprocess, sys
          cuerpo = b"0" * (7 * 1000 * 1000)
          r = subprocess.run(
              [
                  "curl", "-ksS", "-o", "/dev/null", "-w", "%{http_code}",
                  "--resolve", "localhost:443:127.0.0.1",
                  "-X", "POST", "https://localhost/api/imagenes/publicar",
                  "-H", "Content-Type: multipart/form-data; boundary=x",
                  "--data-binary", "@-",
              ],
              input=cuerpo,
              capture_output=True,
              check=False,
          )
          codigo = r.stdout.decode().strip()
          if codigo == "413":
              print("Caddy rechazó 7 MB; el límite debe ser 27 MB", file=sys.stderr)
              sys.exit(1)
          if codigo not in {"400", "403"}:
              print(f"código inesperado para 7 MB: {codigo}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: PostgreSQL no se publica y las migraciones corren en el contenedor
        run: |
          # Compose imprime ":0" cuando el puerto solo está expuesto en la red interna.
          mapa="$(docker compose port postgres 5432 2>/dev/null || true)"
          case "$mapa" in
            "" | *:0) ;;
            *)
              echo "PostgreSQL quedó publicado fuera de la red interna: $mapa"
              exit 1
              ;;
          esac
          if nc -z 127.0.0.1 5432 2>/dev/null; then
            echo "PostgreSQL responde en el host: no debe ser alcanzable desde fuera"
            exit 1
          fi
          docker compose exec -T app ./node_modules/.bin/prisma migrate deploy
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1 FROM usuario LIMIT 1;"'

      - name: crear-admin funciona dentro del contenedor
        run: |
          python3 - <<'PY'
          import os, pty, select, time
          pid, fd = pty.fork()
          if pid == 0:
              os.execvp("docker", ["docker", "compose", "exec", "app", "npm", "run", "crear-admin"])
          def esperar(marca, limite=90):
              buf = ""
              fin = time.time() + limite
              while marca not in buf:
                  if time.time() > fin:
                      raise SystemExit(buf[-2000:])
                  listo, _, _ = select.select([fd], [], [], 1)
                  if listo:
                      buf += os.read(fd, 4096).decode("utf-8", "replace")
              return buf
          esperar("Nombre completo:")
          os.write(fd, b"Admin CI\n")
          esperar("Nombre de usuario:")
          os.write(fd, b"admin.ci\n")
          esperar("Rol")
          os.write(fd, b"Gerencia\n")
          esperar("Contraseña")
          os.write(fd, b"Clave-ci-1234\n")
          esperar("Repita")
          os.write(fd, b"Clave-ci-1234\n")
          esperar("Cuenta administradora creada")
          _, estado = os.waitpid(pid, 0)
          codigo = os.waitstatus_to_exitcode(estado)
          if codigo != 0:
              raise SystemExit(codigo)
          PY

      - name: Caddy reemplaza una X-Real-IP falsificada
        run: |
          codigo="$(curl -ksS -o /dev/null -w '%{http_code}' \
            --resolve localhost:443:127.0.0.1 \
            -X POST 'https://localhost/api/auth/picking/sign-in/username' \
            -H 'Origin: https://localhost' \
            -H 'Content-Type: application/json' \
            -H 'X-Real-IP: 203.0.113.9' \
            -H 'X-Forwarded-For: 203.0.113.9' \
            --data '{"usuario":"admin.ci","clave":"incorrecta"}')"
          test "$codigo" = "401"
          ip="$(docker compose exec -T postgres sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT ip FROM bitacora ORDER BY id DESC LIMIT 1;"' \
            | tr -d '[:space:]')"
          echo "IP registrada: $ip"
          test -n "$ip"
          test "$ip" != "203.0.113.9"
          python3 -c 'import ipaddress, sys; ipaddress.ip_address(sys.argv[1])' "$ip"

      - name: "RNF-13: el tiempo real llega a través de Caddy sin búfer"
        # H-47: con la sesión de la cuenta de crear-admin, el primer evento de /api/tiempo-real tiene que llegar en
        # pocos segundos. Con búfer, Caddy lo retendría y curl terminaría sin datos.
        run: |
          set -euo pipefail
          # La base de la CI solo tiene las migraciones: se agrega una sede de prueba.
          sede="$(docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAq' <<'SQL' | tr -d '[:space:]'
          INSERT INTO sede (nombre, prefijo_odoo, tiene_oficina) VALUES ('Prueba CI', 'PCI', true) RETURNING id;
          SQL
          )"
          test -n "$sede"
          sesion="$(mktemp)"
          codigo="$(curl -ksS -o /dev/null -w '%{http_code}' -c "$sesion" \
            --resolve localhost:443:127.0.0.1 \
            -X POST 'https://localhost/api/auth/picking/sign-in/username' \
            -H 'Origin: https://localhost' \
            -H 'Content-Type: application/json' \
            --data '{"usuario":"admin.ci","clave":"Clave-ci-1234"}')"
          test "$codigo" = "200"
          estado=0
          curl -ksSN --max-time 5 -b "$sesion" -D /tmp/sse-cabeceras.txt -o /tmp/sse.txt \
            -w 'primer byte en %{time_starttransfer} s\n' \
            --resolve localhost:443:127.0.0.1 \
            "https://localhost/api/tiempo-real?sede=${sede}&modulo=facturacion" || estado=$?
          # 28: curl cortó por el límite de 5 s con el flujo todavía abierto, como debe ser.
          if [ "$estado" != "28" ]; then
            echo "RNF-13: /api/tiempo-real no quedó abierto (curl terminó con ${estado})"
            cat /tmp/sse-cabeceras.txt /tmp/sse.txt
            exit 1
          fi
          tr -d '\r' </tmp/sse-cabeceras.txt | grep -qi '^content-type: text/event-stream'
          if ! grep -q '^: conectado' /tmp/sse.txt; then
            echo "RNF-13: el primer evento no llegó a través de Caddy en 5 s"
            cat /tmp/sse-cabeceras.txt /tmp/sse.txt
            exit 1
          fi
          echo "RNF-13: el primer evento llegó a través de Caddy."

      - name: Bajar el entorno
        if: always()
        run: |
          if [ -f .env ]; then
            IMAGEN_APP=incovsa-app:ci docker compose down -v
          fi
