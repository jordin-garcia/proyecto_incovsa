# Prueba básica de seguridad con OWASP ZAP (JG-15, specs/16 decisión 66; Documento 6 §8). Compila la aplicación, la
# levanta con el servidor de producción standalone (el mismo de la imagen de Docker) sobre PostgreSQL 18 con la semilla de
# demostración, y corre el escaneo básico de ZAP (araña y reglas pasivas, sin ataques) contra ella. Falla si ZAP reporta
# alguna alerta de riesgo alto. El informe queda como artefacto y su revisión, en plan/seguridad/zap-<fecha>.md.
# Se ejecuta a mano (`gh workflow run zap.yml --ref develop`) y en los PR que cambian este flujo.
name: ZAP

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/zap.yml

concurrency:
  group: zap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  zap:
    name: zap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Base vacía en cada ejecución. La contraseña es solo de este contenedor temporal.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: incovsa
          POSTGRES_PASSWORD: incovsa
          POSTGRES_DB: incovsa_zap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incovsa -d incovsa_zap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://incovsa:incovsa@localhost:5432/incovsa_zap
      ALMACENAMIENTO: disco
      # ZAP 2.17.0 (imagen oficial `stable` del 15/12/2025), fijada por su huella.
      IMAGEN_ZAP: ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Claves aleatorias de cada ejecución: no hay secretos en el repositorio y no sirven fuera de este entorno.
      - name: Generar las claves temporales
        run: |
          for variable in BETTER_AUTH_SECRET_SITIO BETTER_AUTH_SECRET_PICKING CLAVE_DEMO; do
            valor="$(openssl rand -hex 32)"
            echo "::add-mask::$valor"
            echo "$variable=$valor" >> "$GITHUB_ENV"
          done

      - name: Aplicar las migraciones y las semillas
        run: |
          npm run db:aplicar
          npm run db:semilla
          npm run semilla:demo

      - run: npm run build

      # Como el Dockerfile: el servidor standalone necesita public/ y .next/static/ a su lado.
      - name: Levantar el servidor de producción
        env:
          NODE_ENV: production
          PORT: "3000"
          HOSTNAME: 127.0.0.1
          BETTER_AUTH_URL: http://localhost:3000
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          nohup node .next/standalone/server.js > "$RUNNER_TEMP/servidor.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/acceso; then exit 0; fi
            sleep 1
          done
          echo "::error::El servidor de producción no respondió en 90 s."
          cat "$RUNNER_TEMP/servidor.log"
          exit 1

      # Escaneo básico: araña de 5 minutos y reglas pasivas (incluidas las alfa). -I: las advertencias no fallan aquí;
      # el paso siguiente decide con el nivel de riesgo.
      - name: Escanear con ZAP
        run: |
          mkdir -p zap
          chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$IMAGEN_ZAP" \
            zap-baseline.py -t http://localhost:3000 -m 5 -a -I \
            -J informe.json -r informe.html -w informe.md

      - name: Resumir y fallar con alertas altas
        run: |
          node <<'JS'
            const informe = require("./zap/informe.json");
            const riesgos = { 3: "Alto", 2: "Medio", 1: "Bajo", 0: "Informativo" };
            const alertas = informe.site.flatMap((sitio) => sitio.alerts);
            const filas = alertas
              .sort((a, b) => b.riskcode - a.riskcode)
              .map((a) => `| ${a.pluginid} | ${a.alert} | ${riesgos[a.riskcode]} | ${a.count} |`);
            const resumen = ["## ZAP: alertas", "", "| Regla | Alerta | Riesgo | Instancias |", "|---|---|---|---|", ...filas];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, resumen.join("\n") + "\n");
            console.log(resumen.join("\n"));
            const altas = alertas.filter((a) => Number(a.riskcode) === 3);
            if (altas.length > 0) {
              console.error(`::error::ZAP reportó ${altas.length} alerta(s) de riesgo alto.`);
              process.exit(1);
            }
          JS

      - name: Conservar el informe y el registro del servidor
        if: ${{ !cancelled() }}
        run: cp "$RUNNER_TEMP/servidor.log" zap/servidor.log || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: zap-${{ github.run_id }}
          path: zap/
          if-no-files-found: warn
          retention-days: 30
